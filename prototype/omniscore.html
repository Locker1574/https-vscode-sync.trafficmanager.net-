    case 'btts':{const both=st.hg>0&&st.ag>0;return sp.v?(both?'V':F?'P':null):(both?'P':F?'V':null)}

    case 'dnb':if(!F)return null;if(st.hg===st.ag)return'R';return outcome(st.hg,st.ag)===sp.v?'V':'P';
    case 'htres':return st.htDone?(sp.v.includes(outcome(st.htH,st.htA))?'V':'P'):null;

}

/* Indice de confiance OMNISCORE */

/* Cotation de chaque sélection (bruit déterministe par match) */
function priceSels(m){
  const rs=mulberry32(hashStr(DATA.seed+':px:'+m.id));const g=()=>gaussOf(rs);
  m.sels=SPECS.map((x,i)=>{
    const p=clamp(probSel(x.sp,m,ZERO),.004,.996);
    const pm=clamp(p+g()*.018,.02,.985);
    let best=0,bk='';const odds={};
    BOOKS.forEach((b,k)=>{
      const pb=clamp(pm+g()*(k===0?.006:.015),.015,.99);
      const o=k===0?1/(pb*1.02):k===1?1+(1/pb-1)*.98:1/(pb*(1.035+rs()*.035));

    });

    const subs=[p+g()*.03,p+g()*.035,p+g()*.025];const mu=(subs[0]+subs[1]+subs[2])/3;
    const sd=Math.sqrt(subs.reduce((s,v)=>s+(v-mu)**2,0)/3);
    const A=clamp(1-sd/.5,0,1),V=clamp(Math.abs(g())*.05,0,.2),Mk=clamp(1-Math.abs(p-pSharp),0,1);
    return{id:m.id+'-'+i,key:keyOf(x.sp),g:x.g,sp:x.sp,label:labelOf(x.sp,m),p,best,bk,odds,fair:1/p,val:p*best-1,A,V,M:Mk,ic:icOf(p,A,m.D,Mk,m.risk/100,V),subs};

}

/* ============ Génération des données de démonstration ============ */
let DATA;
const TEAMS={};
const TN=id=>TEAMS[id].n;
function genTeams(){
  LEAGUES.forEach(L=>{
    L.teams.forEach((n,i)=>{
      const id=L.id+i;const att=rnd(.72,1.42),def=rnd(.72,1.32);
      TEAMS[id]={id,n,lg:L.id,att,def,
        r:{corners:[rnd(3.6,6.6),rnd(3.6,6.2)],shots:[rnd(8.5,16.5),rnd(8.5,15.5)],sot:[0,0],cards:[rnd(1.3,2.6),0],fouls:[rnd(9,14),rnd(9,14)],
           off:[rnd(1.1,2.7),rnd(1.1,2.5)],assists:[0,0],tackles:[rnd(13,22),rnd(13,22)],throw:[rnd(17,26),rnd(17,26)],xg:[0,0]},
        abs:Math.floor(rnd(0,3.99))};
      const t=TEAMS[id];t.r.shots[0]*=att/1.05;t.r.shots[1]*=def/1.0;
      t.r.sot=[t.r.shots[0]*rnd(.3,.4),t.r.shots[1]*rnd(.3,.4)];t.r.cards[1]=rnd(1.3,2.6);
      t.r.xg=[1.35*att,1.2*def];t.r.assists=[1.3*att*.7,1.2*def*.7];
      t.elo=Math.round(1500+(att-def)*420+gauss()*25);
    });
    const ranked=L.teams.map((_,i)=>TEAMS[L.id+i]).sort((a,b)=>(b.att/b.def)-(a.att/a.def));
    ranked.forEach((t,k)=>{t.pos=k+1;t.pts=Math.round(62-k*4.2+rnd(-3,3))});
  });
  // Historique des 10 derniers matchs par statistique (+ anomalies injectées)
  Object.values(TEAMS).forEach(t=>{
    t.h={};
    METRICS.forEach(M=>{
      const[f,a]=t.r[M.k];
      const gen=l=>M.k==='xg'?+Math.max(0,l*rnd(.45,1.6)).toFixed(2):poisS(l);
      const hf=Array.from({length:10},()=>gen(f)),ha=Array.from({length:10},()=>gen(a));
      if(R()<.05&&M.k!=='xg')hf[9]=Math.round(f*rnd(2.2,2.9));

function stakeOf(m){
  const h=TEAMS[m.h],a=TEAMS[m.a];
  const best=Math.min(h.pos,a.pos),worst=Math.max(h.pos,a.pos);
  if(m.derby)return{idx:95,label:'Derby',txt:'Rivalité régionale : intensité et cartons en hausse, forme récente moins prédictive.'};
  if(best<=2&&worst<=4)return{idx:92,label:'Course au titre',txt:'Choc du haut de tableau : titre et prime de champion (≈ 40-50 M€ de droits TV et primes, estimation indicative).'};
  if(worst>=9)return{idx:85,label:'Maintien',txt:'Lutte pour le maintien : une relégation coûte ≈ 50-70 M€ de revenus (droits TV, sponsors), estimation indicative.'};
  if(best<=4)return{idx:74,label:'Places européennes',txt:'Qualification européenne en jeu (≈ 15-25 M€ de primes de participation, estimation indicative).'};

function genInteg(m){
  const p1=probSel({t:'res',v:'1'},m,ZERO);
  const o0=1/(clamp(p1,.05,.95)*1.05)*(1+gauss()*.04);
  const u=R();const kind=u<.08?'major':u<.22?'minor':'none';
  const at=Math.floor(rnd(28,44)),mag=kind==='major'?rnd(.08,.32):rnd(.03,.07),dir=R()<.7?-1:1,steps=kind==='major'?3:1;
  const hist=[];let o=o0;
  for(let k=0;k<48;k++){o*=Math.exp(gauss()*.006);if(kind!=='none'&&k>=at&&k<at+steps)o*=Math.exp(dir*mag/steps);hist.push(+o.toFixed(3))}
  const rets=hist.slice(1).map((v,k)=>Math.log(v/hist[k]));
  const med=[...rets.map(Math.abs)].sort((a,b)=>a-b)[Math.floor(rets.length/2)]||.004;const sig=1.4826*med;
  m.oh=hist;m.ilog=[];let maxZ=0;
  rets.forEach((r,k)=>{const z=Math.abs(r)/sig;maxZ=Math.max(maxZ,z);
    if(z>3.2){const sev=z<5?1:z<9?2:z<15?3:4;
      m.ilog.push({t:m.ko-(47-k-1)*30*60e3,txt:(r<0?'Baisse':'Hausse')+' de la cote « victoire '+TN(m.h)+' »',pct:(Math.exp(r)-1)*100,z,sev})}});
  const div=kind==='major'?rnd(.04,.12):kind==='minor'?rnd(.01,.05):rnd(0,.025);
  const vol=kind==='major'&&R()<.75;
  m.signals=[];
  if(maxZ>6)m.signals.push('Mouvement de cote rapide sans information publique (z = '+dec(maxZ)+')');
  if(div>.04)m.signals.push('Divergence entre bookmakers et exchange ('+dec(div*100)+' pts de probabilité)');
  if(vol)m.signals.push('Volume inhabituel sur l\'exchange au moment du mouvement');
  if(m.derby&&kind!=='none')m.signals.push('Contexte à forte pression (derby)');
  m.dir=dir;
  m.risk=Math.round(clamp(clamp((maxZ-3.2)*6,0,70)+(div>.04?div*160:0)+(vol?12:0),0,100));
}
function simFinal(m){
  const st=zeroSt();st.minute=94;st.finished=true;st.htDone=true;
  st.hg=poisS(m.lh);st.ag=poisS(m.la);st.htH=binom(st.hg,.44);st.htA=binom(st.ag,.44);
  st.corners=poisS(m.stat.corners);st.cH=binom(st.corners,.55);st.cards=poisS(m.stat.cards);st.kH=binom(st.cards,.48);
  st.sot=Math.max(poisS(m.stat.sot),st.hg+st.ag);st.sH=Math.max(binom(st.sot,m.lh/(m.lh+m.la)),st.hg);if(st.sot-st.sH<st.ag)st.sot=st.sH+st.ag;
  st.shots=st.sot+poisS(m.stat.sot*1.6);st.shH=Math.round(st.shots*m.lh/(m.lh+m.la));
  st.fouls=poisS(m.stat.fouls);st.offsides=poisS(m.stat.offsides);
  st.xgH=+(m.lh*rnd(.6,1.4)).toFixed(2);st.xgA=+(m.la*rnd(.6,1.4)).toFixed(2);st.poss=Math.round(50+(TEAMS[m.h].att-TEAMS[m.a].att)*25+gauss()*5);

function genData(seed,genAt){
  rng=mulberry32(hashStr(seed));
  genTeams();
  const matches=[];let id=0;
  const slots=[];
  for(let d=-3;d<=4;d++){
    if(d===0){for(let i=0;i<4;i++)slots.push({off:-rnd(2.6,7),st:'FT'});for(let i=0;i<6;i++)slots.push({off:0,st:'LIVE'});for(let i=0;i<10;i++)slots.push({off:rnd(.4,11),st:'NS'})}
    else for(let i=0;i<12;i++)slots.push({off:d*24+rnd(-6,6),st:d<0?'FT':'NS'});
  }
  // appariements : une équipe ne joue qu'une fois par « jour »
  const byDay={};
  slots.forEach(s=>{const d=Math.round(s.off/24);(byDay[d]=byDay[d]||[]).push(s)});
  Object.values(byDay).forEach(list=>{
    const pairs=[];LEAGUES.forEach(L=>{const sh=shuffle(L.teams.map((_,i)=>L.id+i));for(let i=0;i<sh.length;i+=2)pairs.push([sh[i],sh[i+1],L.id])});
    const ps=shuffle(pairs);
    list.forEach((s,i)=>{const[h,a,lg]=ps[i%ps.length];
      const m={id:'m'+(id++),h,a,lg,ko:genAt+s.off*H,status:s.st,ref:Math.floor(R()*REFS.length),derby:R()<.07,D:rnd(.8,1),mom:[],ev:[]};
      m.refF=rnd(.85,1.25);
      matches.push(m);
    });
  });
  matches.forEach(m=>{
    const h=TEAMS[m.h],a=TEAMS[m.a];
    m.stake=stakeOf(m);
    const mot=m.stake.idx>80?1.03:m.stake.idx<50?.97:1;
    const absH=1-h.abs*.035,absA=1-a.abs*.035;
    m.lh=+(1.36*h.att*a.def*mot*absH).toFixed(3);m.la=+(1.10*a.att*h.def*mot*absA).toFixed(3);
    m.stat={
      corners:(h.r.corners[0]+a.r.corners[1])/2*1.05+(a.r.corners[0]+h.r.corners[1])/2*.95,

      sot:(h.r.sot[0]+a.r.sot[1])/2+(a.r.sot[0]+h.r.sot[1])/2*.92,
      fouls:(h.r.fouls[0]+a.r.fouls[0]),offsides:(h.r.off[0]+a.r.off[0])
    };

  });

}

/* ============ Simulation live (1 s = 30 s de jeu) ============ */
function liveTick(m,quiet){
  const st=m.st,dt=.5,prevMin=st.minute;st.minute+=dt;
  const f=.8+.4*(st.minute/93);const[ah,aa]=adjL(m,st);
  const last=m.mom.length?m.mom[m.mom.length-1]:0;
  const drift=(TEAMS[m.h].att-TEAMS[m.a].att)*.08;
  const mo=clamp(last*.9+drift+gauss()*.28,-1,1);m.mom.push(+mo.toFixed(2));if(m.mom.length>60)m.mom.shift();
  const shH=.5+mo*.3;
  const ev=(type,team,extra)=>{m.ev.push({min:Math.floor(st.minute),type,team,...extra});if(m.ev.length>40)m.ev.shift()};
  if(R()<ah/90*dt*f*(1+mo*.25)){st.hg++;st.shots++;st.shH++;st.sot++;st.sH++;st.xgH+=rnd(.15,.6);ev('But','h');if(!quiet)notifyGoal(m,'h')}
  if(R()<aa/90*dt*f*(1-mo*.25)){st.ag++;st.shots++;st.sot++;st.xgA+=rnd(.15,.6);ev('But','a');if(!quiet)notifyGoal(m,'a')}
  const shotRate=(TEAMS[m.h].r.shots[0]+TEAMS[m.a].r.shots[0])/90*dt;
  if(R()<shotRate){const hm=R()<shH;st.shots++;if(hm)st.shH++;const x=rnd(.02,.3);if(hm)st.xgH+=x;else st.xgA+=x;if(R()<.34){st.sot++;if(hm)st.sH++}}
  if(R()<m.stat.corners/90*dt){st.corners++;if(R()<shH)st.cH++}
  if(R()<m.stat.cards/90*dt*(.6+.8*st.minute/93)){st.cards++;const hm=R()<.48;if(hm)st.kH++;ev('Carton',hm?'h':'a')}
  if(R()<.12/186){if(R()<.5){st.redH++;ev('Rouge','h')}else{st.redA++;ev('Rouge','a')}}
  if(R()<m.stat.fouls/90*dt)st.fouls++;
  if(R()<m.stat.offsides/90*dt)st.offsides++;
  st.poss=Math.round(clamp(st.poss*.9+(50+mo*14)*.1,25,75));
  if(prevMin<45&&st.minute>=45){st.htDone=true;st.htH=st.hg;st.htA=st.ag;ev('Mi-temps','')}
  if(!quiet&&R()<.0015){
    const sev=Math.floor(rnd(2,4.99)),pct=(R()<.5?-1:1)*rnd(8,30);
    m.ilog.push({t:Date.now(),txt:'Mouvement de cote live sans événement de jeu ('+Math.floor(st.minute)+'e min)',pct,z:sev*4,sev,live:true});
    m.risk=Math.min(100,m.risk+sev*6);
    if(sev>=3)toast('Intégrité : mouvement '+SEVN[sev].toLowerCase()+' sur '+TN(m.h)+' – '+TN(m.a),'var(--or)');
  }
  if(st.minute>=90+(m.stop||4)){st.finished=true;m.status='FT';ev('Fin du match','');if(!quiet)onFinish(m)}
}
function startLive(m,warm){

/* ============ Suivi et règlement des prédictions ============ */
function trackTop(m){
  const used=new Set();const out=[];
  m.sels.filter(s=>s.p>=.65&&s.p<=.98).sort((a,b)=>b.ic-a.ic).forEach(s=>{if(out.length<3&&!used.has(s.g)){used.add(s.g);out.push(s)}});
  out.forEach(s=>DATA.T.push({id:'t'+DATA.T.length,mid:m.id,key:s.key,sp:s.sp,g:s.g,label:s.label,p:s.p,odds:s.best,ic:s.ic,val:s.val,status:'A',at:m.ko-6*H,set:null,live:false}));
}
function settle(m){
  DATA.T.forEach(t=>{
    if(t.mid!==m.id||!'AC'.includes(t.status))return;
    if(m.status!=='NS'&&t.status==='A')t.status='C';
    if(m.status==='NS')return;
    const r=evalSel(t.sp,m.st);
    if(r){t.status=r;t.set=Date.now();
      if(S.ready&&(S.favs.has(m.id)||t.live))toast((r==='V'?'Validé ✓ ':r==='P'?'Perdu ✗ ':'Remboursé ')+t.label+' ('+TN(m.h)+' – '+TN(m.a)+')',r==='V'?'var(--ok)':r==='P'?'var(--ba)':'var(--mu)')}
  });
}
function liveSpecs(m){

  L.push({g:'Résultat',sp:{t:'res',v:'1X'}},{g:'Résultat',sp:{t:'res',v:'X2'}});
  [tg+.5,tg+1.5].forEach(l=>{L.push({g:'Buts',sp:{t:'tot',s:'goals',o:'O',l}},{g:'Buts',sp:{t:'tot',s:'goals',o:'U',l}})});
  if(!(st.hg>0&&st.ag>0))L.push({g:'Buts',sp:{t:'btts',v:true}},{g:'Buts',sp:{t:'btts',v:false}});
  if(!st.htDone){const ht=st.hg+st.ag;['1','X','2'].forEach(v=>L.push({g:'1re mi-temps',sp:{t:'htres',v}}));L.push({g:'1re mi-temps',sp:{t:'httot',o:'O',l:ht+.5}},{g:'1re mi-temps',sp:{t:'httot',o:'U',l:ht+.5}})}
  L.push({g:'Corners',sp:{t:'tot',s:'corners',o:'O',l:st.corners+1.5}},{g:'Corners',sp:{t:'tot',s:'corners',o:'U',l:st.corners+3.5}});
  L.push({g:'Cartons',sp:{t:'tot',s:'cards',o:'O',l:st.cards+.5}},{g:'Cartons',sp:{t:'tot',s:'cards',o:'U',l:st.cards+1.5}});
  return L.map(x=>{const p=clamp(probSel(x.sp,m,st),.001,.999);const V=clamp(.05+(st.minute<15?.1:0),0,.2);
    return{g:x.g,sp:x.sp,key:keyOf(x.sp),label:labelOf(x.sp,m),p,ic:icOf(p,.95,1,.95,m.risk/100,V)}});
}
function nextGoal(m){const st=m.st;const r=remF(st);const[ah,aa]=adjL(m,st);const lh=ah*r,la=aa*r,t=lh+la;const pn=Math.exp(-t);return{h:(1-pn)*lh/(t||1),a:(1-pn)*la/(t||1),n:pn}}
function autoTrackLive(m){
  if(m.st.minute>84||m.st.minute<8)return;
  const mine=DATA.T.filter(t=>t.mid===m.id&&t.live).length;if(mine>=3)return;
  const have=new Set(DATA.T.filter(t=>t.mid===m.id).map(t=>t.key));
  const c=m.live.filter(s=>s.p>=.80&&s.p<=.97&&!have.has(s.key)&&!evalSel(s.sp,m.st)).sort((a,b)=>b.ic-a.ic)[0];
  if(c&&R()<.04){
    DATA.T.push({id:'t'+DATA.T.length,mid:m.id,key:c.key,sp:c.sp,g:c.g,label:c.label+' ('+Math.floor(m.st.minute)+'e)',p:c.p,odds:+Math.max(1.01,1/(c.p*1.05)).toFixed(2),ic:c.ic,val:-.05,status:'C',at:Date.now(),set:null,live:true});
    if(S.favs.has(m.id))toast('Nouvelle prédiction live suivie : '+c.label+' – '+pc(c.p),'var(--info)');
  }
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({seed:DATA.seed,genAt:DATA.genAt,T:DATA.T,
    ms:DATA.matches.map(m=>({id:m.id,status:m.status,st:m.st||null,ev:m.ev,mom:m.mom,lh:m.lh,la:m.la,ilog:m.ilog,risk:m.risk,ko:m.ko,stop:m.stop})),
    u:{favs:[...S.favs],favTeams:[...S.favTeams],coupon:S.coupon,couponHist:S.couponHist,notes:S.notes.slice(0,40),tab:S.tab,bets:S.bets.slice(0,300),bank:S.bank,rules:S.rules,hits:S.hits.slice(0,60),seen:[...S.seen].slice(-3000),chat:S.chat.filter(t=>!t.pending).slice(-20)},savedAt:Date.now()}))}catch(e){}
}
function load(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const now=Date.now();
  if(saved&&now-saved.genAt<8*H){
    DATA=genData(saved.seed,saved.genAt);
    const byId=Object.fromEntries(saved.ms.map(x=>[x.id,x]));
    DATA.matches.forEach(m=>{const x=byId[m.id];if(!x)return;Object.assign(m,{status:x.status,st:x.st,ev:x.ev||[],mom:x.mom||[],lh:x.lh,la:x.la,ilog:x.ilog,risk:x.risk,ko:x.ko,stop:x.stop})});
    rng=Math.random;
    DATA.matches.forEach(priceSels);
    DATA.T=saved.T||[];
    const u=saved.u||{};S.favs=new Set(u.favs||[]);S.favTeams=new Set(u.favTeams||[]);S.coupon=u.coupon||null;S.couponHist=u.couponHist||[];S.notes=u.notes||[];if(u.tab)S.tab=u.tab;S.bets=u.bets||[];if(u.bank)S.bank={...S.bank,...u.bank};S.rules=u.rules||[];S.hits=u.hits||[];S.seen=new Set(u.seen||[]);S.chat=u.chat||[];
    // rattrapage du temps écoulé pendant l'absence (max 20 min de jeu)
    const missed=Math.min(40,Math.floor((now-(saved.savedAt||now))/1000));
    for(let i=0;i<missed;i++)DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>liveTick(m,true));
    DATA.matches.forEach(m=>{if(m.status==='FT'&&m.st&&!m.st.finished)m.st.finished=true;settle(m)});
    ensureLive();
  }else{
    const genAt=Math.floor(now/H)*H;
    DATA=genData('omni-'+genAt,genAt);
    DATA.matches.forEach(m=>{if(m.status==='FT')m.st=simFinal(m)});
    DATA.matches.forEach(priceSels);
    DATA.matches.forEach(trackTop);
    rng=Math.random;
    DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>startLive(m,Math.floor(rnd(2,80))));
    DATA.matches.forEach(settle);
  }
  DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>{m.live=liveSpecs(m)});
}
function ensureLive(){
  while(DATA.matches.filter(m=>m.status==='LIVE').length<6){
    const n=DATA.matches.filter(m=>m.status==='NS').sort((a,b)=>a.ko-b.ko)[0];if(!n)break;n.ko=Date.now();startLive(n,0);
  }
}

/* ============ Boucles temps réel ============ */
function tick(){
  DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>{
    const g0=m.st.hg+m.st.ag;liveTick(m,false);
    if(m.status==='LIVE'){m.live=liveSpecs(m);autoTrackLive(m);settle(m)}
    if(m.st.hg+m.st.ag!==g0)settle(m);
  });
  if(settleBets()&&S.tab==='bankroll')renderDyn();
  $('#clock').textContent='Mise à jour '+hms(Date.now());
  if(['home','live','cal','journal','integ','favs'].includes(S.tab))renderDyn();
  if(S.drawer){const m=MB(S.drawer);if(m&&m.status==='LIVE')renderDrawer()}
  renderNav();
}
function marketTick(){
  // mouvements de marché pré-match : nouvelles infos, cotes qui bougent
  const ns=DATA.matches.filter(m=>m.status==='NS');
  for(let i=0;i<4&&ns.length;i++){
    const m=ns[Math.floor(Math.random()*ns.length)];
    m.lh=+(m.lh*(1+gauss()*.015)).toFixed(3);m.la=+(m.la*(1+gauss()*.015)).toFixed(3);
    priceSels(m);
    const o=m.oh[m.oh.length-1]*Math.exp(gauss()*.006);m.oh.push(+o.toFixed(3));if(m.oh.length>60)m.oh.shift();
  }
  S.lastData=Date.now();
  checkRules();
  if(['value','home','alerts'].includes(S.tab))renderDyn();
  save();
}

/* ============ Composants ============ */
function ring(p,size=46){
  const r=size/2-5,c=2*Math.PI*r,cls=confCls(p);
  return`<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${pc(p)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--c)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle">${Math.round(p*100)}</text></svg>`;
}
function spark(arr,w=160,h=40,alert=false){
  if(!arr||arr.length<2)return'';
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1,pad=4;
  const X=i=>pad+i*(w-2*pad)/(arr.length-1),Y=v=>h-pad-(v-mn)/rg*(h-2*pad);
  const d=arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return`<svg class="spark${alert?' alert':''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution"><line class="grid" x1="${pad}" x2="${w-pad}" y1="${h/2}" y2="${h/2}"/><path class="a" d="${d} L${X(arr.length-1).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z"/><path class="l" d="${d}"/><circle cx="${X(arr.length-1).toFixed(1)}" cy="${Y(arr[arr.length-1]).toFixed(1)}" r="2.8"/></svg>`;
}
function bars(arr,w=150,h=34,flagLast=false){
  const mx=Math.max(...arr,1),bw=(w-2)/arr.length;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="10 derniers matchs">${arr.map((v,i)=>{const bh=Math.max(1.5,v/mx*(h-2));return`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${flagLast&&i===arr.length-1?'var(--or)':'var(--ac2)'}" opacity="${i===arr.length-1?1:.55}"/>`}).join('')}</svg>`;
}
function momentum(m,w=300,h=44){
  const a=m.mom.slice(-40);if(!a.length)return'';const bw=w/40;
  return`<svg class="mom" width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Momentum"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="var(--ln)"/>${a.map((v,i)=>{const bh=Math.abs(v)*(h/2-2);return`<rect x="${(i*bw).toFixed(1)}" y="${(v>0?h/2-bh:h/2).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${v>0?'var(--ac)':'var(--ac2)'}"/>`}).join('')}</svg>`;
}

   <div><div class="row" style="justify-content:space-between;font-size:11.5px" class="mu"><span class="mu">Pression ${esc(TN(m.h))}</span><span class="mu">Pression ${esc(TN(m.a))}</span></div>${momentum(m)}</div>

/* ---- Coupons ---- */
const scoreOf=(mode,s)=>mode==='surete'?s.p*s.ic:mode==='rendement'?s.best*s.ic:Math.sqrt(s.p)*(s.p*s.best)*s.ic;
function candidates({scope,min,max,q,excl,mode}){
  const now=Date.now(),hz=scope==='jour'?30:96;
  return DATA.matches.filter(m=>m.status==='NS'&&m.ko>now+5*60e3&&m.ko<now+hz*H&&lvl(m.risk)<=1&&!(excl&&excl.has(m.id))&&(!q||matchText(m).includes(q)))
    .map(m=>{const c=m.sels.filter(s=>s.p>=min&&s.p<=max);if(!c.length)return null;const s=c.reduce((a,b)=>scoreOf(mode,b)>scoreOf(mode,a)?b:a);return{mid:m.id,selId:s.id,key:s.key,label:s.label,p:s.p,odds:s.best,ic:s.ic,val:s.val,g:s.g,sc:scoreOf(mode,s)}})
    .filter(Boolean).sort((a,b)=>b.sc-a.sc);
}
function generate(n,o){return candidates(o).slice(0,n)}
const couponOpts=()=>({scope:'jour',min:S.cMin/100,max:.98,q:S.cQ.trim().toLowerCase(),mode:S.cMode});
function refreshItem(it){const m=MB(it.mid);const s=m&&m.status==='NS'&&m.sels.find(x=>x.key===it.key);if(s){it.p=s.p;it.odds=s.best;it.ic=s.ic;it.val=s.val}return it}
function doGenerate(){
  const items=generate(S.cSize,couponOpts());
  S.coupon={items,at:Date.now(),size:S.cSize};S.alt=null;
  S.couponMsg=items.length<S.cSize?`Seulement ${items.length} sélection(s) remplissent les critères (${S.cMin}-98 %, intégrité verte ou jaune). Baissez le seuil ou élargissez la recherche.`:`Coupon généré : ${items.length} sélections entre ${S.cMin} et 98 %.`;
  pushHist();save();render();
}
function doRegenerate(){
  if(!S.coupon||S.coupon.size!==S.cSize)return doGenerate();
  const cur=S.coupon.items.map(refreshItem);
  const excl=new Set(cur.map(i=>i.mid));
  const nw=generate(S.cSize,{...couponOpts(),excl});
  const locked=cur.filter(i=>i.lock),free=cur.filter(i=>!i.lock).sort((a,b)=>b.p-a.p);
  const pool=nw.slice();const final=[...locked];let rep=0;
  free.forEach(old=>{const k=pool.findIndex(n=>n.p>old.p||(n.p===old.p&&n.ic>old.ic));if(k>=0){final.push({...pool[k],isNew:true});pool.splice(k,1);rep++}else final.push({...old,isNew:false})});
  while(final.length<S.cSize&&pool.length){final.push({...pool.shift(),isNew:true});rep++}
  S.alt=nw;
  S.coupon={items:final.map(i=>({...i,lock:!!i.lock})),at:Date.now(),size:S.cSize};
  S.couponMsg=rep?`${rep} sélection(s) remplacée(s) par un pourcentage plus élevé (surlignées). Les autres sont conservées.`:'Coupon déjà optimal : les nouvelles sélections ont un pourcentage plus faible, les meilleures sont conservées. Les nouvelles propositions sont affichées à côté.';
  pushHist();save();render();
}
function pushHist(){const c=S.coupon;if(!c)return;const pr=c.items.reduce((a,i)=>a*i.p,1),o=c.items.reduce((a,i)=>a*i.odds,1);S.couponHist.unshift({at:c.at,n:c.items.length,p:pr,o});S.couponHist=S.couponHist.slice(0,8)}
function couponList(items,showLock){
  const pr=items.reduce((a,i)=>a*i.p,1),o=items.reduce((a,i)=>a*i.odds,1);
  return`<div class="list">${items.map((i,k)=>{const m=MB(i.mid);return`<div class="cp-item${i.isNew?' new':''}"><span class="ix">${k+1}</span>
    <div class="teams" data-act="open:${m.id}" style="cursor:pointer"><span style="font-weight:600">${esc(i.label)}</span><span class="mu" style="font-size:12px">${esc(TN(m.h))} – ${esc(TN(m.a))} · ${hm(m.ko)} · ${LGN(m.lg)}</span></div>
    <span class="cp ${confCls(i.p)}">${pc(i.p)}</span><span class="num hide-s">${od(i.odds)}</span>
    ${showLock?`<button class="lock${i.lock?' on':''}" data-act="lock:${k}" aria-label="Verrouiller">${i.lock?'🔒':'🔓'}</button>`:'<span></span>'}</div>`}).join('')}
    <div class="total"><div><b>${pc(pr)}</b><span>probabilité combinée</span></div><div><b>${od(o)}</b><span>cote totale</span></div><div><b>${dec((pr*o-1)*100)} %</b><span>espérance (EV)</span></div><div><b>${items.length}</b><span>sélections</span></div></div></div>`;
}

   ${S.alt?`<div><h3 style="margin-bottom:8px">Nouvelle proposition</h3>${S.alt.length?couponList(S.alt,false):'<div class="list"><div class="empty">Aucune autre sélection disponible.</div></div>'}</div>`:''}</div>
   ${w}
   ${S.couponHist.length?`<div><h3 style="margin-bottom:8px">Historique des générations</h3><div class="tw panel" style="padding:0"><table><thead><tr><th>Heure</th><th class="r">Sélections</th><th class="r">Proba. combinée</th><th class="r">Cote</th></tr></thead><tbody>${S.couponHist.map(h=>`<tr><td class="num">${hms(h.at)}</td><td class="r num">${h.n}</td><td class="r num">${pc(h.p)}</td><td class="r num">${od(h.o)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;

V.combo={head:()=>`<div class="ph"><div><div class="eyebrow">Combo</div><h2>Composer un combiné sur mesure</h2><p>Le résultat se recalcule à chaque réglage.</p></div></div>
 <div class="panel" style="display:flex;flex-direction:column;gap:14px">
  <div class="row"><div class="chips">${[['jour','Matchs du jour'],['avenir','Matchs à venir (4 jours)']].map(([k,n])=>`<button class="chip${S.comboScope===k?' on':''}" data-act="comboScope:${k}">${n}</button>`).join('')}</div></div>
  <div class="row" style="gap:22px">
   <label class="lbl" for="comboN"><span>Nombre de matchs : <b id="comboNV" style="color:var(--tx)">${S.comboN}</b></span><input id="comboN" type="range" min="1" max="20" value="${S.comboN}" data-in="comboN"></label>
   <div class="lbl">Sélection rapide<div class="chips">${[2,3,5,8,10].map(n=>`<button class="chip${S.comboN===n?' on':''}" data-act="comboN:${n}">${n}</button>`).join('')}</div></div>

  <div class="row"><div class="chips">${[['rendement','Rendement'],['surete','Sûreté'],['equilibre','Équilibré']].map(([k,n])=>`<button class="chip${S.comboMode===k?' on':''}" data-act="comboMode:${k}">${n}</button>`).join('')}</div>

dyn:()=>{

V.journal={head:()=>`<div class="ph"><div><div class="eyebrow">Journal</div><h2>Statut de toutes les prédictions</h2><p>Chaque prédiction suivie, avec la cote prise, le statut et la performance réelle du modèle.</p></div></div>

dyn:()=>{

  let L=DATA.T.filter(t=>{const m=MB(t.mid);if(S.jPer==='day'&&Math.abs(m.ko-now)>24*H)return false;if(S.jPer==='7d'&&m.ko<now-7*24*H)return false;return S.jG==='all'||t.g===S.jG});
  const cnt=k=>L.filter(t=>t.status===k).length;const pf=perf(L);

  const alerts=[];Object.values(TEAMS).forEach(t=>METRICS.forEach(M=>{if(M.k==='xg')return;const f=t.h[M.k].f,prev=f.slice(0,9),mu=prev.reduce((s,v)=>s+v,0)/9,sd=Math.sqrt(prev.reduce((s,v)=>s+(v-mu)**2,0)/9)||1,z=(f[9]-mu)/sd;if(z>2.5)alerts.push({t,M,v:f[9],mu,z,sev:z<3.5?1:z<5?2:z<7?3:4})}));
  alerts.sort((a,b)=>b.z-a.z);

/* ---- Méthode ---- */
V.method={dyn:()=>`<div class="method panel" style="display:flex;flex-direction:column;gap:10px">
 <div class="eyebrow">Méthode</div><h2>Comment OMNISCORE calcule ses pourcentages</h2>
 <p><b>Prototype.</b> Les équipes, cotes et statistiques de cette démo sont simulées. Le moteur, lui, est réel : il suffit de le brancher sur une API sous licence (Opta, Sportradar, API-Football, The Odds API…).</p>
 <h3>1. Buts attendus et scores</h3><p>Pour chaque match : <code>λ_dom = 1,36 × attaque_dom × défense_ext × enjeu × absences</code>, puis une matrice de scores de Poisson avec la correction Dixon-Coles (ρ = −0,07) sur les scores 0-0, 1-0, 0-1 et 1-1. Tous les marchés de buts (1X2, double chance, remboursé si nul, plus/moins, les deux marquent, 1re mi-temps) sont dérivés de cette matrice.</p>
 <h3>2. Corners, cartons, tirs cadrés, fautes, hors-jeux</h3><p>Modèles de comptage de Poisson combinant la moyenne pour de l'équipe et la moyenne contre de l'adversaire, ajustés par l'arbitre, le derby et l'enjeu.</p>
 <h3>3. Live</h3><p>Intensité restante <code>λ(t) = λ × temps restant × cartons rouges × état du score</code>, recalculée à chaque événement. Les buts sont plus fréquents en fin de match, une équipe menée attaque davantage, un carton rouge réduit l'équipe touchée.</p>
 <h3>4. Indice de confiance</h3><p><code>IC = 100 × p × A^0,6 × D^0,7 × M^0,9 × (1 − R)^1,2 × (1 − V)^0,5</code> : A accord entre sous-modèles, D complétude des données, M accord avec la cote de référence, R risque intégrité, V volatilité.</p>
 <h3>5. Value et mise</h3><p><code>value = p × cote − 1</code> ; mise <code>¼ × (p × cote − 1) / (cote − 1)</code>.</p>
 <h3>6. Intégrité</h3><p>Rendements logarithmiques de la cote, z-score robuste (médiane des écarts absolus), divergence bookmakers/exchange et volume. Score 0-100 : vert &lt; 25, jaune &lt; 50, orange &lt; 75, rouge au-delà. Les matchs orange et rouges sont exclus des coupons.</p>
 <div class="warn">Aucune prédiction n'est garantie. Les pourcentages sont des probabilités, vérifiables dans le Journal (calibration). Réservé aux 18 ans et plus. Jouez de manière responsable : fixez-vous des limites, et demandez de l'aide si le jeu devient un problème.</div>
</div>`};

/* ============ Bankroll : suivi des mises ============ */
const bankNow=()=>S.bank.init+S.bets.reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0);
const bankPending=()=>S.bets.filter(b=>b.status==='C').reduce((s,b)=>s+b.stake,0);
function dayLoss(){const t0=Date.now()-24*H;return -S.bets.filter(b=>b.set&&b.set>t0).reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0)}
function suggestStake(p,odds){
  const cap=bankNow()*S.bank.maxPct/100;
  const k=(p*odds-1)/(odds-1);
  if(k>0)return{stake:Math.max(1,Math.min(cap,bankNow()*k*S.bank.kelly)),why:'¼ Kelly'.replace('¼',S.bank.kelly===.25?'¼':S.bank.kelly===.5?'½':'⅛')};
  return{stake:Math.max(1,Math.min(cap,bankNow()*.01)),why:'mise plate 1 % (pas de value)'};
}
function addBet(legs,label){
  if(dayLoss()>=S.bank.init*S.bank.dayLoss/100){toast('Limite de perte du jour atteinte : aucune nouvelle mise avant demain.','var(--ba)');return}
  const p=legs.reduce((a,l)=>a*l.p,1),odds=+legs.reduce((a,l)=>a*l.odds,1).toFixed(2);
  const sg=suggestStake(p,odds);
  S.bets.unshift({id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1e4),label,legs:legs.map(l=>({mid:l.mid,sp:l.sp,label:l.label,p:l.p,odds:l.odds,st:null})),p,odds,stake:+sg.stake.toFixed(2),why:sg.why,status:'C',at:Date.now(),set:null});
  toast('Ajouté à la bankroll : '+label+' · mise '+dec(sg.stake,2)+' € ('+sg.why+')','var(--ac)');
  save();renderNav();
}
function settleBets(){
  let ch=false;
  S.bets.forEach(b=>{
    if(b.status!=='C')return;
    const before=b.status;
    b.legs.forEach(l=>{if(l.st)return;const m=MB(l.mid);if(!m||m.status==='NS'||!m.st)return;const r=evalSel(l.sp,m.st);if(r){l.st=r;ch=true}});
    if(b.legs.some(l=>l.st==='P')){b.status='P';b.set=Date.now();ch=true}
    else if(b.legs.every(l=>l.st)){const o=b.legs.reduce((a,l)=>a*(l.st==='R'?1:l.odds),1);b.odds=+o.toFixed(2);b.status=b.legs.every(l=>l.st==='R')?'R':'V';b.set=Date.now();ch=true}
    if(before==='C'&&b.status!=='C')toast('Bankroll : '+b.label+' → '+{V:'gagné',P:'perdu',R:'remboursé'}[b.status],b.status==='V'?'var(--ok)':b.status==='P'?'var(--ba)':'var(--mu)');
  });
  if(ch)save();
  return ch;
}

function radar(A,B){
  const ks=['xg','shots','sot','corners','assists','tackles','fouls','cards'],N=ks.length,cx=150,cy=130,r=95;
  const avg=(t,k)=>t.h[k].f.reduce((s,v)=>s+v,0)/10;
  const mx=Object.fromEntries(ks.map(k=>[k,Math.max(...Object.values(TEAMS).map(t=>avg(t,k)))||1]));
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f]};
  const poly=t=>ks.map((k,i)=>pt(i,avg(t,k)/mx[k]).map(v=>v.toFixed(1)).join(',')).join(' ');
  return`<svg viewBox="0 0 300 265" width="100%" style="max-width:340px" role="img" aria-label="Comparaison">
  ${[.25,.5,.75,1].map(f=>`<polygon points="${ks.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--ln)"/>`).join('')}
  ${ks.map((k,i)=>{const[x,y]=pt(i,1);const[lx,ly]=pt(i,1.18);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ln)"/><text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="var(--mu)">${METRICS.find(M=>M.k===k).n}</text>`}).join('')}
  <polygon points="${poly(A)}" fill="var(--ac)" fill-opacity=".18" stroke="var(--ac)" stroke-width="2"/>
  <polygon points="${poly(B)}" fill="var(--ac2)" fill-opacity=".18" stroke="var(--ac2)" stroke-width="2"/></svg>
  <div class="legend"><span style="color:var(--ac)">■ ${esc(A.n)}</span><span style="color:var(--ac2)">■ ${esc(B.n)}</span></div>`;
}

  const input=[{role:'user',content:AI_RULES+(SAMPLE_TOOLS?'\nUtilise les outils pour consulter les données avant de répondre.':'\n\n'+aiContext())},{role:'assistant',content:'Compris. Quelle est votre question ?'},...turns];

}

  const hit=t.picks?t.picks_won/t.picks:null;
  return`<div class="panel"><div class="row" style="justify-content:space-between"><h3>Journal réel : prédictions figées avant les matchs</h3><span class="pill s-C">${t.pending} en attente</span></div>
   <p class="note">Contrairement au backtest, ces prédictions sont enregistrées avant le coup d'envoi et ne sont jamais modifiées. Elles se règlent chaque jour avec les résultats officiels (mise à jour automatique via GitHub Actions).</p>
   <div class="kpis"><div class="kpi"><b>${t.frozen}</b><span>prédictions figées</span></div><div class="kpi"><b>${t.settled}</b><span>matchs réglés</span></div><div class="kpi"><b>${hit==null?'–':pc(hit)}</b><span>sélections 70-98 % gagnées${t.picks?' ('+t.picks_won+'/'+t.picks+', annoncé '+pc(t.picks_mean_p)+')':''}</span></div><div class="kpi"><b>${t.rps!=null?dec(t.rps,3):'–'}</b><span>RPS 1X2 en conditions réelles</span></div></div>
   ${t.recent&&t.recent.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Match</th><th class="r">Score</th><th>Sélection</th><th>Statut</th></tr></thead><tbody>${t.recent.map(x=>`<tr><td class="num">${rDate(x.date)}</td><td>${esc(x.match)}</td><td class="r num">${x.result.join('-')}</td><td>${x.pick?esc(x.pick.label)+' · '+pc(x.pick.p):'–'}</td><td>${x.pick&&x.pick.status?stPill(x.pick.status):''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Les premiers résultats arriveront après les matchs du '+rDate(REAL.matches[0].d)+'</p>'}</div>`;
}
V.proof={head:()=>`<div class="ph"><div><div class="eyebrow">Précision prouvée · backtest sur données réelles</div><h2>Ce que valent vraiment les pourcentages</h2><p>Chaque semaine des saisons ${REAL?REAL.report.test.concat(REAL.report.train).sort().join(', '):''}, le modèle est ré-entraîné uniquement sur le passé puis prédit les matchs suivants. Aucun match testé n'a servi à l'entraînement.</p></div></div>`,
dyn:()=>{
  if(!REAL)return'<div class="panel">Rapport absent.</div>';
  const r=REAL.report,M=r.models,N={base:'Fréquences de la ligue (référence)',elo:'Elo seul',dc:'Dixon-Coles',blend:'Mélange 65 % DC + 35 % Elo (réglé)'};
  const tot=r.calib.reduce((s,b)=>s+b.n,0);const c3=r.coupons['3'],c5=r.coupons['5'];
  return`<div class="kpis"><div class="kpi"><b>${r.n.toLocaleString('fr-FR')}</b><span>matchs réels testés (${Object.keys(r.leagues).length} ligues)</span></div><div class="kpi"><b>${tot.toLocaleString('fr-FR')}</b><span>prédictions de marchés vérifiées</span></div><div class="kpi"><b>${pc(M.dc.accuracy)}</b><span>bon résultat 1X2 (le hasard : 33 %, la référence : ${pc(M.base.accuracy)})</span></div><div class="kpi"><b>${dec(M.dc.rps,3)}</b><span>RPS Dixon-Coles (plus bas = mieux ; référence ${dec(M.base.rps,3)})</span></div></div>
  <div class="grid2" style="align-items:start">
   <div class="panel"><h3>Calibration : annoncé contre observé</h3><p class="note">Tous marchés confondus. Plus les points collent à la diagonale, plus les pourcentages sont honnêtes.</p>${calibChart(r.calib)}
    <div class="tw"><table><thead><tr><th>Tranche</th><th class="r">Prédictions</th><th class="r">Annoncé</th><th class="r">Observé</th></tr></thead><tbody>${r.calib.filter(b=>b.n).map(b=>`<tr><td class="num">${b.tranche}</td><td class="r num">${b.n.toLocaleString('fr-FR')}</td><td class="r num">${pc(b.annonce)}</td><td class="r num">${pc(b.observe)}</td></tr>`).join('')}</tbody></table></div></div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><h3>Modèles comparés (1X2)</h3><div class="tw"><table><thead><tr><th>Modèle</th><th class="r">RPS</th><th class="r">Log-loss</th><th class="r">Précision</th></tr></thead><tbody>${Object.entries(M).map(([k,v])=>`<tr><td>${N[k]}</td><td class="r num">${dec(v.rps,4)}</td><td class="r num">${dec(v.log_loss,4)}</td><td class="r num">${pc(v.accuracy)}</td></tr>`).join('')}</tbody></table></div>
     <p class="note">Repère : les cotes des bookmakers atteignent en général un RPS proche de 0,19-0,20 sur ces ligues. Le modèle s'en approche avec les seuls résultats ; les cotes, les compositions et les xG réels restent la marge de progression.</p></div>
    <div class="panel"><h3>Coupons testés sur la dernière saison</h3><div class="tw"><table><thead><tr><th>Coupon</th><th class="r">Nombre</th><th class="r">Prévu</th><th class="r">Observé</th></tr></thead><tbody>${Object.entries(r.coupons).map(([n,c])=>`<tr><td>${n} sélections</td><td class="r num">${c.coupons}</td><td class="r num">${pc(c.predicted_win_rate)}</td><td class="r num">${pc(c.observed_win_rate)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel"><h3>Par championnat (Dixon-Coles)</h3><div class="tw"><table><thead><tr><th>Ligue</th><th class="r">RPS</th><th class="r">Précision 1X2</th></tr></thead><tbody>${Object.entries(r.per_league).map(([k,v])=>`<tr><td>${RLG[k]}</td><td class="r num">${dec(v.rps,4)}</td><td class="r num">${pc(v.accuracy)}</td></tr>`).join('')}</tbody></table></div></div>
   </div></div>
  ${trackPanel()}
  <div class="panel method"><h3>Ce que le backtest nous apprend</h3><ul>
   <li><b>Les pourcentages sont fiables.</b> Quand le modèle annonce 70-80 %, l'événement se produit ${pc(r.calib[2].observe)} du temps ; à 80-90 %, ${pc(r.calib[3].observe)}.</li>
   <li><b>Les coupons tiennent leurs promesses statistiques.</b> Coupon de 3 : ${pc(c3.predicted_win_rate)} prévu, ${pc(c3.observed_win_rate)} observé. Coupon de 5 : ${pc(c5.predicted_win_rate)} prévu, ${pc(c5.observed_win_rate)} observé.</li>
   <li><b>Mais les sélections à 90 % et plus sont presque toutes « plus de 0,5 but » ou « moins de 4,5 buts »</b> (cote de 1,03 à 1,10). La marge du bookmaker efface le gain : une forte probabilité n'est pas un pari rentable. C'est pour cela que l'onglet Matchs réels les exclut par défaut.</li>
   <li><b>La vraie prochaine étape est la value</b> : brancher les cotes réelles pour ne garder que les sélections où la cote proposée dépasse la cote juste.</li></ul></div>`;
}};

/* ============ Notifications ============ */
function toast(txt,c){
  S.notes.unshift({t:Date.now(),txt,c:c||'var(--ac)'});S.notes=S.notes.slice(0,40);
  if(!S.ready)return;
  const el=document.createElement('div');el.className='toast';el.style.setProperty('--c',c||'var(--ac)');el.textContent=txt;
  const box=$('#toasts');box.prepend(el);while(box.children.length>4)box.lastChild.remove();
  setTimeout(()=>el.remove(),4500);
}
function notifyGoal(m,side){if(S.favs.has(m.id)||S.favTeams.has(m.h)||S.favTeams.has(m.a))toast('⚽ But '+TN(side==='h'?m.h:m.a)+' ('+Math.floor(m.st.minute)+'\') : '+TN(m.h)+' '+m.st.hg+'-'+m.st.ag+' '+TN(m.a),'var(--ok)')}

/* ============ Événements ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='drawer'){S.drawer=null;$('#drawer').hidden=true}return}
  const[act,arg]=el.dataset.act.split(/:(.*)/s);
  if(['fav','favT','lock'].includes(act))e.stopPropagation();
  switch(act){
    case 'nav':S.tab=arg;S.drawer=null;$('#drawer').hidden=true;render();window.scrollTo(0,0);break;
    case 'open':S.drawer=arg;renderDrawer();break;
    case 'close':S.drawer=null;$('#drawer').hidden=true;break;
    case 'fav':S.favs.has(arg)?S.favs.delete(arg):S.favs.add(arg);save();renderDyn();renderNav();if(S.drawer)renderDrawer();if(S.tab==='live'||S.tab==='integ')renderDyn();break;
    case 'favT':S.favTeams.has(arg)?S.favTeams.delete(arg):S.favTeams.add(arg);save();renderDyn();break;
    case 'team':S.tab='stats';S.stTeam=arg;S.stLeague='all';render();break;
    case 'stTeam':S.stTeam=arg;renderDyn();break;
    case 'calDay':S.calDay=+arg;render();break;
    case 'liveSub':S.liveSub=arg;render();break;
    case 'cSize':S.cSize=+arg;render();break;
    case 'gen':doGenerate();break;
    case 'regen':doRegenerate();break;
    case 'lock':{const it=S.coupon.items[+arg];it.lock=!it.lock;save();renderDyn();break}
    case 'comboScope':S.comboScope=arg;render();break;
    case 'comboN':S.comboN=+arg;render();break;
    case 'comboMode':S.comboMode=arg;render();break;
    case 'jPer':case 'jSt':case 'iLvl':case 'stM':S[act]=arg;render();break;
    case 'bet':{const[mid,sid]=arg.split('|');const m=MB(mid);const sl=m&&m.sels.find(x=>x.id===sid);if(sl&&m.status==='NS')addBet([selLeg(m,sl)],sl.label+' ('+TN(m.h)+' – '+TN(m.a)+')');break}
    case 'betCoupon':{const it=S.coupon&&S.coupon.items;if(it&&it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:(m.sels.find(x=>x.key===i.key)||{}).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}).filter(l=>l.sp),'Coupon de '+it.length);break}
    case 'betCombo':{const it=generate(S.comboN,{scope:S.comboScope,min:S.comboMin/100,max:.98,mode:S.comboMode});if(it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:m.sels.find(x=>x.id===i.selId).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}),'Combo de '+it.length);break}
    case 'delBet':S.bets=S.bets.filter(b=>b.id!==arg);save();renderDyn();break;
    case 'ruleOn':{const r=S.rules.find(r=>r.id===arg);if(r){r.on=!r.on;save();renderDyn()}break}
    case 'ruleDel':S.rules=S.rules.filter(r=>r.id!==arg);save();renderDyn();break;
    case 'aiSug':askAI(V.assistant.sug[+arg]);break;
    case 'aiStop':AICTL?.abort();break;
    case 'aiClear':S.chat=[];save();render();break;
    case 'aiExplain':{const m=MB(arg);if(m)explainMatch(m);break}
    case 'rOpen':S.rOpen=S.rOpen===arg?null:arg;renderDyn();break;
    case 'rLg':S.rLg=arg;S.rOpen=null;render();break;
    case 'rSize':S.rSize=+arg;render();break;
    case 'rMode':S.rMode=arg;render();break;
    case 'simReset':S.sim={attH:0,attA:0,red:0,absH:false,absA:false,rain:false};renderDrawer();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='aiForm'){const i=$('#aiIn');const v=i.value;i.value='';askAI(v)}
  if(e.target.id==='ruleForm'){
    const g=id=>document.getElementById(id).value;
    S.rules.push({id:'r'+Date.now().toString(36),name:(g('rName')||'Alerte').slice(0,40),lg:g('rLg'),g:g('rG'),minP:clamp(+g('rP')||70,50,98),minVal:clamp(+g('rV')||0,-20,30),minIC:clamp(+g('rIC')||0,0,100),on:true});
    checkRules();save();renderDyn();toast('Alerte créée.','var(--info)');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){S.drawer=null;$('#drawer').hidden=true}
  if(e.key==='Enter'&&e.target.matches('[role=button][data-act]'))e.target.click();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  const el=e.target;const v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;
  if(k.includes('.')){const[o,f]=k.split('.');let x=v;if(o==='bank'){x=Number(v);if(f==='init'&&!(x>=10))return}S[o][f]=x;
    const lab=document.getElementById(k+'V');if(lab)lab.textContent=f==='red'?(x||'–'):x+' %';
    if(o==='sim'){const m=MB(S.drawer);const so=$('#simOut');if(m&&so)so.innerHTML=simOut(m)}else{save();renderDyn()}
    return}
  if(k==='cmpB'){S.cmpB=v;renderDyn();return}
  S[k]=v;
  const lab=$('#'+k+'V');if(lab)lab.textContent=v+(k==='comboN'?'':' %');
  if(k==='comboN')document.querySelectorAll('[data-act^="comboN:"]').forEach(b=>b.classList.toggle('on',b.dataset.act==='comboN:'+v));
  renderDyn();
});

/* ============ Démarrage ============ */
load();
if(!S.rules.length)S.rules.push({id:'r0',name:'Value solide',lg:'all',g:'all',minP:70,minVal:3,minIC:60,on:true});
checkRules();
S.ready=true;
render();
tick();
setInterval(tick,1000);
setInterval(marketTick,15000);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);
</script>
