const AI_ERR={not_granted:'Accès à Claude refusé pour cette page.',sampling_disabled:'Claude n\'est pas disponible pour ce compte.',rate_limited:'Trop de demandes : réessayez dans un moment.',session_expired:'Reconnectez-vous à Claude pour continuer.',refused:'Claude a refusé cette demande : reformulez-la.',empty_completion:'Réponse vide : reformulez plus simplement.',prompt_too_large:'Demande trop longue : raccourcissez-la.'};
const aiErr=e=>AI_ERR[e?.code]||'La réponse a été interrompue. Réessayez.';
const mdLite=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,3} (.+)$/gm,'<b>$1</b>');
function matchBrief(m){
  const bp=bestPick(m);
  return{id:m.id,match:TN(m.h)+' – '+TN(m.a),competition:LGN(m.lg),coup_envoi:dayLbl(m.ko)+' '+hm(m.ko),statut:{NS:'à venir',LIVE:'en direct',FT:'terminé'}[m.status],
    score:m.st&&m.status!=='NS'?m.st.hg+'-'+m.st.ag+(m.status==='LIVE'?' ('+Math.floor(m.st.minute)+'e)':''):null,
    meilleure_prediction:bp?{option:bp.label,proba:Math.round(bp.p*100),cote:bp.best,confiance:Math.round(bp.ic)}:null,integrite:LVN[lvl(m.risk)]+' ('+m.risk+'/100)'};
}
function matchDetail(m){
  const h=TEAMS[m.h],a=TEAMS[m.a];
  return{...matchBrief(m),buts_attendus:{[h.n]:+m.lh.toFixed(2),[a.n]:+m.la.toFixed(2)},classement:{[h.n]:h.pos+'e',[a.n]:a.pos+'e'},enjeu:m.stake.label+' : '+m.stake.txt,absences:{[h.n]:h.abs,[a.n]:a.abs},arbitre:REFS[m.ref],
    signaux_integrite:m.signals,
    marches:m.sels.filter(s=>s.p>=.5&&s.p<=.98).sort((x,y)=>y.ic-x.ic).slice(0,18).map(s=>({option:s.label,proba:Math.round(s.p*100),cote_juste:+s.fair.toFixed(2),meilleure_cote:s.best,value_pct:+(s.val*100).toFixed(1),confiance:Math.round(s.ic)})),
    live:m.status==='LIVE'?{minute:Math.floor(m.st.minute),xg:[+m.st.xgH.toFixed(2),+m.st.xgA.toFixed(2)],tirs_cadres:[m.st.sH,m.st.sot-m.st.sH],corners:[m.st.cH,m.st.corners-m.st.cH],cartons:m.st.cards,predictions_live:(m.live||[]).slice(0,10).map(s=>({option:s.label,proba:Math.round(s.p*100)}))}:null,
    predictions_suivies:DATA.T.filter(t=>t.mid===m.id).map(t=>({option:t.label,proba:Math.round(t.p*100),statut:{A:'en attente',C:'en cours',V:'validé',P:'perdu',R:'remboursé'}[t.status]}))};
}
const findMatches=q=>{q=String(q||'').toLowerCase();return DATA.matches.filter(m=>!q||matchText(m).includes(q))};
const AI_TOOLS=[
 {name:'chercher_matchs',description:'Liste des matchs (max 15) avec meilleure prédiction, statut et niveau intégrité. Filtre texte optionnel (équipe, compétition) et statut (a_venir, en_direct, termine).',
  inputSchema:{type:'object',properties:{texte:{type:'string'},statut:{type:'string',enum:['a_venir','en_direct','termine']}}},
  execute:i=>{const st={a_venir:'NS',en_direct:'LIVE',termine:'FT'}[String(i.statut||'')];return findMatches(i.texte).filter(m=>!st||m.status===st).filter(m=>m.status!=='FT'||st==='FT').slice(0,15).map(matchBrief)}},
 {name:'detail_match',description:'Fiche complète d\'un match : buts attendus, enjeu, absences, marchés avec probabilités, cotes, value et confiance, stats live, prédictions suivies. Prend l\'id renvoyé par chercher_matchs.',
  inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']},execute:i=>{const m=MB(String(i.id));if(!m)throw new Error('Match introuvable');return matchDetail(m)}},
 {name:'value_bets',description:'Les 12 meilleurs value bets à venir (probabilité, meilleure cote, value en %, confiance).',
  execute:()=>valueBets().slice(0,12).map(({m,s})=>({match:TN(m.h)+' – '+TN(m.a),id:m.id,option:s.label,proba:Math.round(s.p*100),cote:s.best,value_pct:+(s.val*100).toFixed(1),confiance:Math.round(s.ic)}))},
 {name:'composer_coupon',description:'Compose un coupon avec l\'algorithme de l\'app (une sélection par match, intégrité verte/jaune). taille 1-20, confiance_min 70-98, mode surete|equilibre|rendement, horizon jour|avenir.',
  inputSchema:{type:'object',properties:{taille:{type:'number'},confiance_min:{type:'number'},mode:{type:'string',enum:['surete','equilibre','rendement']},horizon:{type:'string',enum:['jour','avenir']}},required:['taille']},
  execute:i=>{const n=clamp(Math.round(Number(i.taille)||3),1,20),mn=clamp(Number(i.confiance_min)||75,70,98);const it=generate(n,{scope:i.horizon==='avenir'?'avenir':'jour',min:mn/100,max:.98,mode:['surete','equilibre','rendement'].includes(i.mode)?i.mode:'surete'});
   return{selections:it.map(x=>{const m=MB(x.mid);return{match:TN(m.h)+' – '+TN(m.a),coup_envoi:hm(m.ko),option:x.label,proba:Math.round(x.p*100),cote:x.odds}}),proba_combinee:Math.round(it.reduce((a,x)=>a*x.p,1)*100),cote_totale:+it.reduce((a,x)=>a*x.odds,1).toFixed(2)}}},
 {name:'alertes_integrite',description:'Matchs avec signaux de marché inhabituels (niveau, score, signaux, derniers mouvements).',
  execute:()=>DATA.matches.filter(m=>m.status!=='FT'&&lvl(m.risk)>=1).sort((a,b)=>b.risk-a.risk).slice(0,10).map(m=>({...matchBrief(m),signaux:m.signals,mouvements:m.ilog.slice(-3).map(e=>e.txt+' '+(e.pct>0?'+':'')+e.pct.toFixed(1)+' % ('+SEVN[e.sev]+')')}))},
 {name:'stats_equipe',description:'Moyennes sur 10 matchs (pour / contre) d\'une équipe pour corners, tirs, tirs cadrés, cartons, fautes, hors-jeux, passes décisives, tacles, touches, xG, plus classement et Elo.',
  inputSchema:{type:'object',properties:{equipe:{type:'string'}},required:['equipe']},
  execute:i=>{const q=String(i.equipe||'').toLowerCase();const t=Object.values(TEAMS).find(t=>t.n.toLowerCase().includes(q));if(!t)throw new Error('Équipe introuvable');
   return{equipe:t.n,competition:LGN(t.lg),classement:t.pos,elo:t.elo,moyennes:Object.fromEntries(METRICS.map(M=>[M.n,{pour:+(t.h[M.k].f.reduce((s,v)=>s+v,0)/10).toFixed(2),contre:+(t.h[M.k].a.reduce((s,v)=>s+v,0)/10).toFixed(2)}]))}}},
 {name:'performance_modele',description:'Performance réelle des prédictions suivies : validées, perdues, réussite, ROI, calibration par tranche.',
  execute:()=>{const p=perf(DATA.T);return{validees:p.v,perdues:p.p,remboursees:p.r,reussite_pct:Math.round(p.hit*100),roi_pct:+(p.roi*100).toFixed(1)}}}
];
const AI_RULES=`Tu es l'analyste d'OMNISCORE, une application d'analyse et de prédiction football. Réponds en français, de façon claire, structurée et concise (listes courtes, chiffres précis).
Règles :
- Appuie-toi uniquement sur les données de l'application (outils ou contexte fourni). N'invente aucun chiffre, joueur ou information.
- Ce prototype utilise des équipes et des cotes simulées : si on te demande des matchs réels, dis-le.
- Une probabilité n'est jamais une certitude. Donne toujours le pourcentage, la cote et le niveau de confiance, et rappelle le risque pour les combinés.
- Pour l'intégrité, parle de « signaux de marché inhabituels », jamais de match truqué avéré.
- Si l'utilisateur semble perdre le contrôle de ses paris, recommande une pause et des limites.`;
function aiContext(){
  const up=upcoming(30).map(m=>matchBrief(m)).filter(x=>x.meilleure_prediction).slice(0,20);
  return'Données actuelles de l\'application (JSON) :\n'+JSON.stringify({heure:hm(Date.now()),matchs_a_venir:up,en_direct:DATA.matches.filter(m=>m.status==='LIVE').map(matchBrief),value_bets:AI_TOOLS[2].execute(),alertes_integrite:DATA.matches.filter(m=>m.status!=='FT'&&lvl(m.risk)>=1).map(matchBrief).slice(0,8),performance:AI_TOOLS[6].execute()});
}
async function askAI(text){
  text=String(text||'').trim();if(!text||!SAMPLE||S.aiBusy)return;
  S.chat.push({role:'user',content:text});S.chat.push({role:'assistant',content:'',pending:true});S.aiBusy=true;render();
  const bubble=()=>document.querySelector('#chat .msg-a:last-child .bd2');
  AICTL=new AbortController();
  const turns=S.chat.filter(t=>!t.pending&&t.content).slice(-12).map(t=>({role:t.role,content:t.content}));
  const input=[{role:'user',content:AI_RULES+(SAMPLE_TOOLS?'\nUtilise les outils pour consulter les données avant de répondre.':'\n\n'+aiContext())},{role:'assistant',content:'Compris. Quelle est votre question ?'},...turns];
  const last=S.chat[S.chat.length-1];
  try{
    const opts={signal:AICTL.signal,onText:({text})=>{last.content=text;const b=bubble();if(b)b.innerHTML=mdLite(text)}};
    if(SAMPLE_TOOLS)opts.tools=AI_TOOLS.map(t=>({...t,execute:(i,c)=>{const b=bubble();if(b&&!last.content)b.textContent='Consultation des données : '+t.name.replace(/_/g,' ')+'…';return t.execute(i||{},c)}}));else opts.cache=false;
    const r=await SAMPLE(input,opts);last.content=r.text;if(r.truncated)last.content+='\n\n(Réponse coupée : posez une question plus précise.)';
  }catch(e){last.content=(e&&e.text)||'';if(e?.code!=='cancelled')last.err=aiErr(e);if(['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e?.code))SAMPLE=null}
  delete last.pending;S.aiBusy=false;AICTL=null;save();if(S.tab==='assistant')render();
}
V.assistant={head:()=>`<div class="ph"><div><div class="eyebrow">Assistant IA</div><h2>Posez vos questions à l'analyste</h2><p>L'assistant consulte les données de l'application (matchs, marchés, value bets, intégrité, stats) avant de répondre. Chaque question utilise votre propre compte Claude.</p></div>${S.chat.length?'<button class="btn" data-act="aiClear">Nouvelle conversation</button>':''}</div>`,
dyn:()=>{
  if(!SAMPLE)return`<div class="panel"><p style="margin:0">L'assistant n'est pas disponible dans cette vue. Il fonctionne quand la page est ouverte dans Claude et que vous autorisez l'accès.</p></div>`;
  const sug=['Compose-moi le coupon de 3 le plus sûr pour les prochaines heures et explique chaque choix','Quels value bets sont les plus solides en ce moment ?','Explique-moi les alertes intégrité en cours','Quel match en direct a le plus de chances d\'avoir un autre but ?','Compare les corners de Kingsmere City et Brackwell Rovers'];
  return`<div id="chat" class="panel" style="display:flex;flex-direction:column;gap:12px">
   ${S.chat.length?S.chat.map(t=>t.role==='user'?`<div class="msg-u"><div class="bd2">${esc(t.content)}</div></div>`:`<div class="msg-a"><div class="bd2">${t.pending&&!t.content?'Réflexion en cours…':mdLite(t.content)}</div>${t.err?`<div class="note" style="color:var(--ba)">${esc(t.err)}</div>`:''}</div>`).join(''):`<div class="chips">${sug.map((s,i)=>`<button class="chip" data-act="aiSug:${i}">${esc(s)}</button>`).join('')}</div>`}
  </div>
  <form id="aiForm" class="row"><input id="aiIn" class="inp" style="flex:1;min-width:200px" placeholder="Ex. : quel est le meilleur pari corners ce soir ?" maxlength="600" autocomplete="off"${S.aiBusy?' disabled':''}>${S.aiBusy?'<button class="btn" type="button" data-act="aiStop">Arrêter</button>':'<button class="btn pri" type="submit">Envoyer</button>'}</form>
  <p class="note">L'IA peut se tromper. Aucune réponse n'est une garantie de gain.</p>`;
}};
V.assistant.sug=['Compose-moi le coupon de 3 le plus sûr pour les prochaines heures et explique chaque choix','Quels value bets sont les plus solides en ce moment ?','Explique-moi les alertes intégrité en cours','Quel match en direct a le plus de chances d\'avoir un autre but ?','Compare les corners de Kingsmere City et Brackwell Rovers'];
async function explainMatch(m){
  const out=$('#aiOut');if(!out||!SAMPLE)return;
  out.hidden=false;out.innerHTML='<span class="mu">Analyse en cours…</span>';
  const prompt=AI_RULES+'\n\nRédige une analyse experte de ce match en 5 parties courtes : contexte et enjeu, forces en présence, lecture du marché et intégrité, les 3 options les plus solides (proba, cote, confiance), et un avertissement de risque. Maximum 220 mots.\n\n'+JSON.stringify(matchDetail(m));
  try{const r=await SAMPLE(prompt,{onText:({text})=>{out.innerHTML=mdLite(text)}});out.innerHTML=mdLite(r.text)}
  catch(e){out.innerHTML=(e?.text?mdLite(e.text)+'<br>':'')+`<span class="note" style="color:var(--ba)">${esc(aiErr(e))}</span>`}
}

/* ============ Notifications ============ */
function toast(txt,c){
  S.notes.unshift({t:Date.now(),txt,c:c||'var(--ac)'});S.notes=S.notes.slice(0,40);
  if(!S.ready)return;
  const el=document.createElement('div');el.className='toast';el.style.setProperty('--c',c||'var(--ac)');el.textContent=txt;
  const box=$('#toasts');box.prepend(el);while(box.children.length>4)box.lastChild.remove();
  setTimeout(()=>el.remove(),4500);
}
function notifyGoal(m,side){if(S.favs.has(m.id)||S.favTeams.has(m.h)||S.favTeams.has(m.a))toast('⚽ But '+TN(side==='h'?m.h:m.a)+' ('+Math.floor(m.st.minute)+'\') : '+TN(m.h)+' '+m.st.hg+'-'+m.st.ag+' '+TN(m.a),'var(--ok)')}

/* ============ Événements ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='drawer'){S.drawer=null;$('#drawer').hidden=true}return}
  const[act,arg]=el.dataset.act.split(/:(.*)/s);
  if(['fav','favT','lock'].includes(act))e.stopPropagation();
  switch(act){
    case 'nav':S.tab=arg;S.drawer=null;$('#drawer').hidden=true;render();window.scrollTo(0,0);break;
    case 'open':S.drawer=arg;renderDrawer();break;
    case 'close':S.drawer=null;$('#drawer').hidden=true;break;
    case 'fav':S.favs.has(arg)?S.favs.delete(arg):S.favs.add(arg);save();renderDyn();renderNav();if(S.drawer)renderDrawer();if(S.tab==='live'||S.tab==='integ')renderDyn();break;
    case 'favT':S.favTeams.has(arg)?S.favTeams.delete(arg):S.favTeams.add(arg);save();renderDyn();break;
    case 'team':S.tab='stats';S.stTeam=arg;S.stLeague='all';render();break;
    case 'stTeam':S.stTeam=arg;renderDyn();break;
    case 'calDay':S.calDay=+arg;render();break;
    case 'liveSub':S.liveSub=arg;render();break;
    case 'cSize':S.cSize=+arg;render();break;
    case 'gen':doGenerate();break;
    case 'regen':doRegenerate();break;
    case 'lock':{const it=S.coupon.items[+arg];it.lock=!it.lock;save();renderDyn();break}
    case 'comboScope':S.comboScope=arg;render();break;
    case 'comboN':S.comboN=+arg;render();break;
    case 'comboMode':S.comboMode=arg;render();break;
    case 'jPer':case 'jSt':case 'iLvl':case 'stM':S[act]=arg;render();break;
    case 'bet':{const[mid,sid]=arg.split('|');const m=MB(mid);const sl=m&&m.sels.find(x=>x.id===sid);if(sl&&m.status==='NS')addBet([selLeg(m,sl)],sl.label+' ('+TN(m.h)+' – '+TN(m.a)+')');break}
    case 'betCoupon':{const it=S.coupon&&S.coupon.items;if(it&&it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:(m.sels.find(x=>x.key===i.key)||{}).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}).filter(l=>l.sp),'Coupon de '+it.length);break}
    case 'betCombo':{const it=generate(S.comboN,{scope:S.comboScope,min:S.comboMin/100,max:.98,mode:S.comboMode});if(it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:m.sels.find(x=>x.id===i.selId).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}),'Combo de '+it.length);break}
    case 'delBet':S.bets=S.bets.filter(b=>b.id!==arg);save();renderDyn();break;
    case 'ruleOn':{const r=S.rules.find(r=>r.id===arg);if(r){r.on=!r.on;save();renderDyn()}break}
    case 'ruleDel':S.rules=S.rules.filter(r=>r.id!==arg);save();renderDyn();break;
    case 'aiSug':askAI(V.assistant.sug[+arg]);break;
    case 'aiStop':AICTL?.abort();break;
    case 'aiClear':S.chat=[];save();render();break;
    case 'aiExplain':{const m=MB(arg);if(m)explainMatch(m);break}
    case 'simReset':S.sim={attH:0,attA:0,red:0,absH:false,absA:false,rain:false};renderDrawer();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='aiForm'){const i=$('#aiIn');const v=i.value;i.value='';askAI(v)}
  if(e.target.id==='ruleForm'){
    const g=id=>document.getElementById(id).value;
    S.rules.push({id:'r'+Date.now().toString(36),name:(g('rName')||'Alerte').slice(0,40),lg:g('rLg'),g:g('rG'),minP:clamp(+g('rP')||70,50,98),minVal:clamp(+g('rV')||0,-20,30),minIC:clamp(+g('rIC')||0,0,100),on:true});
    checkRules();save();renderDyn();toast('Alerte créée.','var(--info)');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){S.drawer=null;$('#drawer').hidden=true}
  if(e.key==='Enter'&&e.target.matches('[role=button][data-act]'))e.target.click();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  const el=e.target;const v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;
  if(k.includes('.')){const[o,f]=k.split('.');let x=v;if(o==='bank'){x=Number(v);if(f==='init'&&!(x>=10))return}S[o][f]=x;
    const lab=document.getElementById(k+'V');if(lab)lab.textContent=f==='red'?(x||'–'):x+' %';
    if(o==='sim'){const m=MB(S.drawer);const so=$('#simOut');if(m&&so)so.innerHTML=simOut(m)}else{save();renderDyn()}
    return}
  if(k==='cmpB'){S.cmpB=v;renderDyn();return}
  S[k]=v;
  const lab=$('#'+k+'V');if(lab)lab.textContent=v+(k==='comboN'?'':' %');
  if(k==='comboN')document.querySelectorAll('[data-act^="comboN:"]').forEach(b=>b.classList.toggle('on',b.dataset.act==='comboN:'+v));
  renderDyn();
});

/* ============ Démarrage ============ */
load();
if(!S.rules.length)S.rules.push({id:'r0',name:'Value solide',lg:'all',g:'all',minP:70,minVal:3,minIC:60,on:true});
checkRules();
S.ready=true;
render();
tick();
setInterval(tick,1000);
setInterval(marketTick,15000);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);
</script>
