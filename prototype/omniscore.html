<title>OMNISCORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B1310;--sf:#121C18;--sf2:#18251F;--ln:#25352D;--tx:#E3EBE5;--mu:#8DA397;
  --ac:#F0B44A;--acTx:#1A1204;--ac2:#4CC3B0;
  --ok:#35B86C;--wa:#E3B23C;--or:#EC7D3E;--ba:#E5534B;--info:#5AA9E6;
  --okBg:rgba(53,184,108,.14);--waBg:rgba(227,178,60,.14);--orBg:rgba(236,125,62,.15);--baBg:rgba(229,83,75,.15);--infoBg:rgba(90,169,230,.14);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --fD:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --fB:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fM:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#ECF1EB;--sf:#FFFFFF;--sf2:#F4F7F2;--ln:#D2DCD4;--tx:#13201A;--mu:#56695E;
    --ac:#A56800;--acTx:#FFFFFF;--ac2:#0E7A6C;
    --ok:#1D8649;--wa:#946F00;--or:#BF5418;--ba:#C3302A;--info:#2A6DAD;
    --okBg:rgba(29,134,73,.11);--waBg:rgba(148,111,0,.11);--orBg:rgba(191,84,24,.11);--baBg:rgba(195,48,42,.1);--infoBg:rgba(42,109,173,.1);
    --shadow:0 12px 40px rgba(20,40,30,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ECF1EB;--sf:#FFFFFF;--sf2:#F4F7F2;--ln:#D2DCD4;--tx:#13201A;--mu:#56695E;
  --ac:#A56800;--acTx:#FFFFFF;--ac2:#0E7A6C;
  --ok:#1D8649;--wa:#946F00;--or:#BF5418;--ba:#C3302A;--info:#2A6DAD;
  --okBg:rgba(29,134,73,.11);--waBg:rgba(148,111,0,.11);--orBg:rgba(191,84,24,.11);--baBg:rgba(195,48,42,.1);--infoBg:rgba(42,109,173,.1);
  --shadow:0 12px 40px rgba(20,40,30,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--fB)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num,.mono{font-family:var(--fM);font-variant-numeric:tabular-nums;font-size:.92em}
h1,h2,h3{font-family:var(--fD);letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:26px;font-weight:700}
h3{font-size:18px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:600}
.mu{color:var(--mu)}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 22px;padding-inline:16px;max-width:1440px;margin:0 auto;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--fD);font-size:28px;font-weight:700;letter-spacing:.14em}
.brand b i{font-style:normal;color:var(--ac)}
.brand span{color:var(--mu);font-size:12.5px}
.top .sp{flex:1}
.demo{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--waBg);color:var(--wa);font-weight:600}
.clock{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ba);box-shadow:0 0 0 0 var(--ba);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(229,83,75,.6)}70%{box-shadow:0 0 0 7px rgba(229,83,75,0)}100%{box-shadow:0 0 0 0 rgba(229,83,75,0)}}
nav.side{display:flex;flex-direction:column;gap:2px;padding-block:18px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--mu);font-weight:500;white-space:nowrap}
nav.side button:hover{background:var(--sf2);color:var(--tx)}
nav.side button.on{background:var(--sf);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
nav.side .bd{font-family:var(--fM);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sf2);color:var(--mu)}
nav.side .bd.r{background:var(--baBg);color:var(--ba)}
main{padding-block:18px 60px;min-width:0;display:flex;flex-direction:column;gap:16px}
#head,#dyn{display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--mu);max-width:70ch}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--fD);font-size:32px;font-weight:700;line-height:1.1}
.kpi span{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);padding:5px 12px;border-radius:99px;font-size:13px;color:var(--mu)}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acTx);font-weight:600}
.btn{border:1px solid var(--ln);background:var(--sf2);padding:8px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--ac);color:var(--acTx);border-color:var(--ac)}
.btn.pri:hover{filter:brightness(1.07)}
.inp{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;min-width:0}
.inp.wide{width:min(100%,420px)}
select.inp{padding-right:28px}
input[type=range]{accent-color:var(--ac);width:min(100%,280px)}
.lbl{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.s-A{background:var(--sf2);color:var(--mu)}
.s-C{background:var(--infoBg);color:var(--info)}
.s-V{background:var(--okBg);color:var(--ok)}
.s-P{background:var(--baBg);color:var(--ba)}
.s-R{background:var(--sf2);color:var(--tx)}
.c-hi{--c:var(--ok);--cb:var(--okBg)}.c-mid{--c:var(--wa);--cb:var(--waBg)}.c-lo{--c:var(--or);--cb:var(--orBg)}.c-bad{--c:var(--ba);--cb:var(--baBg)}
.cp{background:var(--cb);color:var(--c);font-family:var(--fM);font-size:12px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lv0{--c:var(--ok);--cb:var(--okBg)}.lv1{--c:var(--wa);--cb:var(--waBg)}.lv2{--c:var(--or);--cb:var(--orBg)}.lv3{--c:var(--ba);--cb:var(--baBg)}
.risk{background:var(--cb);color:var(--c);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.bar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--c,var(--ac2));border-radius:3px}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sf2)}
td.r,th.r{text-align:right}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto 30px;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.mrow:hover{background:var(--sf2)}
.mrow:last-child{border-bottom:0}
.teams{display:flex;flex-direction:column;min-width:0}
.teams div{display:flex;justify-content:space-between;gap:10px}
.teams span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams b{font-family:var(--fD);font-size:17px;font-weight:700}
.tm{font-size:12.5px;color:var(--mu);font-family:var(--fM)}
.live{color:var(--ba);font-family:var(--fM);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ba);animation:pl 1.6s infinite}
.star{background:none;border:0;font-size:17px;color:var(--mu);padding:2px;line-height:1}
.star.on{color:var(--ac)}
.pick{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;text-align:right;max-width:210px}
.pick em{font-style:normal;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.lg{padding:8px 12px;background:var(--sf2);font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.pcard{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;cursor:pointer}
.pcard:hover{border-color:var(--mu)}
.pcard .t{min-width:0;flex:1}
.pcard .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .t small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{flex:none}
.ring text{font-family:var(--fD);font-weight:700;font-size:15px;fill:var(--tx)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--mu)}
.lcard{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.score .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .nm.a{text-align:right}
.score .sc{font-family:var(--fD);font-size:38px;font-weight:700;letter-spacing:.04em;line-height:1}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;font-size:12px}
.sgrid div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--ln);padding-bottom:3px}
.sgrid span{color:var(--mu)}
.evs{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.evs span{background:var(--sf2);padding:2px 7px;border-radius:5px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 80px 40px auto;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}
.prow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{border-left:3px solid var(--wa);background:var(--waBg);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.note{font-size:12.5px;color:var(--mu)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;color:var(--mu);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.cp-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 34px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln)}
.cp-item:last-child{border-bottom:0}
.cp-item .ix{font-family:var(--fD);font-size:18px;font-weight:700;color:var(--mu)}
.cp-item.new{background:var(--okBg)}
.lock{background:none;border:1px solid var(--ln);border-radius:6px;padding:3px 6px;font-size:13px;color:var(--mu)}
.lock.on{border-color:var(--ac);color:var(--ac)}
.total{display:flex;gap:24px;flex-wrap:wrap;padding:12px;background:var(--sf2);border-top:1px solid var(--ln)}
.total div{display:flex;flex-direction:column}
.total b{font-family:var(--fD);font-size:24px;font-weight:700}
.total span{font-size:11.5px;color:var(--mu)}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;background:var(--infoBg);color:var(--info)}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:58px 10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--ln)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ic{display:inline-flex;align-items:center;gap:6px;font-family:var(--fM);font-size:12px}
.spark path.a{fill:var(--ac2);opacity:.14}
.spark path.l{fill:none;stroke:var(--ac2);stroke-width:1.6}
.spark circle{fill:var(--ac2)}
.spark .grid{stroke:var(--ln);stroke-width:1}
.spark.alert path.l{stroke:var(--or)}.spark.alert path.a{fill:var(--or)}.spark.alert circle{fill:var(--or)}
.mom rect{shape-rendering:crispEdges}
#drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(0,0,0,.45)}
#drawer .dw{width:min(720px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--ln);box-shadow:var(--shadow);padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.x{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:4px 10px}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.scores div{background:var(--sf2);border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;font-family:var(--fM);font-size:12px}
.factors{display:flex;flex-direction:column;gap:6px;font-size:13px}
.factors div{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.fb{height:8px;background:var(--sf2);border-radius:4px;position:relative}
.fb i{position:absolute;top:0;bottom:0;border-radius:4px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--sf);border:1px solid var(--ln);border-left:3px solid var(--c,var(--ac));border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.empty{padding:22px;text-align:center;color:var(--mu)}
.method p,.method li{max-width:72ch}
.method code{font-family:var(--fM);font-size:12.5px;background:var(--sf2);padding:1px 5px;border-radius:4px}
.msg-u{display:flex;justify-content:flex-end}
.msg-u .bd2{background:var(--ac);color:var(--acTx);padding:9px 13px;border-radius:12px 12px 2px 12px;max-width:80%;white-space:pre-wrap}
.msg-a .bd2{background:var(--sf2);padding:10px 14px;border-radius:12px 12px 12px 2px;max-width:92%;white-space:pre-wrap;line-height:1.55}
.add{background:none;border:1px solid var(--ln);border-radius:6px;padding:1px 7px;color:var(--ac);font-weight:600}
.add:hover{border-color:var(--ac)}
#aiOut{white-space:pre-wrap;line-height:1.55;font-size:13.5px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.lcard .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;padding-block:8px;background:var(--bg);z-index:10;border-bottom:1px solid var(--ln);margin-inline:-16px;padding-inline:16px}
  nav.side button.on{box-shadow:inset 0 -2px 0 var(--ac)}
  .brand span{display:none}
  .mrow{grid-template-columns:52px minmax(0,1fr) 30px}
  .mrow .pick{grid-column:2/3;align-items:flex-start;text-align:left}
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cp-item{grid-template-columns:22px minmax(0,1fr) auto 30px}
  .cp-item .hide-s{display:none}
  .prow{grid-template-columns:minmax(0,1fr) 60px 40px auto}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  <header class="top">
    <div class="brand"><b>OMNI<i>SCORE</i></b><span>Les données voient le match avant vous</span></div>

</div>

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let rng=Math.random;
const R=()=>rng();
const rnd=(a,b)=>a+(b-a)*R();
const gaussOf=f=>{let u=0,v=0;while(!u)u=f();while(!v)v=f();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const gauss=()=>gaussOf(R);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FACT=[1];for(let i=1;i<80;i++)FACT[i]=FACT[i-1]*i;
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/FACT[k];
function poisS(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(R()<p)k++;return k}
function pOver(l,x){if(x<0)return 1;let s=0;for(let k=0;k<=Math.floor(x);k++)s+=pois(k,l);return clamp(1-s,0,1)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=p=>Math.round(p*100)+' %';
const od=o=>o.toFixed(2).replace('.',',');
const dec=(x,n=1)=>x.toFixed(n).replace('.',',');
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const hms=t=>new Date(t).toLocaleTimeString('fr-FR');
const dayLbl=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const confCls=p=>p>=.85?'c-hi':p>=.70?'c-mid':p>=.55?'c-lo':'c-bad';
const lvl=r=>r<25?0:r<50?1:r<75?2:3;
const LVN=['Normal','À surveiller','Suspect','Très suspect'];
const SEVN=['','Faible','Moyen','Fort','Critique'];
const SEVC=['','lv0','lv1','lv2','lv3'];
const H=3600e3;

/* ============ Référentiel (fictif) ============ */
const LEAGUES=[

/* ============ Modèle : Poisson + Dixon-Coles ============ */
function mat(lh,la,dc){
  const N=10,M=[];let s=0;const rho=-0.07;
  for(let i=0;i<N;i++){M[i]=[];for(let j=0;j<N;j++){let v=pois(i,lh)*pois(j,la);
    if(dc){if(i===0&&j===0)v*=1-lh*la*rho;else if(i===0&&j===1)v*=1+lh*rho;else if(i===1&&j===0)v*=1+la*rho;else if(i===1&&j===1)v*=1-rho}
    M[i][j]=v;s+=v}}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)M[i][j]/=s;
  return M;
}
const zeroSt=()=>({minute:0,hg:0,ag:0,htH:0,htA:0,htDone:false,finished:false,corners:0,cH:0,cards:0,kH:0,sot:0,sH:0,shots:0,shH:0,fouls:0,offsides:0,xgH:0,xgA:0,redH:0,redA:0,poss:50});

function adjL(m,st){

}
const outcome=(h,a)=>h>a?'1':h<a?'2':'X';
function probSel(sp,m,st){
  const r=remF(st);const pre=st.minute===0&&!st.finished;
  const[ah,aa]=adjL(m,st);const lh=ah*r,la=aa*r;
  if(sp.t==='tot'&&sp.s!=='goals'){const pO=pOver(m.stat[sp.s]*r,sp.l-st[sp.s]);return sp.o==='O'?pO:1-pO}
  if(sp.t==='team'){const cur=sp.tm==='h'?st.hg:st.ag;const pO=pOver(sp.tm==='h'?lh:la,sp.l-cur);return sp.o==='O'?pO:1-pO}
  if(sp.t==='htres'||sp.t==='httot'){
    if(st.htDone){const ok=sp.t==='htres'?sp.v.includes(outcome(st.htH,st.htA)):((st.htH+st.htA>sp.l)===(sp.o==='O'));return ok?1:0}
    const rh=remHt(st);const M=mat(m.lh*.44*rh,m.la*.44*rh,pre);let p=0;
    for(let i=0;i<10;i++)for(let j=0;j<10;j++){const fh=st.hg+i,fa=st.ag+j;
      if(sp.t==='htres'?sp.v.includes(outcome(fh,fa)):((fh+fa>sp.l)===(sp.o==='O')))p+=M[i][j]}
    return p;
  }
  const M=mat(lh,la,pre);let p=0,w=0,l=0;
  for(let i=0;i<10;i++)for(let j=0;j<10;j++){const fh=st.hg+i,fa=st.ag+j,v=M[i][j];
    switch(sp.t){
      case 'res':if(sp.v.includes(outcome(fh,fa)))p+=v;break;
      case 'dnb':if(outcome(fh,fa)===sp.v)w+=v;else if(fh!==fa)l+=v;break;
      case 'btts':if((fh>0&&fa>0)===sp.v)p+=v;break;

}
/* Règlement automatique : V validé, P perdu, R remboursé (push), null = pas encore tranché */
function evalSel(sp,st){
  const F=st.finished;
  const mono=(val,line,o,done)=>o==='O'?(val>line?'V':done?'P':null):(val>line?'P':done?'V':null);
  switch(sp.t){
    case 'tot':return mono(sp.s==='goals'?st.hg+st.ag:st[sp.s],sp.l,sp.o,F);
    case 'team':return mono(sp.tm==='h'?st.hg:st.ag,sp.l,sp.o,F);
    case 'btts':{const both=st.hg>0&&st.ag>0;return sp.v?(both?'V':F?'P':null):(both?'P':F?'V':null)}
    case 'res':return F?(sp.v.includes(outcome(st.hg,st.ag))?'V':'P'):null;
    case 'dnb':if(!F)return null;if(st.hg===st.ag)return'R';return outcome(st.hg,st.ag)===sp.v?'V':'P';
    case 'htres':return st.htDone?(sp.v.includes(outcome(st.htH,st.htA))?'V':'P'):null;
    case 'httot':return mono(st.htDone?st.htH+st.htA:st.hg+st.ag,sp.l,sp.o,st.htDone);
  }
  return null;
}

const icOf=(p,A,D,M,Rk,V)=>100*p*Math.pow(A,.6)*Math.pow(D,.7)*Math.pow(M,.9)*Math.pow(1-Rk,1.2)*Math.pow(1-V,.5);

/* Cotation de chaque sélection (bruit déterministe par match) */
function priceSels(m){
  const rs=mulberry32(hashStr(DATA.seed+':px:'+m.id));const g=()=>gaussOf(rs);
  m.sels=SPECS.map((x,i)=>{
    const p=clamp(probSel(x.sp,m,ZERO),.004,.996);
    const pm=clamp(p+g()*.018,.02,.985);
    let best=0,bk='';const odds={};
    BOOKS.forEach((b,k)=>{
      const pb=clamp(pm+g()*(k===0?.006:.015),.015,.99);
      const o=k===0?1/(pb*1.02):k===1?1+(1/pb-1)*.98:1/(pb*(1.035+rs()*.035));
      odds[b]=Math.max(1.01,+o.toFixed(2));if(odds[b]>best){best=odds[b];bk=b}
    });
    const pSharp=1/(odds['Réf. sharp']*1.02);
    const subs=[p+g()*.03,p+g()*.035,p+g()*.025];const mu=(subs[0]+subs[1]+subs[2])/3;
    const sd=Math.sqrt(subs.reduce((s,v)=>s+(v-mu)**2,0)/3);
    const A=clamp(1-sd/.5,0,1),V=clamp(Math.abs(g())*.05,0,.2),Mk=clamp(1-Math.abs(p-pSharp),0,1);
    return{id:m.id+'-'+i,key:keyOf(x.sp),g:x.g,sp:x.sp,label:labelOf(x.sp,m),p,best,bk,odds,fair:1/p,val:p*best-1,A,V,M:Mk,ic:icOf(p,A,m.D,Mk,m.risk/100,V),subs};
  });
}

let DATA;
const TEAMS={};
const TN=id=>TEAMS[id].n;
function genTeams(){
  LEAGUES.forEach(L=>{
    L.teams.forEach((n,i)=>{
      const id=L.id+i;const att=rnd(.72,1.42),def=rnd(.72,1.32);
      TEAMS[id]={id,n,lg:L.id,att,def,
        r:{corners:[rnd(3.6,6.6),rnd(3.6,6.2)],shots:[rnd(8.5,16.5),rnd(8.5,15.5)],sot:[0,0],cards:[rnd(1.3,2.6),0],fouls:[rnd(9,14),rnd(9,14)],
           off:[rnd(1.1,2.7),rnd(1.1,2.5)],assists:[0,0],tackles:[rnd(13,22),rnd(13,22)],throw:[rnd(17,26),rnd(17,26)],xg:[0,0]},
        abs:Math.floor(rnd(0,3.99))};
      const t=TEAMS[id];t.r.shots[0]*=att/1.05;t.r.shots[1]*=def/1.0;
      t.r.sot=[t.r.shots[0]*rnd(.3,.4),t.r.shots[1]*rnd(.3,.4)];t.r.cards[1]=rnd(1.3,2.6);
      t.r.xg=[1.35*att,1.2*def];t.r.assists=[1.3*att*.7,1.2*def*.7];
      t.elo=Math.round(1500+(att-def)*420+gauss()*25);
    });
    const ranked=L.teams.map((_,i)=>TEAMS[L.id+i]).sort((a,b)=>(b.att/b.def)-(a.att/a.def));
    ranked.forEach((t,k)=>{t.pos=k+1;t.pts=Math.round(62-k*4.2+rnd(-3,3))});
  });
  // Historique des 10 derniers matchs par statistique (+ anomalies injectées)
  Object.values(TEAMS).forEach(t=>{
    t.h={};
    METRICS.forEach(M=>{
      const[f,a]=t.r[M.k];
      const gen=l=>M.k==='xg'?+Math.max(0,l*rnd(.45,1.6)).toFixed(2):poisS(l);
      const hf=Array.from({length:10},()=>gen(f)),ha=Array.from({length:10},()=>gen(a));
      if(R()<.05&&M.k!=='xg')hf[9]=Math.round(f*rnd(2.2,2.9));

}
function stakeOf(m){
  const h=TEAMS[m.h],a=TEAMS[m.a];
  const best=Math.min(h.pos,a.pos),worst=Math.max(h.pos,a.pos);
  if(m.derby)return{idx:95,label:'Derby',txt:'Rivalité régionale : intensité et cartons en hausse, forme récente moins prédictive.'};
  if(best<=2&&worst<=4)return{idx:92,label:'Course au titre',txt:'Choc du haut de tableau : titre et prime de champion (≈ 40-50 M€ de droits TV et primes, estimation indicative).'};
  if(worst>=9)return{idx:85,label:'Maintien',txt:'Lutte pour le maintien : une relégation coûte ≈ 50-70 M€ de revenus (droits TV, sponsors), estimation indicative.'};
  if(best<=4)return{idx:74,label:'Places européennes',txt:'Qualification européenne en jeu (≈ 15-25 M€ de primes de participation, estimation indicative).'};
  return{idx:40,label:'Milieu de tableau',txt:'Enjeu comptable limité : risque de rotation et de motivation moindre.'};
}
function genInteg(m){
  const p1=probSel({t:'res',v:'1'},m,ZERO);
  const o0=1/(clamp(p1,.05,.95)*1.05)*(1+gauss()*.04);
  const u=R();const kind=u<.08?'major':u<.22?'minor':'none';
  const at=Math.floor(rnd(28,44)),mag=kind==='major'?rnd(.08,.32):rnd(.03,.07),dir=R()<.7?-1:1,steps=kind==='major'?3:1;
  const hist=[];let o=o0;
  for(let k=0;k<48;k++){o*=Math.exp(gauss()*.006);if(kind!=='none'&&k>=at&&k<at+steps)o*=Math.exp(dir*mag/steps);hist.push(+o.toFixed(3))}
  const rets=hist.slice(1).map((v,k)=>Math.log(v/hist[k]));
  const med=[...rets.map(Math.abs)].sort((a,b)=>a-b)[Math.floor(rets.length/2)]||.004;const sig=1.4826*med;
  m.oh=hist;m.ilog=[];let maxZ=0;
  rets.forEach((r,k)=>{const z=Math.abs(r)/sig;maxZ=Math.max(maxZ,z);
    if(z>3.2){const sev=z<5?1:z<9?2:z<15?3:4;
      m.ilog.push({t:m.ko-(47-k-1)*30*60e3,txt:(r<0?'Baisse':'Hausse')+' de la cote « victoire '+TN(m.h)+' »',pct:(Math.exp(r)-1)*100,z,sev})}});
  const div=kind==='major'?rnd(.04,.12):kind==='minor'?rnd(.01,.05):rnd(0,.025);
  const vol=kind==='major'&&R()<.75;
  m.signals=[];
  if(maxZ>6)m.signals.push('Mouvement de cote rapide sans information publique (z = '+dec(maxZ)+')');
  if(div>.04)m.signals.push('Divergence entre bookmakers et exchange ('+dec(div*100)+' pts de probabilité)');
  if(vol)m.signals.push('Volume inhabituel sur l\'exchange au moment du mouvement');
  if(m.derby&&kind!=='none')m.signals.push('Contexte à forte pression (derby)');
  m.dir=dir;
  m.risk=Math.round(clamp(clamp((maxZ-3.2)*6,0,70)+(div>.04?div*160:0)+(vol?12:0),0,100));
}
function simFinal(m){
  const st=zeroSt();st.minute=94;st.finished=true;st.htDone=true;
  st.hg=poisS(m.lh);st.ag=poisS(m.la);st.htH=binom(st.hg,.44);st.htA=binom(st.ag,.44);
  st.corners=poisS(m.stat.corners);st.cH=binom(st.corners,.55);st.cards=poisS(m.stat.cards);st.kH=binom(st.cards,.48);
  st.sot=Math.max(poisS(m.stat.sot),st.hg+st.ag);st.sH=Math.max(binom(st.sot,m.lh/(m.lh+m.la)),st.hg);if(st.sot-st.sH<st.ag)st.sot=st.sH+st.ag;
  st.shots=st.sot+poisS(m.stat.sot*1.6);st.shH=Math.round(st.shots*m.lh/(m.lh+m.la));
  st.fouls=poisS(m.stat.fouls);st.offsides=poisS(m.stat.offsides);
  st.xgH=+(m.lh*rnd(.6,1.4)).toFixed(2);st.xgA=+(m.la*rnd(.6,1.4)).toFixed(2);st.poss=Math.round(50+(TEAMS[m.h].att-TEAMS[m.a].att)*25+gauss()*5);

}
function genData(seed,genAt){
  rng=mulberry32(hashStr(seed));
  genTeams();
  const matches=[];let id=0;
  const slots=[];
  for(let d=-3;d<=4;d++){
    if(d===0){for(let i=0;i<4;i++)slots.push({off:-rnd(2.6,7),st:'FT'});for(let i=0;i<6;i++)slots.push({off:0,st:'LIVE'});for(let i=0;i<10;i++)slots.push({off:rnd(.4,11),st:'NS'})}
    else for(let i=0;i<12;i++)slots.push({off:d*24+rnd(-6,6),st:d<0?'FT':'NS'});
  }
  // appariements : une équipe ne joue qu'une fois par « jour »
  const byDay={};
  slots.forEach(s=>{const d=Math.round(s.off/24);(byDay[d]=byDay[d]||[]).push(s)});
  Object.values(byDay).forEach(list=>{
    const pairs=[];LEAGUES.forEach(L=>{const sh=shuffle(L.teams.map((_,i)=>L.id+i));for(let i=0;i<sh.length;i+=2)pairs.push([sh[i],sh[i+1],L.id])});
    const ps=shuffle(pairs);
    list.forEach((s,i)=>{const[h,a,lg]=ps[i%ps.length];
      const m={id:'m'+(id++),h,a,lg,ko:genAt+s.off*H,status:s.st,ref:Math.floor(R()*REFS.length),derby:R()<.07,D:rnd(.8,1),mom:[],ev:[]};
      m.refF=rnd(.85,1.25);
      matches.push(m);
    });
  });
  matches.forEach(m=>{
    const h=TEAMS[m.h],a=TEAMS[m.a];
    m.stake=stakeOf(m);
    const mot=m.stake.idx>80?1.03:m.stake.idx<50?.97:1;
    const absH=1-h.abs*.035,absA=1-a.abs*.035;
    m.lh=+(1.36*h.att*a.def*mot*absH).toFixed(3);m.la=+(1.10*a.att*h.def*mot*absA).toFixed(3);
    m.stat={
      corners:(h.r.corners[0]+a.r.corners[1])/2*1.05+(a.r.corners[0]+h.r.corners[1])/2*.95,
      cards:(h.r.cards[0]+a.r.cards[0])*m.refF*(m.derby?1.15:1)*(m.stake.idx>80?1.05:1),
      sot:(h.r.sot[0]+a.r.sot[1])/2+(a.r.sot[0]+h.r.sot[1])/2*.92,
      fouls:(h.r.fouls[0]+a.r.fouls[0]),offsides:(h.r.off[0]+a.r.off[0])
    };
    genInteg(m);
  });
  matches.sort((a,b)=>a.ko-b.ko);
  return{seed,genAt,matches,T:[]};
}

function liveTick(m,quiet){
  const st=m.st,dt=.5,prevMin=st.minute;st.minute+=dt;
  const f=.8+.4*(st.minute/93);const[ah,aa]=adjL(m,st);
  const last=m.mom.length?m.mom[m.mom.length-1]:0;
  const drift=(TEAMS[m.h].att-TEAMS[m.a].att)*.08;
  const mo=clamp(last*.9+drift+gauss()*.28,-1,1);m.mom.push(+mo.toFixed(2));if(m.mom.length>60)m.mom.shift();
  const shH=.5+mo*.3;
  const ev=(type,team,extra)=>{m.ev.push({min:Math.floor(st.minute),type,team,...extra});if(m.ev.length>40)m.ev.shift()};
  if(R()<ah/90*dt*f*(1+mo*.25)){st.hg++;st.shots++;st.shH++;st.sot++;st.sH++;st.xgH+=rnd(.15,.6);ev('But','h');if(!quiet)notifyGoal(m,'h')}
  if(R()<aa/90*dt*f*(1-mo*.25)){st.ag++;st.shots++;st.sot++;st.xgA+=rnd(.15,.6);ev('But','a');if(!quiet)notifyGoal(m,'a')}
  const shotRate=(TEAMS[m.h].r.shots[0]+TEAMS[m.a].r.shots[0])/90*dt;
  if(R()<shotRate){const hm=R()<shH;st.shots++;if(hm)st.shH++;const x=rnd(.02,.3);if(hm)st.xgH+=x;else st.xgA+=x;if(R()<.34){st.sot++;if(hm)st.sH++}}

  if(R()<m.stat.fouls/90*dt)st.fouls++;
  if(R()<m.stat.offsides/90*dt)st.offsides++;
  st.poss=Math.round(clamp(st.poss*.9+(50+mo*14)*.1,25,75));
  if(prevMin<45&&st.minute>=45){st.htDone=true;st.htH=st.hg;st.htA=st.ag;ev('Mi-temps','')}
  if(!quiet&&R()<.0015){
    const sev=Math.floor(rnd(2,4.99)),pct=(R()<.5?-1:1)*rnd(8,30);
    m.ilog.push({t:Date.now(),txt:'Mouvement de cote live sans événement de jeu ('+Math.floor(st.minute)+'e min)',pct,z:sev*4,sev,live:true});
    m.risk=Math.min(100,m.risk+sev*6);
    if(sev>=3)toast('Intégrité : mouvement '+SEVN[sev].toLowerCase()+' sur '+TN(m.h)+' – '+TN(m.a),'var(--or)');
  }
  if(st.minute>=90+(m.stop||4)){st.finished=true;m.status='FT';ev('Fin du match','');if(!quiet)onFinish(m)}
}
function startLive(m,warm){
  m.status='LIVE';m.st=zeroSt();m.stop=Math.floor(rnd(2,6.99));m.mom=[];m.ev=[];
  for(let i=0;i<warm*2;i++)liveTick(m,true);
}
function onFinish(m){

  if(next){next.ko=Date.now();startLive(next,0);next.T0=true;settle(next);toast('Coup d\'envoi : '+TN(next.h)+' – '+TN(next.a),'var(--ba)')}
}

/* ============ Suivi et règlement des prédictions ============ */
function trackTop(m){
  const used=new Set();const out=[];
  m.sels.filter(s=>s.p>=.65&&s.p<=.98).sort((a,b)=>b.ic-a.ic).forEach(s=>{if(out.length<3&&!used.has(s.g)){used.add(s.g);out.push(s)}});
  out.forEach(s=>DATA.T.push({id:'t'+DATA.T.length,mid:m.id,key:s.key,sp:s.sp,g:s.g,label:s.label,p:s.p,odds:s.best,ic:s.ic,val:s.val,status:'A',at:m.ko-6*H,set:null,live:false}));
}
function settle(m){
  DATA.T.forEach(t=>{
    if(t.mid!==m.id||!'AC'.includes(t.status))return;
    if(m.status!=='NS'&&t.status==='A')t.status='C';
    if(m.status==='NS')return;
    const r=evalSel(t.sp,m.st);
    if(r){t.status=r;t.set=Date.now();
      if(S.ready&&(S.favs.has(m.id)||t.live))toast((r==='V'?'Validé ✓ ':r==='P'?'Perdu ✗ ':'Remboursé ')+t.label+' ('+TN(m.h)+' – '+TN(m.a)+')',r==='V'?'var(--ok)':r==='P'?'var(--ba)':'var(--mu)')}
  });
}
function liveSpecs(m){
  const st=m.st,tg=st.hg+st.ag,L=[];
  ['1','X','2'].forEach(v=>L.push({g:'Résultat',sp:{t:'res',v}}));
  L.push({g:'Résultat',sp:{t:'res',v:'1X'}},{g:'Résultat',sp:{t:'res',v:'X2'}});
  [tg+.5,tg+1.5].forEach(l=>{L.push({g:'Buts',sp:{t:'tot',s:'goals',o:'O',l}},{g:'Buts',sp:{t:'tot',s:'goals',o:'U',l}})});
  if(!(st.hg>0&&st.ag>0))L.push({g:'Buts',sp:{t:'btts',v:true}},{g:'Buts',sp:{t:'btts',v:false}});
  if(!st.htDone){const ht=st.hg+st.ag;['1','X','2'].forEach(v=>L.push({g:'1re mi-temps',sp:{t:'htres',v}}));L.push({g:'1re mi-temps',sp:{t:'httot',o:'O',l:ht+.5}},{g:'1re mi-temps',sp:{t:'httot',o:'U',l:ht+.5}})}
  L.push({g:'Corners',sp:{t:'tot',s:'corners',o:'O',l:st.corners+1.5}},{g:'Corners',sp:{t:'tot',s:'corners',o:'U',l:st.corners+3.5}});
  L.push({g:'Cartons',sp:{t:'tot',s:'cards',o:'O',l:st.cards+.5}},{g:'Cartons',sp:{t:'tot',s:'cards',o:'U',l:st.cards+1.5}});
  return L.map(x=>{const p=clamp(probSel(x.sp,m,st),.001,.999);const V=clamp(.05+(st.minute<15?.1:0),0,.2);
    return{g:x.g,sp:x.sp,key:keyOf(x.sp),label:labelOf(x.sp,m),p,ic:icOf(p,.95,1,.95,m.risk/100,V)}});
}
function nextGoal(m){const st=m.st;const r=remF(st);const[ah,aa]=adjL(m,st);const lh=ah*r,la=aa*r,t=lh+la;const pn=Math.exp(-t);return{h:(1-pn)*lh/(t||1),a:(1-pn)*la/(t||1),n:pn}}
function autoTrackLive(m){
  if(m.st.minute>84||m.st.minute<8)return;
  const mine=DATA.T.filter(t=>t.mid===m.id&&t.live).length;if(mine>=3)return;
  const have=new Set(DATA.T.filter(t=>t.mid===m.id).map(t=>t.key));
  const c=m.live.filter(s=>s.p>=.80&&s.p<=.97&&!have.has(s.key)&&!evalSel(s.sp,m.st)).sort((a,b)=>b.ic-a.ic)[0];
  if(c&&R()<.04){
    DATA.T.push({id:'t'+DATA.T.length,mid:m.id,key:c.key,sp:c.sp,g:c.g,label:c.label+' ('+Math.floor(m.st.minute)+'e)',p:c.p,odds:+Math.max(1.01,1/(c.p*1.05)).toFixed(2),ic:c.ic,val:-.05,status:'C',at:Date.now(),set:null,live:true});
    if(S.favs.has(m.id))toast('Nouvelle prédiction live suivie : '+c.label+' – '+pc(c.p),'var(--info)');
  }
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({seed:DATA.seed,genAt:DATA.genAt,T:DATA.T,
    ms:DATA.matches.map(m=>({id:m.id,status:m.status,st:m.st||null,ev:m.ev,mom:m.mom,lh:m.lh,la:m.la,ilog:m.ilog,risk:m.risk,ko:m.ko,stop:m.stop})),

function load(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const now=Date.now();
  if(saved&&now-saved.genAt<8*H){
    DATA=genData(saved.seed,saved.genAt);
    const byId=Object.fromEntries(saved.ms.map(x=>[x.id,x]));
    DATA.matches.forEach(m=>{const x=byId[m.id];if(!x)return;Object.assign(m,{status:x.status,st:x.st,ev:x.ev||[],mom:x.mom||[],lh:x.lh,la:x.la,ilog:x.ilog,risk:x.risk,ko:x.ko,stop:x.stop})});
    rng=Math.random;
    DATA.matches.forEach(priceSels);
    DATA.T=saved.T||[];
    const u=saved.u||{};S.favs=new Set(u.favs||[]);S.favTeams=new Set(u.favTeams||[]);S.coupon=u.coupon||null;S.couponHist=u.couponHist||[];S.notes=u.notes||[];if(u.tab)S.tab=u.tab;S.bets=u.bets||[];if(u.bank)S.bank={...S.bank,...u.bank};S.rules=u.rules||[];S.hits=u.hits||[];S.seen=new Set(u.seen||[]);S.chat=u.chat||[];
    // rattrapage du temps écoulé pendant l'absence (max 20 min de jeu)
    const missed=Math.min(40,Math.floor((now-(saved.savedAt||now))/1000));
    for(let i=0;i<missed;i++)DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>liveTick(m,true));
    DATA.matches.forEach(m=>{if(m.status==='FT'&&m.st&&!m.st.finished)m.st.finished=true;settle(m)});
    ensureLive();
  }else{
    const genAt=Math.floor(now/H)*H;
    DATA=genData('omni-'+genAt,genAt);
    DATA.matches.forEach(m=>{if(m.status==='FT')m.st=simFinal(m)});
    DATA.matches.forEach(priceSels);
    DATA.matches.forEach(trackTop);
    rng=Math.random;
    DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>startLive(m,Math.floor(rnd(2,80))));
    DATA.matches.forEach(settle);
  }
  DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>{m.live=liveSpecs(m)});
}
function ensureLive(){
  while(DATA.matches.filter(m=>m.status==='LIVE').length<6){
    const n=DATA.matches.filter(m=>m.status==='NS').sort((a,b)=>a.ko-b.ko)[0];if(!n)break;n.ko=Date.now();startLive(n,0);
  }
}

function tick(){
  DATA.matches.filter(m=>m.status==='LIVE').forEach(m=>{
    const g0=m.st.hg+m.st.ag;liveTick(m,false);
    if(m.status==='LIVE'){m.live=liveSpecs(m);autoTrackLive(m);settle(m)}
    if(m.st.hg+m.st.ag!==g0)settle(m);
  });
  if(settleBets()&&S.tab==='bankroll')renderDyn();
  $('#clock').textContent='Mise à jour '+hms(Date.now());
  if(['home','live','cal','journal','integ','favs'].includes(S.tab))renderDyn();

}
function marketTick(){
  // mouvements de marché pré-match : nouvelles infos, cotes qui bougent
  const ns=DATA.matches.filter(m=>m.status==='NS');
  for(let i=0;i<4&&ns.length;i++){
    const m=ns[Math.floor(Math.random()*ns.length)];
    m.lh=+(m.lh*(1+gauss()*.015)).toFixed(3);m.la=+(m.la*(1+gauss()*.015)).toFixed(3);

function ring(p,size=46){
  const r=size/2-5,c=2*Math.PI*r,cls=confCls(p);
  return`<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${pc(p)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--c)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle">${Math.round(p*100)}</text></svg>`;
}
function spark(arr,w=160,h=40,alert=false){
  if(!arr||arr.length<2)return'';
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1,pad=4;
  const X=i=>pad+i*(w-2*pad)/(arr.length-1),Y=v=>h-pad-(v-mn)/rg*(h-2*pad);
  const d=arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return`<svg class="spark${alert?' alert':''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution"><line class="grid" x1="${pad}" x2="${w-pad}" y1="${h/2}" y2="${h/2}"/><path class="a" d="${d} L${X(arr.length-1).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z"/><path class="l" d="${d}"/><circle cx="${X(arr.length-1).toFixed(1)}" cy="${Y(arr[arr.length-1]).toFixed(1)}" r="2.8"/></svg>`;
}
function bars(arr,w=150,h=34,flagLast=false){
  const mx=Math.max(...arr,1),bw=(w-2)/arr.length;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="10 derniers matchs">${arr.map((v,i)=>{const bh=Math.max(1.5,v/mx*(h-2));return`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${flagLast&&i===arr.length-1?'var(--or)':'var(--ac2)'}" opacity="${i===arr.length-1?1:.55}"/>`}).join('')}</svg>`;
}

}

   <div><div class="row" style="justify-content:space-between;font-size:11.5px" class="mu"><span class="mu">Pression ${esc(TN(m.h))}</span><span class="mu">Pression ${esc(TN(m.a))}</span></div>${momentum(m)}</div>
   <div class="sgrid"><div><span>Possession</span><b class="num">${st.poss}–${100-st.poss}</b></div><div><span>xG</span><b class="num">${dec(st.xgH,2)}–${dec(st.xgA,2)}</b></div><div><span>Tirs (cadrés)</span><b class="num">${st.shH}(${st.sH})–${st.shots-st.shH}(${st.sot-st.sH})</b></div><div><span>Corners</span><b class="num">${st.cH}–${st.corners-st.cH}</b></div><div><span>Cartons</span><b class="num">${st.kH}–${st.cards-st.kH}</b></div><div><span>Fautes</span><b class="num">${st.fouls}</b></div></div>
   ${evs.length?`<div class="evs">${evs.map(e=>`<span>${e.min}' ${e.type}${e.team?' '+esc(TN(e.team==='h'?m.h:m.a)).split(' ').slice(-1)[0]:''}</span>`).join('')}</div>`:''}
   <div><div class="eyebrow" style="margin-bottom:4px">Prédictions live</div>

    <div class="prow"><span>Prochain but : ${esc(TN(m.a))}</span><span class="bar"><i style="width:${ng.a*100}%;--c:var(--ac2)"></i></span><span class="num">${pc(ng.a)}</span><span></span></div>`:''}
    ${specs.map(s=>`<div class="prow"><span>${esc(s.label)}</span><span class="bar ${confCls(s.p)}"><i style="width:${s.p*100}%"></i></span><span class="num">${pc(s.p)}</span><span class="cp ${confCls(s.p)}">${s.p>=.7?'fort':s.p>=.55?'moyen':'faible'}</span></div>`).join('')||'<div class="note">1re mi-temps terminée : marchés réglés ci-dessous.</div>'}
   </div>

/* ---- Coupons ---- */
const scoreOf=(mode,s)=>mode==='surete'?s.p*s.ic:mode==='rendement'?s.best*s.ic:Math.sqrt(s.p)*(s.p*s.best)*s.ic;
function candidates({scope,min,max,q,excl,mode}){
  const now=Date.now(),hz=scope==='jour'?30:96;
  return DATA.matches.filter(m=>m.status==='NS'&&m.ko>now+5*60e3&&m.ko<now+hz*H&&lvl(m.risk)<=1&&!(excl&&excl.has(m.id))&&(!q||matchText(m).includes(q)))
    .map(m=>{const c=m.sels.filter(s=>s.p>=min&&s.p<=max);if(!c.length)return null;const s=c.reduce((a,b)=>scoreOf(mode,b)>scoreOf(mode,a)?b:a);return{mid:m.id,selId:s.id,key:s.key,label:s.label,p:s.p,odds:s.best,ic:s.ic,val:s.val,g:s.g,sc:scoreOf(mode,s)}})
    .filter(Boolean).sort((a,b)=>b.sc-a.sc);
}
function generate(n,o){return candidates(o).slice(0,n)}
const couponOpts=()=>({scope:'jour',min:S.cMin/100,max:.98,q:S.cQ.trim().toLowerCase(),mode:S.cMode});
function refreshItem(it){const m=MB(it.mid);const s=m&&m.status==='NS'&&m.sels.find(x=>x.key===it.key);if(s){it.p=s.p;it.odds=s.best;it.ic=s.ic;it.val=s.val}return it}
function doGenerate(){
  const items=generate(S.cSize,couponOpts());
  S.coupon={items,at:Date.now(),size:S.cSize};S.alt=null;
  S.couponMsg=items.length<S.cSize?`Seulement ${items.length} sélection(s) remplissent les critères (${S.cMin}-98 %, intégrité verte ou jaune). Baissez le seuil ou élargissez la recherche.`:`Coupon généré : ${items.length} sélections entre ${S.cMin} et 98 %.`;
  pushHist();save();render();
}
function doRegenerate(){
  if(!S.coupon||S.coupon.size!==S.cSize)return doGenerate();
  const cur=S.coupon.items.map(refreshItem);
  const excl=new Set(cur.map(i=>i.mid));
  const nw=generate(S.cSize,{...couponOpts(),excl});
  const locked=cur.filter(i=>i.lock),free=cur.filter(i=>!i.lock).sort((a,b)=>b.p-a.p);
  const pool=nw.slice();const final=[...locked];let rep=0;
  free.forEach(old=>{const k=pool.findIndex(n=>n.p>old.p||(n.p===old.p&&n.ic>old.ic));if(k>=0){final.push({...pool[k],isNew:true});pool.splice(k,1);rep++}else final.push({...old,isNew:false})});
  while(final.length<S.cSize&&pool.length){final.push({...pool.shift(),isNew:true});rep++}
  S.alt=nw;
  S.coupon={items:final.map(i=>({...i,lock:!!i.lock})),at:Date.now(),size:S.cSize};
  S.couponMsg=rep?`${rep} sélection(s) remplacée(s) par un pourcentage plus élevé (surlignées). Les autres sont conservées.`:'Coupon déjà optimal : les nouvelles sélections ont un pourcentage plus faible, les meilleures sont conservées. Les nouvelles propositions sont affichées à côté.';
  pushHist();save();render();
}
function pushHist(){const c=S.coupon;if(!c)return;const pr=c.items.reduce((a,i)=>a*i.p,1),o=c.items.reduce((a,i)=>a*i.odds,1);S.couponHist.unshift({at:c.at,n:c.items.length,p:pr,o});S.couponHist=S.couponHist.slice(0,8)}
function couponList(items,showLock){
  const pr=items.reduce((a,i)=>a*i.p,1),o=items.reduce((a,i)=>a*i.odds,1);
  return`<div class="list">${items.map((i,k)=>{const m=MB(i.mid);return`<div class="cp-item${i.isNew?' new':''}"><span class="ix">${k+1}</span>
    <div class="teams" data-act="open:${m.id}" style="cursor:pointer"><span style="font-weight:600">${esc(i.label)}</span><span class="mu" style="font-size:12px">${esc(TN(m.h))} – ${esc(TN(m.a))} · ${hm(m.ko)} · ${LGN(m.lg)}</span></div>
    <span class="cp ${confCls(i.p)}">${pc(i.p)}</span><span class="num hide-s">${od(i.odds)}</span>
    ${showLock?`<button class="lock${i.lock?' on':''}" data-act="lock:${k}" aria-label="Verrouiller">${i.lock?'🔒':'🔓'}</button>`:'<span></span>'}</div>`}).join('')}
    <div class="total"><div><b>${pc(pr)}</b><span>probabilité combinée</span></div><div><b>${od(o)}</b><span>cote totale</span></div><div><b>${dec((pr*o-1)*100)} %</b><span>espérance (EV)</span></div><div><b>${items.length}</b><span>sélections</span></div></div></div>`;
}
V.coupons={head:()=>`<div class="ph"><div><div class="eyebrow">Coupons du jour · prochaines 30 h</div><h2>Générer un coupon à haute probabilité</h2><p>Une sélection par match, probabilité calibrée entre le seuil choisi et 98 %, matchs en alerte orange ou rouge exclus.</p></div></div>

    <label class="lbl" for="cQ">Rechercher dans le coupon<input id="cQ" class="inp" data-in="cQ" placeholder="Équipe ou compétition" value="${esc(S.cQ)}" autocomplete="off"></label>

  </div>`,
dyn:()=>{
  const c=S.coupon;

   ${S.alt?`<div><h3 style="margin-bottom:8px">Nouvelle proposition</h3>${S.alt.length?couponList(S.alt,false):'<div class="list"><div class="empty">Aucune autre sélection disponible.</div></div>'}</div>`:''}</div>
   ${w}
   ${S.couponHist.length?`<div><h3 style="margin-bottom:8px">Historique des générations</h3><div class="tw panel" style="padding:0"><table><thead><tr><th>Heure</th><th class="r">Sélections</th><th class="r">Proba. combinée</th><th class="r">Cote</th></tr></thead><tbody>${S.couponHist.map(h=>`<tr><td class="num">${hms(h.at)}</td><td class="r num">${h.n}</td><td class="r num">${pc(h.p)}</td><td class="r num">${od(h.o)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}};

/* ---- Combo ---- */
V.combo={head:()=>`<div class="ph"><div><div class="eyebrow">Combo</div><h2>Composer un combiné sur mesure</h2><p>Le résultat se recalcule à chaque réglage.</p></div></div>
 <div class="panel" style="display:flex;flex-direction:column;gap:14px">
  <div class="row"><div class="chips">${[['jour','Matchs du jour'],['avenir','Matchs à venir (4 jours)']].map(([k,n])=>`<button class="chip${S.comboScope===k?' on':''}" data-act="comboScope:${k}">${n}</button>`).join('')}</div></div>
  <div class="row" style="gap:22px">
   <label class="lbl" for="comboN"><span>Nombre de matchs : <b id="comboNV" style="color:var(--tx)">${S.comboN}</b></span><input id="comboN" type="range" min="1" max="20" value="${S.comboN}" data-in="comboN"></label>
   <div class="lbl">Sélection rapide<div class="chips">${[2,3,5,8,10].map(n=>`<button class="chip${S.comboN===n?' on':''}" data-act="comboN:${n}">${n}</button>`).join('')}</div></div>
   <label class="lbl" for="comboMin"><span>Confiance : <b id="comboMinV" style="color:var(--tx)">${S.comboMin} %</b> → 98 %</span><input id="comboMin" type="range" min="70" max="98" value="${S.comboMin}" data-in="comboMin"></label>
  </div>
  <div class="row"><div class="chips">${[['rendement','Rendement'],['surete','Sûreté'],['equilibre','Équilibré']].map(([k,n])=>`<button class="chip${S.comboMode===k?' on':''}" data-act="comboMode:${k}">${n}</button>`).join('')}</div>
  <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="comboSingles" data-in="comboSingles"${S.comboSingles?' checked':''}> Cotes simples (paris séparés)</label></div>
 </div>`,
dyn:()=>{
  const items=generate(S.comboN,{scope:S.comboScope,min:S.comboMin/100,max:.98,mode:S.comboMode});
  if(!items.length)return'<div class="list"><div class="empty">Aucune sélection ne remplit ces critères.</div></div>';
  const short=items.length<S.comboN?`<div class="msg">${items.length} match(s) seulement remplissent les critères.</div>`:'';
  if(S.comboSingles){
    return short+`<div class="tw panel" style="padding:0"><table><thead><tr><th>Sélection</th><th>Match</th><th class="r">Proba.</th><th class="r">Cote</th><th class="r">Value</th><th class="r">Mise ¼ Kelly</th></tr></thead><tbody>${items.map(i=>{const m=MB(i.mid);const k=(i.p*i.odds-1)/(i.odds-1)/4;return`<tr class="click" data-act="open:${m.id}"><td>${esc(i.label)}</td><td class="mu">${esc(TN(m.h))} – ${esc(TN(m.a))}</td><td class="r"><span class="cp ${confCls(i.p)}">${pc(i.p)}</span></td><td class="r num">${od(i.odds)}</td><td class="r num">${dec(i.val*100)} %</td><td class="r num">${k>0?dec(k*100)+' % du capital':'pas de value'}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  const pr=items.reduce((a,i)=>a*i.p,1);
  return short+'<div class="row"><button class="btn" data-act="betCombo">+ Suivre ce combo dans la bankroll</button></div>'+couponList(items,false)+(pr<.5?`<div class="warn">Probabilité combinée de ${pc(pr)} : ce combiné perdra plus souvent qu'il ne gagnera. Réduisez le nombre de matchs ou passez en cotes simples.</div>`:'');
}};

V.journal={head:()=>`<div class="ph"><div><div class="eyebrow">Journal</div><h2>Statut de toutes les prédictions</h2><p>Chaque prédiction suivie, avec la cote prise, le statut et la performance réelle du modèle.</p></div></div>
 <div class="row"><div class="chips">${[['all','Tout'],['day','Aujourd\'hui'],['7d','7 jours']].map(([k,n])=>`<button class="chip${S.jPer===k?' on':''}" data-act="jPer:${k}">${n}</button>`).join('')}</div>
 <div class="chips">${[['all','Tous'],['A','En attente'],['C','En cours'],['V','Validés'],['P','Perdus'],['R','Push']].map(([k,n])=>`<button class="chip${S.jSt===k?' on':''}" data-act="jSt:${k}">${n}</button>`).join('')}</div>
 <select id="jG" class="inp" data-in="jG" aria-label="Marché"><option value="all">Tous les marchés</option>${GROUPS.map(g=>`<option${S.jG===g?' selected':''}>${g}</option>`).join('')}</select></div>`,
dyn:()=>{
  const now=Date.now();
  let L=DATA.T.filter(t=>{const m=MB(t.mid);if(S.jPer==='day'&&Math.abs(m.ko-now)>24*H)return false;if(S.jPer==='7d'&&m.ko<now-7*24*H)return false;return S.jG==='all'||t.g===S.jG});
  const cnt=k=>L.filter(t=>t.status===k).length;const pf=perf(L);
  const buckets=[[.65,.70],[.70,.80],[.80,.90],[.90,.99]].map(([a,b])=>{const x=L.filter(t=>t.p>=a&&t.p<b&&'VP'.includes(t.status));const v=x.filter(t=>t.status==='V').length;return{a,b,n:x.length,pred:x.length?x.reduce((s,t)=>s+t.p,0)/x.length:0,obs:x.length?v/x.length:0}});
  const rows=L.filter(t=>S.jSt==='all'||t.status===S.jSt).sort((a,b)=>MB(b.mid).ko-MB(a.mid).ko).slice(0,200);
  return`<div class="kpis"><div class="kpi"><b>${L.length}</b><span>prédictions</span></div><div class="kpi"><b style="color:var(--info)">${cnt('C')+cnt('A')}</b><span>en cours / en attente</span></div><div class="kpi"><b style="color:var(--ok)">${cnt('V')}</b><span>validées</span></div><div class="kpi"><b style="color:var(--ba)">${cnt('P')}</b><span>perdues</span></div><div class="kpi"><b>${cnt('R')}</b><span>push (remboursées)</span></div><div class="kpi"><b>${pc(pf.hit)}</b><span>réussite · ROI ${pf.roi>=0?'+':''}${dec(pf.roi*100)} %</span></div></div>
  <div class="grid2" style="align-items:start">
   <div class="panel"><h3>Calibration</h3><p class="note">Une probabilité annoncée doit se réaliser aussi souvent qu'annoncé.</p><div class="tw"><table><thead><tr><th>Tranche</th><th class="r">Réglées</th><th class="r">Annoncé</th><th class="r">Observé</th><th>Écart</th></tr></thead><tbody>${buckets.map(b=>`<tr><td class="num">${Math.round(b.a*100)}-${Math.round(b.b*100)} %</td><td class="r num">${b.n}</td><td class="r num">${b.n?pc(b.pred):'–'}</td><td class="r num">${b.n?pc(b.obs):'–'}</td><td>${b.n?`<span class="cp ${Math.abs(b.obs-b.pred)<.06?'c-hi':Math.abs(b.obs-b.pred)<.12?'c-mid':'c-bad'}">${b.obs-b.pred>=0?'+':''}${Math.round((b.obs-b.pred)*100)} pts</span>`:''}</td></tr>`).join('')}</tbody></table></div><p class="note">Échantillon réduit sur quelques jours : l'écart se resserre avec le volume.</p></div>
   <div class="panel"><h3>Performance par marché</h3><div class="tw"><table><thead><tr><th>Marché</th><th class="r">V</th><th class="r">P</th><th class="r">Réussite</th><th class="r">ROI</th></tr></thead><tbody>${GROUPS.map(g=>{const p=perf(L.filter(t=>t.g===g));return p.n?`<tr><td>${g}</td><td class="r num">${p.v}</td><td class="r num">${p.p}</td><td class="r num">${pc(p.hit)}</td><td class="r num">${p.roi>=0?'+':''}${dec(p.roi*100)} %</td></tr>`:''}).join('')}</tbody></table></div></div>
  </div>
  <div class="tw panel" style="padding:0"><table><thead><tr><th>Match</th><th>Prédiction</th><th>Type</th><th class="r">Proba.</th><th class="r">Cote</th><th class="r">Score</th><th>Statut</th></tr></thead><tbody>
  ${rows.map(t=>{const m=MB(t.mid);return`<tr class="click" data-act="open:${m.id}"><td><div>${esc(TN(m.h))} – ${esc(TN(m.a))}</div><div class="mu" style="font-size:12px">${dayLbl(m.ko)} ${hm(m.ko)} · ${LGN(m.lg)}</div></td><td>${esc(t.label)}</td><td class="mu">${t.live?'Live':'Pré-match'}</td><td class="r"><span class="cp ${confCls(t.p)}">${pc(t.p)}</span></td><td class="r num">${od(t.odds)}</td><td class="r num">${m.status==='NS'?'–':m.st.hg+'-'+m.st.ag+(m.status==='LIVE'?' ('+Math.floor(m.st.minute)+'\')':'')}</td><td>${stPill(t.status)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Aucune prédiction.</td></tr>'}</tbody></table></div>`;
}};

/* ---- Intégrité ---- */
V.integ={head:()=>`<div class="ph"><div><div class="eyebrow">Intégrité · détection d'anomalies de marché</div><h2>Matchs aux mouvements de cotes inhabituels</h2><p>Signaux statistiques (z-score robuste, divergence entre bookmakers, volumes), pas des preuves de trucage. Une suspicion réelle se signale aux autorités sportives ou au régulateur.</p></div></div>
 <div class="row"><div class="chips">${[['all','Tous les signaux'],['1','À surveiller +'],['2','Suspect +'],['3','Très suspect']].map(([k,n])=>`<button class="chip${S.iLvl===k?' on':''}" data-act="iLvl:${k}">${n}</button>`).join('')}</div>
 <div class="legend">${LVN.map((n,i)=>`<span class="risk lv${i}">${n}</span>`).join('')}</div></div>`,
dyn:()=>{
  const min=S.iLvl==='all'?1:+S.iLvl;
  const ms=DATA.matches.filter(m=>lvl(m.risk)>=min).sort((a,b)=>(a.status==='FT')-(b.status==='FT')||b.risk-a.risk);
  const counts=[0,1,2,3].map(l=>DATA.matches.filter(m=>m.status!=='FT'&&lvl(m.risk)===l).length);
  return`<div class="kpis">${counts.map((c,i)=>`<div class="kpi lv${i}"><b style="color:var(--c)">${c}</b><span>${LVN[i]} (à venir / live)</span></div>`).join('')}</div>
  ${ms.map(m=>{
    const p1=m.sels.find(s=>s.key===keyOf({t:'res',v:'1'}));const imp=1/(m.oh[m.oh.length-1]*1.05);
    const exposed=m.sels.filter(s=>s.p>=.6&&s.p<=.98).sort((a,b)=>b.p-a.p).slice(0,4);
    return`<div class="panel lv${lvl(m.risk)}" style="border-left:3px solid var(--c)"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${LGN(m.lg)} · ${m.status==='LIVE'?'en direct '+Math.floor(m.st.minute)+'\'':m.status==='FT'?'terminé '+m.st.hg+'-'+m.st.ag:dayLbl(m.ko)+' '+hm(m.ko)}</div><h3 data-act="open:${m.id}" style="cursor:pointer">${esc(TN(m.h))} – ${esc(TN(m.a))}</h3></div><div class="row">${riskB(m.risk)}<button class="star${S.favs.has(m.id)?' on':''}" data-act="fav:${m.id}" aria-label="Suivre">${S.favs.has(m.id)?'★':'☆'}</button></div></div>
    <div class="grid2" style="margin-top:10px">
     <div><div class="eyebrow">Cote « victoire ${esc(TN(m.h))} » (24 h)</div>${spark(m.oh,300,60,lvl(m.risk)>=2)}
      <p class="note">Modèle : ${pc(p1.p)} · marché (implicite) : ${pc(imp)} · écart ${Math.round((imp-p1.p)*100)} pts. ${m.dir<0&&lvl(m.risk)>=1?'Le marché pousse la victoire de '+esc(TN(m.h))+'.':lvl(m.risk)>=1?'Le marché se détourne de '+esc(TN(m.h))+'.':''}</p>
      ${m.signals.length?`<ul class="note" style="margin:6px 0 0;padding-left:18px">${m.signals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>
     <div><div class="eyebrow">Journal des changements</div><div class="tl">${m.ilog.slice(-6).reverse().map(e=>`<div class="${SEVC[e.sev]}"><span class="num mu">${hm(e.t)}</span><i class="dot"></i><span>${esc(e.txt)} <span class="num">${e.pct>0?'+':''}${dec(e.pct)} %</span></span><span class="risk">${SEVN[e.sev]}</span></div>`).join('')||'<div><span></span><span></span><span class="mu">Aucun mouvement significatif.</span><span></span></div>'}</div>
     <div class="eyebrow" style="margin-top:10px">Options exposées (modèle)</div>${exposed.map(s=>`<div class="prow"><span>${esc(s.label)}</span><span class="bar ${confCls(s.p)}"><i style="width:${s.p*100}%"></i></span><span class="num">${pc(s.p)}</span><span></span></div>`).join('')}</div>
    </div></div>`}).join('')||'<div class="list"><div class="empty">Aucun match à ce niveau.</div></div>'}`;
}};

V.stats={head:()=>`<div class="ph"><div><div class="eyebrow">Stats équipes</div><h2>${METRICS.find(x=>x.k===S.stM).n} : moyennes, tendances et prochain match</h2></div></div>
 <div class="tabs">${METRICS.map(x=>`<button class="${S.stM===x.k?'on':''}" data-act="stM:${x.k}">${x.n}</button>`).join('')}</div>
 <label class="lbl" for="stLeague">Compétition<select id="stLeague" class="inp" data-in="stLeague" style="max-width:240px"><option value="all">Toutes</option>${LEAGUES.map(l=>`<option value="${l.id}"${S.stLeague===l.id?' selected':''}>${l.n}</option>`).join('')}</select></label>`,
dyn:()=>{
  const k=S.stM,isX=k==='xg';const fmt=v=>dec(v,isX?2:1);
  const ts=Object.values(TEAMS).filter(t=>S.stLeague==='all'||t.lg===S.stLeague).map(t=>{
    const f=t.h[k].f,a=t.h[k].a,avg=f.reduce((s,v)=>s+v,0)/10,avgA=a.reduce((s,v)=>s+v,0)/10;
    const prev=f.slice(0,9),mu=prev.reduce((s,v)=>s+v,0)/9,sd=Math.sqrt(prev.reduce((s,v)=>s+(v-mu)**2,0)/9)||Math.sqrt(mu)||1;
    const z=(f[9]-mu)/sd;const trend=f.slice(5).reduce((s,v)=>s+v,0)/5-f.slice(0,5).reduce((s,v)=>s+v,0)/5;
    return{t,f,avg,avgA,z,trend}}).sort((a,b)=>b.avg-a.avg);
  const sel=S.stTeam&&TEAMS[S.stTeam]?S.stTeam:ts[0].t.id;const T=TEAMS[sel];
  const nx=DATA.matches.filter(m=>m.status==='NS'&&(m.h===sel||m.a===sel)).sort((a,b)=>a.ko-b.ko)[0];
  let pred='';
  if(nx){const opp=TEAMS[nx.h===sel?nx.a:nx.h];const lam=(T.r[k][0]+opp.r[k][1])/2;
    if(isX)pred=`<p>Prochain match contre <b>${esc(opp.n)}</b> (${dayLbl(nx.ko)} ${hm(nx.ko)}) : xG attendu <b class="num">${dec(nx.h===sel?nx.lh:nx.la,2)}</b>.</p>`;
    else{const line=Math.max(.5,Math.floor(lam)-.5);const po=pOver(lam,line);pred=`<p>Prochain match contre <b>${esc(opp.n)}</b> (${dayLbl(nx.ko)} ${hm(nx.ko)}) : moyenne attendue <b class="num">${dec(lam)}</b>.</p><div class="prow"><span>${esc(T.n)} plus de ${dec(line)} ${METRICS.find(x=>x.k===k).n.toLowerCase()}</span><span class="bar ${confCls(po)}"><i style="width:${po*100}%"></i></span><span class="num">${pc(po)}</span><span></span></div><div class="prow"><span>${esc(T.n)} plus de ${dec(line+1)}</span><span class="bar ${confCls(pOver(lam,line+1))}"><i style="width:${pOver(lam,line+1)*100}%"></i></span><span class="num">${pc(pOver(lam,line+1))}</span><span></span></div>`}}
  const alerts=[];Object.values(TEAMS).forEach(t=>METRICS.forEach(M=>{if(M.k==='xg')return;const f=t.h[M.k].f,prev=f.slice(0,9),mu=prev.reduce((s,v)=>s+v,0)/9,sd=Math.sqrt(prev.reduce((s,v)=>s+(v-mu)**2,0)/9)||1,z=(f[9]-mu)/sd;if(z>2.5)alerts.push({t,M,v:f[9],mu,z,sev:z<3.5?1:z<5?2:z<7?3:4})}));
  alerts.sort((a,b)=>b.z-a.z);
  return`<div class="grid2" style="align-items:start">
   <div class="tw panel" style="padding:0"><table><thead><tr><th>#</th><th>Équipe</th><th class="r">Pour</th><th class="r">Contre</th><th>10 derniers</th><th class="r">Tendance</th></tr></thead><tbody>
   ${ts.map((x,i)=>`<tr class="click" data-act="stTeam:${x.t.id}" ${x.t.id===sel?'style="background:var(--sf2)"':''}><td class="num mu">${i+1}</td><td>${esc(x.t.n)}${x.z>2.5?' <span class="risk lv2" title="Valeur inhabituelle au dernier match">⚑</span>':''}</td><td class="r num">${fmt(x.avg)}</td><td class="r num">${fmt(x.avgA)}</td><td>${bars(x.f,120,28,x.z>2.5)}</td><td class="r num" style="color:${x.trend>0?'var(--ok)':x.trend<0?'var(--ba)':'var(--mu)'}">${x.trend>0?'▲':x.trend<0?'▼':'•'} ${fmt(Math.abs(x.trend))}</td></tr>`).join('')}</tbody></table></div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${LGN(T.lg)} · ${T.pos}e · Elo ${T.elo}</div><h3>${esc(T.n)}</h3></div><button class="star${S.favTeams.has(sel)?' on':''}" data-act="favT:${sel}" aria-label="Équipe favorite">${S.favTeams.has(sel)?'★':'☆'}</button></div>
     <div class="sgrid" style="margin-top:8px"><div><span>Moy. pour</span><b class="num">${fmt(T.h[k].f.reduce((s,v)=>s+v,0)/10)}</b></div><div><span>Moy. contre</span><b class="num">${fmt(T.h[k].a.reduce((s,v)=>s+v,0)/10)}</b></div><div><span>Max</span><b class="num">${fmt(Math.max(...T.h[k].f))}</b></div></div>
     <div style="margin-top:10px">${bars(T.h[k].f,300,60)}</div>${pred}</div>
    ${cmpPanel(sel)}
    <div class="panel"><h3>Valeurs inhabituelles</h3><p class="note">Dernier match nettement au-dessus de la moyenne de l'équipe (z &gt; 2,5). À croiser avec le menu Intégrité.</p><div class="tl">${alerts.slice(0,10).map(a=>`<div class="${SEVC[a.sev]}"><span class="num mu">z ${dec(a.z)}</span><i class="dot"></i><span>${esc(a.t.n)} : ${a.v} ${a.M.n.toLowerCase()} (moy. ${dec(a.mu)})</span><span class="risk">${SEVN[a.sev]}</span></div>`).join('')||'<div><span></span><span></span><span class="mu">Aucune anomalie.</span><span></span></div>'}</div></div>
   </div></div>`;
}};

  <h3 style="margin:16px 0 8px">Notifications</h3><div class="panel tl">${S.notes.slice(0,15).map(n=>`<div><span class="num mu">${hm(n.t)}</span><i class="dot" style="--c:${n.c}"></i><span>${esc(n.txt)}</span><span></span></div>`).join('')||'<span class="mu">Aucune notification.</span>'}</div></div></div>`;

/* ---- Méthode ---- */
V.method={dyn:()=>`<div class="method panel" style="display:flex;flex-direction:column;gap:10px">
 <div class="eyebrow">Méthode</div><h2>Comment OMNISCORE calcule ses pourcentages</h2>
 <p><b>Prototype.</b> Les équipes, cotes et statistiques de cette démo sont simulées. Le moteur, lui, est réel : il suffit de le brancher sur une API sous licence (Opta, Sportradar, API-Football, The Odds API…).</p>
 <h3>1. Buts attendus et scores</h3><p>Pour chaque match : <code>λ_dom = 1,36 × attaque_dom × défense_ext × enjeu × absences</code>, puis une matrice de scores de Poisson avec la correction Dixon-Coles (ρ = −0,07) sur les scores 0-0, 1-0, 0-1 et 1-1. Tous les marchés de buts (1X2, double chance, remboursé si nul, plus/moins, les deux marquent, 1re mi-temps) sont dérivés de cette matrice.</p>
 <h3>2. Corners, cartons, tirs cadrés, fautes, hors-jeux</h3><p>Modèles de comptage de Poisson combinant la moyenne pour de l'équipe et la moyenne contre de l'adversaire, ajustés par l'arbitre, le derby et l'enjeu.</p>
 <h3>3. Live</h3><p>Intensité restante <code>λ(t) = λ × temps restant × cartons rouges × état du score</code>, recalculée à chaque événement. Les buts sont plus fréquents en fin de match, une équipe menée attaque davantage, un carton rouge réduit l'équipe touchée.</p>
 <h3>4. Indice de confiance</h3><p><code>IC = 100 × p × A^0,6 × D^0,7 × M^0,9 × (1 − R)^1,2 × (1 − V)^0,5</code> : A accord entre sous-modèles, D complétude des données, M accord avec la cote de référence, R risque intégrité, V volatilité.</p>
 <h3>5. Value et mise</h3><p><code>value = p × cote − 1</code> ; mise <code>¼ × (p × cote − 1) / (cote − 1)</code>.</p>
 <h3>6. Intégrité</h3><p>Rendements logarithmiques de la cote, z-score robuste (médiane des écarts absolus), divergence bookmakers/exchange et volume. Score 0-100 : vert &lt; 25, jaune &lt; 50, orange &lt; 75, rouge au-delà. Les matchs orange et rouges sont exclus des coupons.</p>
 <div class="warn">Aucune prédiction n'est garantie. Les pourcentages sont des probabilités, vérifiables dans le Journal (calibration). Réservé aux 18 ans et plus. Jouez de manière responsable : fixez-vous des limites, et demandez de l'aide si le jeu devient un problème.</div>
</div>`};

/* ---- Fiche match (tiroir) ---- */
function renderDrawer(){
  const m=MB(S.drawer);const d=$('#drawer');if(!m){d.hidden=true;return}
  if(S.simFor!==m.id){S.simFor=m.id;S.sim={attH:0,attA:0,red:0,absH:false,absA:false,rain:false}}
  if(d.contains(document.activeElement)&&document.activeElement.matches('input'))return;
  const st=m.st&&m.status!=='NS'?m.st:null;const h=TEAMS[m.h],a=TEAMS[m.a];
  const M=mat(m.lh,m.la,true);const sc=[];for(let i=0;i<7;i++)for(let j=0;j<7;j++)sc.push([i,j,M[i][j]]);sc.sort((x,y)=>y[2]-x[2]);
  const tr=DATA.T.filter(t=>t.mid===m.id);
  const fac=[['Attaque '+h.n,h.att,.7,1.45],['Défense '+a.n+' (buts encaissés)',a.def,.7,1.35],['Attaque '+a.n,a.att,.7,1.45],['Défense '+h.n+' (buts encaissés)',h.def,.7,1.35],['Enjeu du match',m.stake.idx/100,0,1],['Complétude des données',m.D,.7,1]];
  const scroll=d.querySelector('.dw')?.scrollTop||0;
  d.innerHTML=`<div class="dw" role="dialog" aria-label="Fiche match">
   <div class="row" style="justify-content:space-between"><span class="eyebrow">${LGN(m.lg)} · ${dayLbl(m.ko)} ${hm(m.ko)} · arbitre ${REFS[m.ref]}</span><span class="row"><button class="star${S.favs.has(m.id)?' on':''}" data-act="fav:${m.id}" aria-label="Favori">${S.favs.has(m.id)?'★':'☆'}</button><button class="x" data-act="close">Fermer</button></span></div>
   <div class="score"><span class="nm" style="font-size:18px">${esc(h.n)}</span><span class="sc">${st?st.hg+' – '+st.ag:'vs'}</span><span class="nm a" style="font-size:18px">${esc(a.n)}</span></div>
   <div class="row" style="justify-content:center">${m.status==='LIVE'?`<span class="live">${Math.floor(st.minute)}'</span>`:m.status==='FT'?'<span class="tm">Terminé · MT '+st.htH+'-'+st.htA+'</span>':''}${riskB(m.risk)}<span class="pill s-A">${h.pos}e (${h.pts} pts) vs ${a.pos}e (${a.pts} pts)</span></div>

/* ============ Bankroll : suivi des mises ============ */
const bankNow=()=>S.bank.init+S.bets.reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0);
const bankPending=()=>S.bets.filter(b=>b.status==='C').reduce((s,b)=>s+b.stake,0);
function dayLoss(){const t0=Date.now()-24*H;return -S.bets.filter(b=>b.set&&b.set>t0).reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0)}
function suggestStake(p,odds){
  const cap=bankNow()*S.bank.maxPct/100;
  const k=(p*odds-1)/(odds-1);
  if(k>0)return{stake:Math.max(1,Math.min(cap,bankNow()*k*S.bank.kelly)),why:'¼ Kelly'.replace('¼',S.bank.kelly===.25?'¼':S.bank.kelly===.5?'½':'⅛')};
  return{stake:Math.max(1,Math.min(cap,bankNow()*.01)),why:'mise plate 1 % (pas de value)'};
}
function addBet(legs,label){
  if(dayLoss()>=S.bank.init*S.bank.dayLoss/100){toast('Limite de perte du jour atteinte : aucune nouvelle mise avant demain.','var(--ba)');return}
  const p=legs.reduce((a,l)=>a*l.p,1),odds=+legs.reduce((a,l)=>a*l.odds,1).toFixed(2);
  const sg=suggestStake(p,odds);
  S.bets.unshift({id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1e4),label,legs:legs.map(l=>({mid:l.mid,sp:l.sp,label:l.label,p:l.p,odds:l.odds,st:null})),p,odds,stake:+sg.stake.toFixed(2),why:sg.why,status:'C',at:Date.now(),set:null});
  toast('Ajouté à la bankroll : '+label+' · mise '+dec(sg.stake,2)+' € ('+sg.why+')','var(--ac)');
  save();renderNav();
}
function settleBets(){
  let ch=false;
  S.bets.forEach(b=>{
    if(b.status!=='C')return;
    const before=b.status;
    b.legs.forEach(l=>{if(l.st)return;const m=MB(l.mid);if(!m||m.status==='NS'||!m.st)return;const r=evalSel(l.sp,m.st);if(r){l.st=r;ch=true}});
    if(b.legs.some(l=>l.st==='P')){b.status='P';b.set=Date.now();ch=true}
    else if(b.legs.every(l=>l.st)){const o=b.legs.reduce((a,l)=>a*(l.st==='R'?1:l.odds),1);b.odds=+o.toFixed(2);b.status=b.legs.every(l=>l.st==='R')?'R':'V';b.set=Date.now();ch=true}
    if(before==='C'&&b.status!=='C')toast('Bankroll : '+b.label+' → '+{V:'gagné',P:'perdu',R:'remboursé'}[b.status],b.status==='V'?'var(--ok)':b.status==='P'?'var(--ba)':'var(--mu)');
  });
  if(ch)save();
  return ch;
}

function simModel(m){
  const s=S.sim,x=s.red?s.red/93:1;

  const stat={...m.stat,corners:m.stat.corners*(s.rain?1.06:1),cards:m.stat.cards+(s.red?.6:0)+(s.rain?.2:0)};
  return{lh,la,stat};
}

/* ============ Comparateur d'équipes (radar) ============ */
function radar(A,B){
  const ks=['xg','shots','sot','corners','assists','tackles','fouls','cards'],N=ks.length,cx=150,cy=130,r=95;
  const avg=(t,k)=>t.h[k].f.reduce((s,v)=>s+v,0)/10;
  const mx=Object.fromEntries(ks.map(k=>[k,Math.max(...Object.values(TEAMS).map(t=>avg(t,k)))||1]));
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f]};
  const poly=t=>ks.map((k,i)=>pt(i,avg(t,k)/mx[k]).map(v=>v.toFixed(1)).join(',')).join(' ');
  return`<svg viewBox="0 0 300 265" width="100%" style="max-width:340px" role="img" aria-label="Comparaison">
  ${[.25,.5,.75,1].map(f=>`<polygon points="${ks.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--ln)"/>`).join('')}
  ${ks.map((k,i)=>{const[x,y]=pt(i,1);const[lx,ly]=pt(i,1.18);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ln)"/><text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="var(--mu)">${METRICS.find(M=>M.k===k).n}</text>`}).join('')}
  <polygon points="${poly(A)}" fill="var(--ac)" fill-opacity=".18" stroke="var(--ac)" stroke-width="2"/>
  <polygon points="${poly(B)}" fill="var(--ac2)" fill-opacity=".18" stroke="var(--ac2)" stroke-width="2"/></svg>
  <div class="legend"><span style="color:var(--ac)">■ ${esc(A.n)}</span><span style="color:var(--ac2)">■ ${esc(B.n)}</span></div>`;
}
