  // Matchs déjà joués du journal réel (qui ne sont plus dans les prédictions à venir)
  Object.entries(R.picks||{}).forEach(([id,p])=>{
    if(matches.some(m=>m.id===id))return;
    const m={id,lg:p.lg,h:team(p.lg,p.h),a:team(p.lg,p.a),ko:koOf(p.d,null),status:'NS',sels:[],mom:[],ev:[],lh:1.3,la:1.1,
      stake:{idx:null,label:'—',txt:''},oh:[],ilog:[],signals:[],risk:0,ghost:true};
    const res=R.results&&R.results[id];if(res){m.status='FT';m.st=realSt(res)}
    matches.push(m);
  });
  Object.entries(R.standings||{}).forEach(([lg,table])=>table.forEach(r=>{
    const t=Object.values(TEAMS).find(t=>t.lg===lg&&sameTeam(t.n,r.team));
    if(t){t.pos=r.pos;t.pts=r.pts;t.played=r.played;t.gd=r.gd;t.form=r.form}}));
  matches.sort((a,b)=>a.ko-b.ko);
  DATA={generated:R.generated,genAt:Date.now(),matches,T:[]};
  // Journal : la sélection figée par le moteur avant chaque match
  Object.entries(R.picks||{}).forEach(([mid,p],i)=>{
    const sp=specOf(p.key);if(!sp)return;const m=matches.find(x=>x.id===mid);const s=m&&m.sels.find(x=>x.rk===p.key);
    DATA.T.push({id:'t'+i,mid,key:keyOf(sp),sp,g:groupOf(p.key),label:p.label,p:p.p,odds:s?s.best:+(1/p.p).toFixed(2),ic:s?s.ic:p.p*100,
      val:s?s.val:null,status:'A',at:koOf(p.fz,'00:00'),set:null,live:false});
  });
}

function ring(p,size=46){
  const r=size/2-5,c=2*Math.PI*r,cls=confCls(p);
  return`<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${pc(p)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--c)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle">${Math.round(p*100)}</text></svg>`;
}
function spark(arr,w=160,h=40,alert=false){
  if(!arr||arr.length<2)return'';
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1,pad=4;
  const X=i=>pad+i*(w-2*pad)/(arr.length-1),Y=v=>h-pad-(v-mn)/rg*(h-2*pad);
  const d=arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return`<svg class="spark${alert?' alert':''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution"><line class="grid" x1="${pad}" x2="${w-pad}" y1="${h/2}" y2="${h/2}"/><path class="a" d="${d} L${X(arr.length-1).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z"/><path class="l" d="${d}"/><circle cx="${X(arr.length-1).toFixed(1)}" cy="${Y(arr[arr.length-1]).toFixed(1)}" r="2.8"/></svg>`;
}
function bars(arr,w=150,h=34,flagLast=false){
  const mx=Math.max(...arr,1),bw=(w-2)/arr.length;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="10 derniers matchs">${arr.map((v,i)=>{const bh=Math.max(1.5,v/mx*(h-2));return`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${flagLast&&i===arr.length-1?'var(--or)':'var(--ac2)'}" opacity="${i===arr.length-1?1:.55}"/>`}).join('')}</svg>`;
}
function momentum(m,w=300,h=44){
  const a=m.mom.slice(-40);if(!a.length)return'';const bw=w/40;
  return`<svg class="mom" width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Momentum"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="var(--ln)"/>${a.map((v,i)=>{const bh=Math.abs(v)*(h/2-2);return`<rect x="${(i*bw).toFixed(1)}" y="${(v>0?h/2-bh:h/2).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${v>0?'var(--ac)':'var(--ac2)'}"/>`}).join('')}</svg>`;
}

const scoreOf=(mode,s)=>mode==='surete'?s.p*s.ic:mode==='rendement'?s.best*s.ic:Math.sqrt(s.p)*(s.p*s.best)*s.ic;
function candidates({scope,min,max,q,excl,mode}){
  const now=Date.now(),f=firstKo(),end=scope==='jour'?dayEnd(f):f+14*24*H;
  return DATA.matches.filter(m=>m.status==='NS'&&m.ko>now+5*60e3&&m.ko<=end&&lvl(m.risk)<=1&&!(excl&&excl.has(m.id))&&(!q||matchText(m).includes(q)))
    .map(m=>{const c=m.sels.filter(s=>s.p>=min&&s.p<=max);if(!c.length)return null;const s=c.reduce((a,b)=>scoreOf(mode,b)>scoreOf(mode,a)?b:a);return{mid:m.id,selId:s.id,key:s.key,label:s.label,p:s.p,odds:s.best,ic:s.ic,val:s.val,g:s.g,sc:scoreOf(mode,s)}})
    .filter(Boolean).sort((a,b)=>b.sc-a.sc);
}
function generate(n,o){return candidates(o).slice(0,n)}

const pauseDate=()=>new Date(S.pausedUntil).toLocaleDateString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const unpauseCtl=()=>S.unpauseAsk
  ?`<span class="row" style="gap:8px"><b>Lever la pause maintenant ?</b><button class="btn pri" data-act="unpause">Oui, lever la pause</button><button class="btn" data-act="unpauseCancel">Annuler</button></span>`
  :`<button class="btn" data-act="unpauseAsk">Lever la pause</button>`;
const pauseBox=()=>`<div class="warn row" style="justify-content:space-between;gap:10px"><span>Pause jeu responsable active jusqu'au ${pauseDate()} : les coupons, le Combo et les mises sont désactivés. Vous pouvez la lever à tout moment.</span>${unpauseCtl()}</div>`;
function blockedByPause(){if(!paused())return false;toast('Pause jeu responsable active jusqu\'au '+pauseDate()+'.','var(--wa)');return true}
function doGenerate(){
  if(blockedByPause())return;
  const items=generate(S.cSize,couponOpts());
  S.coupon={items,at:Date.now(),size:S.cSize};S.alt=null;
  S.couponMsg=items.length<S.cSize?`Seulement ${items.length} sélection(s) remplissent les critères (${S.cMin}-98 %, intégrité verte ou jaune). Baissez le seuil ou élargissez la recherche.`:`Coupon généré : ${items.length} sélections entre ${S.cMin} et 98 %.`;
  pushHist();save();render();
}
function doRegenerate(){
  if(blockedByPause())return;
  if(!S.coupon||S.coupon.size!==S.cSize)return doGenerate();
  const cur=S.coupon.items.map(refreshItem);
  const excl=new Set(cur.map(i=>i.mid));
  const nw=generate(S.cSize,{...couponOpts(),excl});
  const locked=cur.filter(i=>i.lock),free=cur.filter(i=>!i.lock).sort((a,b)=>b.p-a.p);
  const pool=nw.slice();const final=[...locked];let rep=0;
  free.forEach(old=>{const k=pool.findIndex(n=>n.p>old.p||(n.p===old.p&&n.ic>old.ic));if(k>=0){final.push({...pool[k],isNew:true});pool.splice(k,1);rep++}else final.push({...old,isNew:false})});
  while(final.length<S.cSize&&pool.length){final.push({...pool.shift(),isNew:true});rep++}
  S.alt=nw;
  S.coupon={items:final.map(i=>({...i,lock:!!i.lock})),at:Date.now(),size:S.cSize};
  S.couponMsg=rep?`${rep} sélection(s) remplacée(s) par un pourcentage plus élevé (surlignées). Les autres sont conservées.`:'Coupon déjà optimal : les nouvelles sélections ont un pourcentage plus faible, les meilleures sont conservées. Les nouvelles propositions sont affichées à côté.';
  pushHist();save();render();
}
function pushHist(){const c=S.coupon;if(!c)return;const pr=c.items.reduce((a,i)=>a*i.p,1),o=c.items.reduce((a,i)=>a*i.odds,1);S.couponHist.unshift({at:c.at,n:c.items.length,p:pr,o});S.couponHist=S.couponHist.slice(0,8)}
function couponList(items,showLock){
  const pr=items.reduce((a,i)=>a*i.p,1),o=items.reduce((a,i)=>a*i.odds,1);
  return`<div class="list">${items.map((i,k)=>{const m=MB(i.mid);return`<div class="cp-item${i.isNew?' new':''}"><span class="ix">${k+1}</span>
    <div class="teams" data-act="open:${m.id}" style="cursor:pointer"><span style="font-weight:600">${esc(i.label)}</span><span class="mu" style="font-size:12px">${esc(TN(m.h))} – ${esc(TN(m.a))} · ${hm(m.ko)} · ${LGN(m.lg)}</span></div>
    <span class="cp ${confCls(i.p)}">${pc(i.p)}</span><span class="num hide-s">${od(i.odds)}</span>
    ${showLock?`<button class="lock${i.lock?' on':''}" data-act="lock:${k}" aria-label="Verrouiller">${i.lock?'🔒':'🔓'}</button>`:'<span></span>'}</div>`}).join('')}
    <div class="total"><div><b>${pc(pr)}</b><span>probabilité combinée</span></div><div><b>${od(o)}</b><span>cote totale</span></div><div><b>${dec((pr*o-1)*100)} %</b><span>espérance (EV)</span></div><div><b>${items.length}</b><span>sélections</span></div></div></div>`;
}
V.coupons={head:()=>`<div class="ph"><div><div class="eyebrow">Coupons du jour · prochaine journée</div><h2>Générer un coupon à haute probabilité</h2><p>Une sélection par match, probabilité calibrée entre le seuil choisi et 98 %, matchs en alerte orange ou rouge exclus.</p></div></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
   <div class="row"><span class="eyebrow">Taille</span><div class="chips">${[2,3,5,8,10].map(n=>`<button class="chip${S.cSize===n?' on':''}" data-act="cSize:${n}">${n} matchs</button>`).join('')}</div></div>
   <div class="row" style="gap:22px">
    <label class="lbl" for="cMin"><span>Confiance minimale : <b id="cMinV" style="color:var(--tx)">${S.cMin} %</b> → 98 %</span><input id="cMin" type="range" min="70" max="98" value="${S.cMin}" data-in="cMin"></label>
    <label class="lbl" for="cMode">Mode<select id="cMode" class="inp" data-in="cMode"><option value="surete"${S.cMode==='surete'?' selected':''}>Sûreté (probabilité max.)</option><option value="equilibre"${S.cMode==='equilibre'?' selected':''}>Équilibré</option><option value="rendement"${S.cMode==='rendement'?' selected':''}>Rendement (cote max.)</option></select></label>
    <label class="lbl" for="cQ">Rechercher dans le coupon<input id="cQ" class="inp" data-in="cQ" placeholder="Équipe ou compétition" value="${esc(S.cQ)}" autocomplete="off"></label>
   </div>
   <div class="row"><button class="btn pri" data-act="gen">Générer</button><button class="btn" data-act="regen">Régénérer</button><span class="note">Régénérer ne remplace une sélection que par une autre au pourcentage plus élevé. 🔓 → 🔒 pour la verrouiller.</span></div>
  </div>`,
dyn:()=>{
  if(paused())return pauseBox();
  const c=S.coupon;
  const w=`<div class="warn">Plus il y a de sélections, plus la probabilité du combiné baisse : 10 sélections à 90 % ne passent ensemble que dans ≈ 35 % des cas. Aucun coupon n'est « sûr ». Jouez de manière responsable (18+).</div>`;
  if(!c)return`<div class="list"><div class="empty">Cliquez sur « Générer » pour composer un coupon.</div></div>${w}`;
  return`${S.couponMsg?`<div class="msg">${esc(S.couponMsg)}</div>`:''}
   <div class="grid2" style="align-items:start"><div><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Coupon retenu</h3>${c.items.length?'<button class="btn" data-act="betCoupon">+ Suivre dans la bankroll</button>':''}</div>${c.items.length?couponList(c.items,true):'<div class="list"><div class="empty">Aucune sélection.</div></div>'}</div>
   ${S.alt?`<div><h3 style="margin-bottom:8px">Nouvelle proposition</h3>${S.alt.length?couponList(S.alt,false):'<div class="list"><div class="empty">Aucune autre sélection disponible.</div></div>'}</div>`:''}</div>
   ${w}
   ${S.couponHist.length?`<div><h3 style="margin-bottom:8px">Historique des générations</h3><div class="tw panel" style="padding:0"><table><thead><tr><th>Heure</th><th class="r">Sélections</th><th class="r">Proba. combinée</th><th class="r">Cote</th></tr></thead><tbody>${S.couponHist.map(h=>`<tr><td class="num">${hms(h.at)}</td><td class="r num">${h.n}</td><td class="r num">${pc(h.p)}</td><td class="r num">${od(h.o)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}};

/* ---- Combo ---- */
V.combo={head:()=>`<div class="ph"><div><div class="eyebrow">Combo</div><h2>Composer un combiné sur mesure</h2><p>Le résultat se recalcule à chaque réglage.</p></div></div>
 <div class="panel" style="display:flex;flex-direction:column;gap:14px">
  <div class="row"><div class="chips">${[['jour','Prochaine journée'],['avenir','Matchs à venir (14 jours)']].map(([k,n])=>`<button class="chip${S.comboScope===k?' on':''}" data-act="comboScope:${k}">${n}</button>`).join('')}</div></div>
  <div class="row" style="gap:22px">
   <label class="lbl" for="comboN"><span>Nombre de matchs : <b id="comboNV" style="color:var(--tx)">${S.comboN}</b></span><input id="comboN" type="range" min="1" max="20" value="${S.comboN}" data-in="comboN"></label>
   <div class="lbl">Sélection rapide<div class="chips">${[2,3,5,8,10].map(n=>`<button class="chip${S.comboN===n?' on':''}" data-act="comboN:${n}">${n}</button>`).join('')}</div></div>
   <label class="lbl" for="comboMin"><span>Confiance : <b id="comboMinV" style="color:var(--tx)">${S.comboMin} %</b> → 98 %</span><input id="comboMin" type="range" min="70" max="98" value="${S.comboMin}" data-in="comboMin"></label>
  </div>
  <div class="row"><div class="chips">${[['rendement','Rendement'],['surete','Sûreté'],['equilibre','Équilibré']].map(([k,n])=>`<button class="chip${S.comboMode===k?' on':''}" data-act="comboMode:${k}">${n}</button>`).join('')}</div>
  <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="comboSingles" data-in="comboSingles"${S.comboSingles?' checked':''}> Cotes simples (paris séparés)</label></div>
 </div>`,
dyn:()=>{
  if(paused())return pauseBox();
  const items=generate(S.comboN,{scope:S.comboScope,min:S.comboMin/100,max:.98,mode:S.comboMode});
  if(!items.length)return'<div class="list"><div class="empty">Aucune sélection ne remplit ces critères.</div></div>';
  const short=items.length<S.comboN?`<div class="msg">${items.length} match(s) seulement remplissent les critères.</div>`:'';
  if(S.comboSingles){
    return short+`<div class="tw panel" style="padding:0"><table><thead><tr><th>Sélection</th><th>Match</th><th class="r">Proba.</th><th class="r">Cote</th><th class="r">Value</th><th class="r">Mise ¼ Kelly</th></tr></thead><tbody>${items.map(i=>{const m=MB(i.mid);const k=(i.p*i.odds-1)/(i.odds-1)/4;return`<tr class="click" data-act="open:${m.id}"><td>${esc(i.label)}</td><td class="mu">${esc(TN(m.h))} – ${esc(TN(m.a))}</td><td class="r"><span class="cp ${confCls(i.p)}">${pc(i.p)}</span></td><td class="r num">${od(i.odds)}</td><td class="r num">${i.val==null?'–':dec(i.val*100)+' %'}</td><td class="r num">${i.val==null?'cote réelle absente':k>0?dec(k*100)+' % du capital':'pas de value'}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  const pr=items.reduce((a,i)=>a*i.p,1);
  return short+'<div class="row"><button class="btn" data-act="betCombo">+ Suivre ce combo dans la bankroll</button></div>'+couponList(items,false)+(pr<.5?`<div class="warn">Probabilité combinée de ${pc(pr)} : ce combiné perdra plus souvent qu'il ne gagnera. Réduisez le nombre de matchs ou passez en cotes simples.</div>`:'');
}};

/* ---- Value bets ---- */
V.value={head:()=>`<div class="ph"><div><div class="eyebrow">Value bets</div><h2>Quand la cote est plus haute que la probabilité réelle</h2><p>Value = probabilité du modèle × meilleure cote − 1. Mise conseillée : ¼ du critère de Kelly.</p></div></div>
 <label class="lbl" for="vMin"><span>Value minimale : <b id="vMinV" style="color:var(--tx)">${S.vMin} %</b></span><input id="vMin" type="range" min="1" max="15" value="${S.vMin}" data-in="vMin"></label>`,
dyn:()=>{
  const vb=valueBets().slice(0,80);
  if(!vb.length)return`<div class="list"><div class="empty">${REAL&&REAL.with_odds?'Aucune value bet à ce seuil.':'Aucune cote réelle chargée pour l\'instant : les value bets apparaîtront à la prochaine mise à jour avec The Odds API.'}</div></div>`;
  return`<div class="tw panel" style="padding:0"><table><thead><tr><th>Match</th><th>Sélection</th><th class="r">Proba.</th><th class="r">Cote juste</th><th class="r">Meilleure cote</th><th>Bookmaker</th><th class="r">Value</th><th class="r">¼ Kelly</th><th>Confiance</th><th></th></tr></thead><tbody>
  ${vb.map(({m,s})=>{const k=(s.p*s.best-1)/(s.best-1)/4;return`<tr class="click" data-act="open:${m.id}"><td><div>${esc(TN(m.h))} – ${esc(TN(m.a))}</div><div class="mu" style="font-size:12px">${dayLbl(m.ko)} ${hm(m.ko)}</div></td><td>${esc(s.label)}</td><td class="r"><span class="cp ${confCls(s.p)}">${pc(s.p)}</span></td><td class="r num">${od(s.fair)}</td><td class="r num">${od(s.best)}</td><td class="mu">${s.bk}</td><td class="r"><span class="cp c-hi">+${dec(s.val*100)} %</span></td><td class="r num">${dec(k*100)} %</td><td>${icB(s.ic)}</td><td><button class="add" data-act="bet:${m.id}|${s.id}" aria-label="Ajouter à la bankroll" title="Ajouter à la bankroll">+</button></td></tr>`}).join('')}</tbody></table></div>`;
}};

/* ---- Journal ---- */
V.journal={head:()=>`<div class="ph"><div><div class="eyebrow">Journal</div><h2>Statut de toutes les prédictions</h2><p>Chaque prédiction suivie, avec la cote prise, le statut et la performance réelle du modèle.</p></div></div>
 <div class="row"><div class="chips">${[['all','Tout'],['day','Aujourd\'hui'],['7d','7 jours']].map(([k,n])=>`<button class="chip${S.jPer===k?' on':''}" data-act="jPer:${k}">${n}</button>`).join('')}</div>
 <div class="chips">${[['all','Tous'],['A','En attente'],['C','En cours'],['V','Validés'],['P','Perdus'],['R','Push']].map(([k,n])=>`<button class="chip${S.jSt===k?' on':''}" data-act="jSt:${k}">${n}</button>`).join('')}</div>
 <select id="jG" class="inp" data-in="jG" aria-label="Marché"><option value="all">Tous les marchés</option>${GROUPS.map(g=>`<option${S.jG===g?' selected':''}>${g}</option>`).join('')}</select></div>`,
dyn:()=>{
  const now=Date.now();
  let L=DATA.T.filter(t=>{const m=MB(t.mid);if(S.jPer==='day'&&Math.abs(m.ko-now)>24*H)return false;if(S.jPer==='7d'&&m.ko<now-7*24*H)return false;return S.jG==='all'||t.g===S.jG});
  const cnt=k=>L.filter(t=>t.status===k).length;const pf=perf(L);
  const buckets=[[.65,.70],[.70,.80],[.80,.90],[.90,.99]].map(([a,b])=>{const x=L.filter(t=>t.p>=a&&t.p<b&&'VP'.includes(t.status));const v=x.filter(t=>t.status==='V').length;return{a,b,n:x.length,pred:x.length?x.reduce((s,t)=>s+t.p,0)/x.length:0,obs:x.length?v/x.length:0}});
  const rows=L.filter(t=>S.jSt==='all'||t.status===S.jSt).sort((a,b)=>MB(b.mid).ko-MB(a.mid).ko).slice(0,200);
  return`<div class="kpis"><div class="kpi"><b>${L.length}</b><span>prédictions</span></div><div class="kpi"><b style="color:var(--info)">${cnt('C')+cnt('A')}</b><span>en cours / en attente</span></div><div class="kpi"><b style="color:var(--ok)">${cnt('V')}</b><span>validées</span></div><div class="kpi"><b style="color:var(--ba)">${cnt('P')}</b><span>perdues</span></div><div class="kpi"><b>${cnt('R')}</b><span>push (remboursées)</span></div><div class="kpi"><b>${pc(pf.hit)}</b><span>réussite · ROI ${pf.roi>=0?'+':''}${dec(pf.roi*100)} %</span></div></div>
  <div class="grid2" style="align-items:start">
   <div class="panel"><h3>Calibration</h3><p class="note">Une probabilité annoncée doit se réaliser aussi souvent qu'annoncé.</p><div class="tw"><table><thead><tr><th>Tranche</th><th class="r">Réglées</th><th class="r">Annoncé</th><th class="r">Observé</th><th>Écart</th></tr></thead><tbody>${buckets.map(b=>`<tr><td class="num">${Math.round(b.a*100)}-${Math.round(b.b*100)} %</td><td class="r num">${b.n}</td><td class="r num">${b.n?pc(b.pred):'–'}</td><td class="r num">${b.n?pc(b.obs):'–'}</td><td>${b.n?`<span class="cp ${Math.abs(b.obs-b.pred)<.06?'c-hi':Math.abs(b.obs-b.pred)<.12?'c-mid':'c-bad'}">${b.obs-b.pred>=0?'+':''}${Math.round((b.obs-b.pred)*100)} pts</span>`:''}</td></tr>`).join('')}</tbody></table></div><p class="note">Échantillon réduit sur quelques jours : l'écart se resserre avec le volume.</p></div>
   <div class="panel"><h3>Performance par marché</h3><div class="tw"><table><thead><tr><th>Marché</th><th class="r">V</th><th class="r">P</th><th class="r">Réussite</th><th class="r">ROI</th></tr></thead><tbody>${GROUPS.map(g=>{const p=perf(L.filter(t=>t.g===g));return p.n?`<tr><td>${g}</td><td class="r num">${p.v}</td><td class="r num">${p.p}</td><td class="r num">${pc(p.hit)}</td><td class="r num">${p.roi>=0?'+':''}${dec(p.roi*100)} %</td></tr>`:''}).join('')}</tbody></table></div></div>
  </div>
  <div class="tw panel" style="padding:0"><table><thead><tr><th>Match</th><th>Prédiction</th><th>Type</th><th class="r">Proba.</th><th class="r">Cote</th><th class="r">Score</th><th>Statut</th></tr></thead><tbody>
  ${rows.map(t=>{const m=MB(t.mid);return`<tr class="click" data-act="open:${m.id}"><td><div>${esc(TN(m.h))} – ${esc(TN(m.a))}</div><div class="mu" style="font-size:12px">${dayLbl(m.ko)} ${hm(m.ko)} · ${LGN(m.lg)}</div></td><td>${esc(t.label)}</td><td class="mu">${t.live?'Live':'Pré-match'}</td><td class="r"><span class="cp ${confCls(t.p)}">${pc(t.p)}</span></td><td class="r num">${od(t.odds)}</td><td class="r num">${m.status==='NS'?'–':m.st.hg+'-'+m.st.ag+(m.status==='LIVE'?' ('+Math.floor(m.st.minute)+'\')':'')}</td><td>${stPill(t.status)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Aucune prédiction.</td></tr>'}</tbody></table></div>`;
}};

/* ---- Intégrité ---- */
V.integ={head:()=>`<div class="ph"><div><div class="eyebrow">Intégrité · détection d'anomalies de marché</div><h2>Matchs aux mouvements de cotes inhabituels</h2><p>Signaux statistiques (z-score robuste, divergence entre bookmakers, volumes), pas des preuves de trucage. Une suspicion réelle se signale aux autorités sportives ou au régulateur.</p></div></div>
 <div class="row"><div class="chips">${[['all','Tous les signaux'],['1','À surveiller +'],['2','Suspect +'],['3','Très suspect']].map(([k,n])=>`<button class="chip${S.iLvl===k?' on':''}" data-act="iLvl:${k}">${n}</button>`).join('')}</div>
 <div class="legend">${LVN.map((n,i)=>`<span class="risk lv${i}">${n}</span>`).join('')}</div></div>`,
dyn:()=>{
  const min=S.iLvl==='all'?1:+S.iLvl;
  const ms=DATA.matches.filter(m=>lvl(m.risk)>=min).sort((a,b)=>(a.status==='FT')-(b.status==='FT')||b.risk-a.risk);

  return`<div class="kpis">${counts.map((c,i)=>`<div class="kpi lv${i}"><b style="color:var(--c)">${c}</b><span>${LVN[i]} (à venir / live)</span></div>`).join('')}</div>
  ${ms.map(m=>{
    const p1=m.sels.find(s=>s.key===keyOf({t:'res',v:'1'}));const imp=1/(m.oh[m.oh.length-1]*1.05);
    const exposed=m.sels.filter(s=>s.p>=.6&&s.p<=.98).sort((a,b)=>b.p-a.p).slice(0,4);
    return`<div class="panel lv${lvl(m.risk)}" style="border-left:3px solid var(--c)"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${LGN(m.lg)} · ${m.status==='LIVE'?'en direct '+Math.floor(m.st.minute)+'\'':m.status==='FT'?'terminé '+m.st.hg+'-'+m.st.ag:dayLbl(m.ko)+' '+hm(m.ko)}</div><h3 data-act="open:${m.id}" style="cursor:pointer">${esc(TN(m.h))} – ${esc(TN(m.a))}</h3></div><div class="row">${riskB(m.risk)}<button class="star${S.favs.has(m.id)?' on':''}" data-act="fav:${m.id}" aria-label="Suivre">${S.favs.has(m.id)?'★':'☆'}</button></div></div>
    <div class="grid2" style="margin-top:10px">
     <div><div class="eyebrow">Cote « victoire ${esc(TN(m.h))} » (24 h)</div>${spark(m.oh,300,60,lvl(m.risk)>=2)}
      <p class="note">Modèle : ${pc(p1.p)} · marché (implicite) : ${pc(imp)} · écart ${Math.round((imp-p1.p)*100)} pts. ${m.dir<0&&lvl(m.risk)>=1?'Le marché pousse la victoire de '+esc(TN(m.h))+'.':lvl(m.risk)>=1?'Le marché se détourne de '+esc(TN(m.h))+'.':''}</p>
      ${m.signals.length?`<ul class="note" style="margin:6px 0 0;padding-left:18px">${m.signals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>

const TSM=[

 {k:'ga',n:'Buts encaissés',v:r=>r[4],pct:false},
 {k:'tot',n:'Total de buts',v:r=>r[3]+r[4],pct:false},

 {k:'cs',n:'Clean sheets',v:r=>r[4]===0?1:0,pct:true},
 {k:'fts',n:'Sans marquer',v:r=>r[3]===0?1:0,pct:true},
 {k:'pts',n:'Points (forme)',v:r=>r[3]>r[4]?3:r[3]===r[4]?1:0,pct:false},
 {k:'ht',n:'Buts en 1re MT',v:r=>r[5]==null?null:r[5]+r[6],pct:false}];
Object.assign(S,{tsM:'gf',tsLeague:'all',tsTeam:null,tsCmp:null});
const tsHist=id=>((REAL&&REAL.team_stats)||{})[id]||[];
const avgOf=a=>{const x=a.filter(v=>v!=null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const tsFmt=(M,v)=>v==null?'–':M.pct?pc(v):dec(v,2);
function tsRow(id,M){
  const h=tsHist(id),vals=h.map(M.v);
  const home=avgOf(h.filter(r=>r[1]==='H').map(M.v)),away=avgOf(h.filter(r=>r[1]==='A').map(M.v));
  const a5=avgOf(vals.slice(-5)),b5=avgOf(vals.slice(-10,-5));
  const prev=vals.slice(0,-1).filter(v=>v!=null),mu=avgOf(prev),sd=prev.length>2?Math.sqrt(prev.reduce((s,v)=>s+(v-mu)**2,0)/prev.length)||Math.sqrt(mu||0)||1:1;
  const last=vals[vals.length-1],z=!M.pct&&last!=null&&mu!=null?(last-mu)/sd:0;
  return{id,t:TEAMS[id],n:h.length,avg:avgOf(vals),home,away,vals,trend:a5!=null&&b5!=null?a5-b5:0,z,last};
}
function formChips(h){return h.slice(-10).map(r=>{const c=r[3]>r[4]?'s-V':r[3]===r[4]?'s-A':'s-P';return`<span class="pill ${c}" title="${esc(r[0]+' '+(r[1]==='H'?'vs ':'à ')+r[2]+' '+r[3]+'-'+r[4])}">${r[3]>r[4]?'V':r[3]===r[4]?'N':'D'}</span>`}).join('')}
function radarReal(A,B,rows){
  const ks=['gf','o25','btts','cs','pts','ht'],N=ks.length,cx=150,cy=130,r=95;
  const val=(id,k)=>avgOf(tsHist(id).map(TSM.find(M=>M.k===k).v))||0;
  const mx=Object.fromEntries(ks.map(k=>[k,Math.max(...rows.map(x=>val(x.id,k)),.01)]));
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f]};
  const poly=id=>ks.map((k,i)=>pt(i,val(id,k)/mx[k]).map(v=>v.toFixed(1)).join(',')).join(' ');
  return`<svg viewBox="0 0 300 265" width="100%" style="max-width:340px" role="img" aria-label="Comparaison">

  ${ks.map((k,i)=>{const[x,y]=pt(i,1);const[lx,ly]=pt(i,1.2);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ln)"/><text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="var(--mu)">${TSM.find(M=>M.k===k).n}</text>`}).join('')}
  <polygon points="${poly(A)}" fill="var(--ac)" fill-opacity=".18" stroke="var(--ac)" stroke-width="2"/>
  <polygon points="${poly(B)}" fill="var(--ac2)" fill-opacity=".18" stroke="var(--ac2)" stroke-width="2"/></svg>

}

V.method={dyn:()=>`<div class="method panel" style="display:flex;flex-direction:column;gap:10px">
 <div class="eyebrow">Méthode</div><h2>Comment OMNISCORE calcule ses pourcentages</h2>
 <p><b>Données réelles.</b> Résultats officiels openfootball complétés par football-data.org (scores, mi-temps, classements), cotes de plusieurs bookmakers via The Odds API, direct et absences via API-Football (AllSportsApi en secours). Instantané du ${new Date((DATA.generated||'')+'T12:00:00').toLocaleDateString('fr-FR')} : la page est mise à jour à chaque relance du moteur.</p>
 <h3>1. Buts attendus et scores</h3><p>Pour chaque ligue, un modèle Dixon-Coles (Poisson bivarié corrigé, pondération temporelle) et une cote Elo sont ajustés sur les résultats officiels depuis 2021. Les deux sont mélangés pour le 1X2 (65 % / 35 %), et tous les marchés de buts (double chance, remboursé si nul, plus/moins, les deux marquent, buts par équipe, 1re mi-temps, scores exacts) sont dérivés de la matrice des scores, puis calibrés (régression isotonique) sur le backtest.</p>
 <h3>2. Enjeu</h3><p>Le classement réel donne l'enjeu de chaque équipe (titre, Europe ou promotion, maintien, milieu de tableau).</p>
 <h3>3. Règlement</h3><p>Chaque prédiction est figée avant le match puis réglée avec le score officiel, y compris la mi-temps quand elle est publiée.</p>
 <h3>4. Indice de confiance</h3><p><code>IC = 100 × p × A^0,6 × D^0,7</code> : A accord entre Dixon-Coles et Elo, D complétude des données de l'équipe (nombre de matchs connus).</p>
 <h3>5. Value et mise</h3><p><code>value = p × cote − 1</code> ; mise <code>¼ × (p × cote − 1) / (cote − 1)</code>.</p>
 <h3>6. Intégrité</h3><p>Historique réel des cotes (une mesure à chaque mise à jour) : rendements logarithmiques et z-score robuste. Score 0-100 : vert &lt; 25, jaune &lt; 50, orange &lt; 75, rouge au-delà. Les matchs orange et rouges sont exclus des coupons. Il faut au moins 4 mesures pour qu'un signal apparaisse.</p>
 <div class="warn">Aucune prédiction n'est garantie. Les pourcentages sont des probabilités, vérifiables dans le Journal (calibration). Réservé aux 18 ans et plus. Jouez de manière responsable : fixez-vous des limites, et demandez de l'aide si le jeu devient un problème.</div>
</div>`};

/* ============ Bankroll : suivi des mises ============ */
const bankNow=()=>S.bank.init+S.bets.reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0);
const bankPending=()=>S.bets.filter(b=>b.status==='C').reduce((s,b)=>s+b.stake,0);
function dayLoss(){const t0=Date.now()-24*H;return -S.bets.filter(b=>b.set&&b.set>t0).reduce((s,b)=>s+(b.status==='V'?b.stake*(b.odds-1):b.status==='P'?-b.stake:0),0)}
function suggestStake(p,odds){
  const cap=bankNow()*S.bank.maxPct/100;
  const k=(p*odds-1)/(odds-1);
  if(k>0)return{stake:Math.max(1,Math.min(cap,bankNow()*k*S.bank.kelly)),why:'¼ Kelly'.replace('¼',S.bank.kelly===.25?'¼':S.bank.kelly===.5?'½':'⅛')};
  return{stake:Math.max(1,Math.min(cap,bankNow()*.01)),why:'mise plate 1 % (pas de value)'};
}
function addBet(legs,label){
  if(blockedByPause())return;
  if(dayLoss()>=S.bank.init*S.bank.dayLoss/100){toast('Limite de perte du jour atteinte : aucune nouvelle mise avant demain.','var(--ba)');return}
  const p=legs.reduce((a,l)=>a*l.p,1),odds=+legs.reduce((a,l)=>a*l.odds,1).toFixed(2);
  const sg=suggestStake(p,odds);
  S.bets.unshift({id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1e4),label,legs:legs.map(l=>({mid:l.mid,sp:l.sp,label:l.label,p:l.p,odds:l.odds,st:null})),p,odds,stake:+sg.stake.toFixed(2),why:sg.why,status:'C',at:Date.now(),set:null});
  toast('Ajouté à la bankroll : '+label+' · mise '+dec(sg.stake,2)+' € ('+sg.why+')','var(--ac)');
  save();renderNav();
}
function settleBets(){
  let ch=false;
  S.bets.forEach(b=>{
    if(b.status!=='C')return;
    const before=b.status;
    b.legs.forEach(l=>{if(l.st)return;const m=MB(l.mid);if(!m||m.status==='NS'||!m.st)return;const r=evalSel(l.sp,m.st);if(r){l.st=r;ch=true}});
    if(b.legs.some(l=>l.st==='P')){b.status='P';b.set=Date.now();ch=true}
    else if(b.legs.every(l=>l.st)){const o=b.legs.reduce((a,l)=>a*(l.st==='R'?1:l.odds),1);b.odds=+o.toFixed(2);b.status=b.legs.every(l=>l.st==='R')?'R':'V';b.set=Date.now();ch=true}
    if(before==='C'&&b.status!=='C')toast('Bankroll : '+b.label+' → '+{V:'gagné',P:'perdu',R:'remboursé'}[b.status],b.status==='V'?'var(--ok)':b.status==='P'?'var(--ba)':'var(--mu)');
  });
  if(ch)save();
  return ch;
}

function radar(A,B){
  const ks=['xg','shots','sot','corners','assists','tackles','fouls','cards'],N=ks.length,cx=150,cy=130,r=95;
  const avg=(t,k)=>t.h[k].f.reduce((s,v)=>s+v,0)/10;
  const mx=Object.fromEntries(ks.map(k=>[k,Math.max(...Object.values(TEAMS).map(t=>avg(t,k)))||1]));
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r*f,cy+Math.sin(a)*r*f]};
  const poly=t=>ks.map((k,i)=>pt(i,avg(t,k)/mx[k]).map(v=>v.toFixed(1)).join(',')).join(' ');
  return`<svg viewBox="0 0 300 265" width="100%" style="max-width:340px" role="img" aria-label="Comparaison">
  ${[.25,.5,.75,1].map(f=>`<polygon points="${ks.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--ln)"/>`).join('')}
  ${ks.map((k,i)=>{const[x,y]=pt(i,1);const[lx,ly]=pt(i,1.18);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ln)"/><text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="var(--mu)">${METRICS.find(M=>M.k===k).n}</text>`}).join('')}
  <polygon points="${poly(A)}" fill="var(--ac)" fill-opacity=".18" stroke="var(--ac)" stroke-width="2"/>
  <polygon points="${poly(B)}" fill="var(--ac2)" fill-opacity=".18" stroke="var(--ac2)" stroke-width="2"/></svg>
  <div class="legend"><span style="color:var(--ac)">■ ${esc(A.n)}</span><span style="color:var(--ac2)">■ ${esc(B.n)}</span></div>`;
}

const AI_RULES=`Tu es l'analyste d'OMNISCORE, une application d'analyse et de prédiction football. Réponds en français, de façon claire, structurée et concise (listes courtes, chiffres précis).
Règles :
- Appuie-toi uniquement sur les données de l'application (outils ou contexte fourni). N'invente aucun chiffre, joueur ou information.
- Les données sont réelles (résultats officiels, classements, cotes des bookmakers quand elles sont chargées) mais figées à la date de mise à jour de la page : précise-la si on te demande du direct.
- Une probabilité n'est jamais une certitude. Donne toujours le pourcentage, la cote et le niveau de confiance, et rappelle le risque pour les combinés.
- Pour l'intégrité, parle de « signaux de marché inhabituels », jamais de match truqué avéré.
- Si l'utilisateur semble perdre le contrôle de ses paris, recommande une pause et des limites.`;
function aiContext(){
  const up=upcoming(30).map(m=>matchBrief(m)).filter(x=>x.meilleure_prediction).slice(0,20);
  return'Données actuelles de l\'application (JSON) :\n'+JSON.stringify({heure:hm(Date.now()),matchs_a_venir:up,en_direct:DATA.matches.filter(m=>m.status==='LIVE').map(matchBrief),value_bets:AI_TOOLS[2].execute(),alertes_integrite:DATA.matches.filter(m=>m.status!=='FT'&&lvl(m.risk)>=1).map(matchBrief).slice(0,8),performance:AI_TOOLS[6].execute()});
}
async function askAI(text){
  text=String(text||'').trim();if(!text||!SAMPLE||S.aiBusy)return;
  S.chat.push({role:'user',content:text});S.chat.push({role:'assistant',content:'',pending:true});S.aiBusy=true;render();
  const bubble=()=>document.querySelector('#chat .msg-a:last-child .bd2');
  AICTL=new AbortController();
  const turns=S.chat.filter(t=>!t.pending&&t.content).slice(-12).map(t=>({role:t.role,content:t.content}));
  const input=[{role:'user',content:AI_RULES+(SAMPLE_TOOLS?'\nUtilise les outils pour consulter les données avant de répondre.':'\n\n'+aiContext())},{role:'assistant',content:'Compris. Quelle est votre question ?'},...turns];
  const last=S.chat[S.chat.length-1];
  try{
    const opts={signal:AICTL.signal,onText:({text})=>{last.content=text;const b=bubble();if(b)b.innerHTML=mdLite(text)}};
    if(SAMPLE_TOOLS)opts.tools=AI_TOOLS.map(t=>({...t,execute:(i,c)=>{const b=bubble();if(b&&!last.content)b.textContent='Consultation des données : '+t.name.replace(/_/g,' ')+'…';return t.execute(i||{},c)}}));else opts.cache=false;
    const r=await SAMPLE(input,opts);last.content=r.text;if(r.truncated)last.content+='\n\n(Réponse coupée : posez une question plus précise.)';
  }catch(e){last.content=(e&&e.text)||'';if(e?.code!=='cancelled')last.err=aiErr(e);if(['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e?.code))SAMPLE=null}
  delete last.pending;S.aiBusy=false;AICTL=null;save();if(S.tab==='assistant')render();
}

async function explainMatch(m){
  const out=$('#aiOut');if(!out||!SAMPLE)return;
  out.hidden=false;out.innerHTML='<span class="mu">Analyse en cours…</span>';
  const prompt=AI_RULES+'\n\nRédige une analyse experte de ce match en 5 parties courtes : contexte et enjeu, forces en présence, lecture du marché et intégrité, les 3 options les plus solides (proba, cote, confiance), et un avertissement de risque. Maximum 220 mots.\n\n'+JSON.stringify(matchDetail(m));

const RLG={'en.1':'Premier League','es.1':'LaLiga','it.1':'Serie A','de.1':'Bundesliga','fr.1':'Ligue 1','nl.1':'Eredivisie','pt.1':'Liga Portugal','en.2':'Championship'};
const TRIVIAL=new Set(['O0.5','U4.5','HO0.5','AO0.5']);
Object.assign(S,{rLg:'all',rOpen:null,rSize:3,rMin:75,rMode:'surete',rNoTriv:true});
const rOk=(x,min=.70,max=.98)=>x[2]>=min&&x[2]<=max&&!x[0].startsWith('CS')&&!x[0].startsWith('DNB')&&!(S.rNoTriv&&TRIVIAL.has(x[0]));
const rTop=m=>m.mk.filter(x=>rOk(x)).reduce((a,b)=>!a||b[3]>a[3]?b:a,null);
const rScore=(x,mode)=>{const p=x[2],ic=x[3],o=x[4]||1/p;return mode==='rendement'?o*ic:mode==='equilibre'?Math.sqrt(p)*p*o*ic:p*ic};
const rDate=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const rOut=(h,a)=>h>a?'1':h===a?'X':'2';
function settleKey(k,hg,ag){
  const o=rOut(hg,ag);
  if(k==='1'||k==='X'||k==='2')return o===k?'V':'P';
  if(k==='1X'||k==='X2'||k==='12')return k.includes(o)?'V':'P';
  if(k.startsWith('DNB'))return o==='X'?'R':o===k.slice(-1)?'V':'P';
  if(k==='BTTS_Y')return hg>0&&ag>0?'V':'P';
  if(k==='BTTS_N')return hg>0&&ag>0?'P':'V';
  if(k.startsWith('CS')){const[a,b]=k.slice(2).split('-').map(Number);return hg===a&&ag===b?'V':'P'}
  if(k.startsWith('HT'))return null; // score à la mi-temps non disponible
  if((k[0]==='H'||k[0]==='A')&&(k[1]==='O'||k[1]==='U')){const g=k[0]==='H'?hg:ag;return(g>+k.slice(2))===(k[1]==='O')?'V':'P'}
  if(k[0]==='O'||k[0]==='U')return(hg+ag>+k.slice(1))===(k[0]==='O')?'V':'P';
  return null;
}
const itemStatus=it=>{const r=REAL&&REAL.results&&REAL.results[it.mid];return r?settleKey(it.key,r[0],r[1]):null};

function rGen(){
  const c=REAL.matches.filter(m=>S.rLg==='all'||m.lg===S.rLg).map(m=>{const ok=m.mk.filter(x=>rOk(x,S.rMin/100));if(!ok.length)return null;const b=ok.reduce((a,x)=>rScore(x,S.rMode)>rScore(a,S.rMode)?x:a);return{m,x:b}}).filter(Boolean);

 <div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="gap:18px"><span class="eyebrow">Coupon sur matchs réels</span><div class="chips">${[2,3,5,8,10].map(n=>`<button class="chip${S.rSize===n?' on':''}" data-act="rSize:${n}">${n}</button>`).join('')}</div>
  <label class="lbl" for="rMin"><span>Confiance min. : <b id="rMinV" style="color:var(--tx)">${S.rMin} %</b></span><input id="rMin" type="range" min="70" max="98" value="${S.rMin}" data-in="rMin"></label>
  <div class="chips">${[['surete','Sûreté'],['equilibre','Équilibré'],['rendement','Rendement']].map(([k,n])=>`<button class="chip${S.rMode===k?' on':''}" data-act="rMode:${k}">${n}</button>`).join('')}</div>
  <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="rNoTriv" data-in="rNoTriv"${S.rNoTriv?' checked':''}> Exclure « plus de 0,5 but » et « moins de 4,5 »</label></div><div id="rCoupon"></div></div>`:'',
dyn:()=>{
  if(!REAL)return'<div class="panel">Données réelles absentes : lancez <code>python -m omniscore.cli predict</code> puis <code>python scripts/export_prototype.py</code>.</div>';
  const sel=rGen();const pr=sel.reduce((a,s)=>a*s.x[2],1),fo=sel.reduce((a,s)=>a*(1/s.x[2]),1);

   ${sel.length?`<div class="row"><button class="btn pri" data-act="rSave"${paused()?' disabled':''}>Enregistrer ce coupon</button><span class="note">${CLOUD.ref?'Enregistré dans votre compte, visible sur tous vos appareils.':'Enregistré dans ce navigateur.'}</span></div>`:''}
   ${myRealCoupons()}`;
  setTimeout(()=>{const el=$('#rCoupon');if(el)el.innerHTML=paused()?pauseBox()+myRealCoupons():coup});
  const ms=REAL.matches.filter(m=>S.rLg==='all'||m.lg===S.rLg);
  const days=[...new Set(ms.map(m=>m.d))];
  return days.map(d=>`<div class="list"><div class="lg">${rDate(d)}</div>${ms.filter(m=>m.d===d).map(realRow).join('')}</div>`).join('');
}};
function calibChart(rows){
  const W=420,H=300,L=46,B=36,T=12,Rr=24,x=v=>L+(v-.5)/.5*(W-L-Rr),y=v=>H-B-(v-.5)/.5*(H-B-T);
  const pts=rows.filter(r=>r.n>0&&r.annonce>=.5);
  const tk=[.5,.6,.7,.8,.9,1];
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="Calibration : probabilité annoncée contre fréquence observée">
  ${tk.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mu)">${v*100} %</text><text x="${x(v)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="var(--mu)">${v*100} %</text>`).join('')}
  <line x1="${x(.5)}" y1="${y(.5)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--mu)" stroke-dasharray="4 4"/>
  <text x="${x(.93)}" y="${y(.97)-8}" font-size="11" text-anchor="end" fill="var(--mu)">calibration parfaite</text>
  <polyline points="${pts.map(r=>x(r.annonce)+','+y(r.observe)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2"/>
  ${pts.map(r=>`<circle cx="${x(r.annonce)}" cy="${y(r.observe)}" r="${Math.max(4.5,Math.min(9,Math.sqrt(r.n)/10))}" fill="var(--ac)" stroke="var(--sf)" stroke-width="2"><title>${r.tranche} : annoncé ${pc(r.annonce)}, observé ${pc(r.observe)} (${r.n.toLocaleString('fr-FR')} prédictions)</title></circle>`).join('')}
  <text x="${(L+W-Rr)/2}" y="${H-4}" font-size="11" text-anchor="middle" fill="var(--mu)">Probabilité annoncée</text>
  <text x="12" y="${(T+H-B)/2}" font-size="11" text-anchor="middle" fill="var(--mu)" transform="rotate(-90 12 ${(T+H-B)/2})">Fréquence observée</text></svg>`;
}
function trackPanel(){
  const t=REAL.track;if(!t)return'';
  const hit=t.picks?t.picks_won/t.picks:null;
  return`<div class="panel"><div class="row" style="justify-content:space-between"><h3>Journal réel : prédictions figées avant les matchs</h3><span class="pill s-C">${t.pending} en attente</span></div>
   <p class="note">Contrairement au backtest, ces prédictions sont enregistrées avant le coup d'envoi et ne sont jamais modifiées. Elles se règlent chaque jour avec les résultats officiels (mise à jour automatique via GitHub Actions).</p>
   <div class="kpis"><div class="kpi"><b>${t.frozen}</b><span>prédictions figées</span></div><div class="kpi"><b>${t.settled}</b><span>matchs réglés</span></div><div class="kpi"><b>${hit==null?'–':pc(hit)}</b><span>sélections 70-98 % gagnées${t.picks?' ('+t.picks_won+'/'+t.picks+', annoncé '+pc(t.picks_mean_p)+')':''}</span></div><div class="kpi"><b>${t.rps!=null?dec(t.rps,3):'–'}</b><span>RPS 1X2 en conditions réelles</span></div></div>
   ${t.recent&&t.recent.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Match</th><th class="r">Score</th><th>Sélection</th><th>Statut</th></tr></thead><tbody>${t.recent.map(x=>`<tr><td class="num">${rDate(x.date)}</td><td>${esc(x.match)}</td><td class="r num">${x.result.join('-')}</td><td>${x.pick?esc(x.pick.label)+' · '+pc(x.pick.p):'–'}</td><td>${x.pick&&x.pick.status?stPill(x.pick.status):''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Les premiers résultats arriveront après les matchs du '+rDate(REAL.matches[0].d)+'</p>'}</div>`;
}
V.proof={head:()=>`<div class="ph"><div><div class="eyebrow">Précision prouvée · backtest sur données réelles</div><h2>Ce que valent vraiment les pourcentages</h2><p>Chaque semaine des saisons ${REAL?REAL.report.test.concat(REAL.report.train).sort().join(', '):''}, le modèle est ré-entraîné uniquement sur le passé puis prédit les matchs suivants. Aucun match testé n'a servi à l'entraînement.</p></div></div>`,
dyn:()=>{
  if(!REAL)return'<div class="panel">Rapport absent.</div>';
  const r=REAL.report,M=r.models,N={base:'Fréquences de la ligue (référence)',elo:'Elo seul',dc:'Dixon-Coles',blend:'Mélange 65 % DC + 35 % Elo (réglé)'};
  const tot=r.calib.reduce((s,b)=>s+b.n,0);const c3=r.coupons['3'],c5=r.coupons['5'];
  return`<div class="kpis"><div class="kpi"><b>${r.n.toLocaleString('fr-FR')}</b><span>matchs réels testés (${Object.keys(r.leagues).length} ligues)</span></div><div class="kpi"><b>${tot.toLocaleString('fr-FR')}</b><span>prédictions de marchés vérifiées</span></div><div class="kpi"><b>${pc(M.dc.accuracy)}</b><span>bon résultat 1X2 (le hasard : 33 %, la référence : ${pc(M.base.accuracy)})</span></div><div class="kpi"><b>${dec(M.dc.rps,3)}</b><span>RPS Dixon-Coles (plus bas = mieux ; référence ${dec(M.base.rps,3)})</span></div></div>
  <div class="grid2" style="align-items:start">
   <div class="panel"><h3>Calibration : annoncé contre observé</h3><p class="note">Tous marchés confondus. Plus les points collent à la diagonale, plus les pourcentages sont honnêtes.</p>${calibChart(r.calib)}
    <div class="tw"><table><thead><tr><th>Tranche</th><th class="r">Prédictions</th><th class="r">Annoncé</th><th class="r">Observé</th></tr></thead><tbody>${r.calib.filter(b=>b.n).map(b=>`<tr><td class="num">${b.tranche}</td><td class="r num">${b.n.toLocaleString('fr-FR')}</td><td class="r num">${pc(b.annonce)}</td><td class="r num">${pc(b.observe)}</td></tr>`).join('')}</tbody></table></div></div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><h3>Modèles comparés (1X2)</h3><div class="tw"><table><thead><tr><th>Modèle</th><th class="r">RPS</th><th class="r">Log-loss</th><th class="r">Précision</th></tr></thead><tbody>${Object.entries(M).map(([k,v])=>`<tr><td>${N[k]}</td><td class="r num">${dec(v.rps,4)}</td><td class="r num">${dec(v.log_loss,4)}</td><td class="r num">${pc(v.accuracy)}</td></tr>`).join('')}</tbody></table></div>
     <p class="note">Repère : les cotes des bookmakers atteignent en général un RPS proche de 0,19-0,20 sur ces ligues. Le modèle s'en approche avec les seuls résultats ; les cotes, les compositions et les xG réels restent la marge de progression.</p></div>
    <div class="panel"><h3>Coupons testés sur la dernière saison</h3><div class="tw"><table><thead><tr><th>Coupon</th><th class="r">Nombre</th><th class="r">Prévu</th><th class="r">Observé</th></tr></thead><tbody>${Object.entries(r.coupons).map(([n,c])=>`<tr><td>${n} sélections</td><td class="r num">${c.coupons}</td><td class="r num">${pc(c.predicted_win_rate)}</td><td class="r num">${pc(c.observed_win_rate)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel"><h3>Par championnat (Dixon-Coles)</h3><div class="tw"><table><thead><tr><th>Ligue</th><th class="r">RPS</th><th class="r">Précision 1X2</th></tr></thead><tbody>${Object.entries(r.per_league).map(([k,v])=>`<tr><td>${RLG[k]}</td><td class="r num">${dec(v.rps,4)}</td><td class="r num">${pc(v.accuracy)}</td></tr>`).join('')}</tbody></table></div></div>
   </div></div>
  ${trackPanel()}
  <div class="panel method"><h3>Ce que le backtest nous apprend</h3><ul>
   <li><b>Les pourcentages sont fiables.</b> Quand le modèle annonce 70-80 %, l'événement se produit ${pc(r.calib[2].observe)} du temps ; à 80-90 %, ${pc(r.calib[3].observe)}.</li>
   <li><b>Les coupons tiennent leurs promesses statistiques.</b> Coupon de 3 : ${pc(c3.predicted_win_rate)} prévu, ${pc(c3.observed_win_rate)} observé. Coupon de 5 : ${pc(c5.predicted_win_rate)} prévu, ${pc(c5.observed_win_rate)} observé.</li>
   <li><b>Mais les sélections à 90 % et plus sont presque toutes « plus de 0,5 but » ou « moins de 4,5 buts »</b> (cote de 1,03 à 1,10). La marge du bookmaker efface le gain : une forte probabilité n'est pas un pari rentable. C'est pour cela que l'onglet Matchs réels les exclut par défaut.</li>
   <li><b>La vraie prochaine étape est la value</b> : brancher les cotes réelles pour ne garder que les sélections où la cote proposée dépasse la cote juste.</li></ul></div>`;
}};

/* ============ Notifications ============ */
function toast(txt,c){
  S.notes.unshift({t:Date.now(),txt,c:c||'var(--ac)'});S.notes=S.notes.slice(0,40);
  if(!S.ready)return;
  const el=document.createElement('div');el.className='toast';el.style.setProperty('--c',c||'var(--ac)');el.textContent=txt;
  const box=$('#toasts');box.prepend(el);while(box.children.length>4)box.lastChild.remove();
  setTimeout(()=>el.remove(),4500);
}
function notifyGoal(m,side){if(S.favs.has(m.id)||S.favTeams.has(m.h)||S.favTeams.has(m.a))toast('⚽ But '+TN(side==='h'?m.h:m.a)+' ('+Math.floor(m.st.minute)+'\') : '+TN(m.h)+' '+m.st.hg+'-'+m.st.ag+' '+TN(m.a),'var(--ok)')}

/* ============ Événements ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='drawer'){S.drawer=null;$('#drawer').hidden=true}return}
  const[act,arg]=el.dataset.act.split(/:(.*)/s);
  if(['fav','favT','lock'].includes(act))e.stopPropagation();
  switch(act){
    case 'nav':S.tab=arg;S.drawer=null;$('#drawer').hidden=true;render();window.scrollTo(0,0);break;
    case 'open':S.drawer=arg;renderDrawer();break;
    case 'close':S.drawer=null;$('#drawer').hidden=true;break;
    case 'fav':S.favs.has(arg)?S.favs.delete(arg):S.favs.add(arg);save();renderDyn();renderNav();if(S.drawer)renderDrawer();if(S.tab==='live'||S.tab==='integ')renderDyn();break;
    case 'favT':S.favTeams.has(arg)?S.favTeams.delete(arg):S.favTeams.add(arg);save();renderDyn();break;
    case 'team':S.tab='stats';S.stTeam=arg;S.stLeague='all';render();break;
    case 'stTeam':S.stTeam=arg;renderDyn();break;
    case 'calDay':S.calDay=arg;render();break;
    case 'liveSub':S.liveSub=arg;render();break;
    case 'cSize':S.cSize=+arg;render();break;
    case 'gen':doGenerate();break;
    case 'regen':doRegenerate();break;
    case 'lock':{const it=S.coupon.items[+arg];it.lock=!it.lock;save();renderDyn();break}
    case 'comboScope':S.comboScope=arg;render();break;
    case 'comboN':S.comboN=+arg;render();break;
    case 'comboMode':S.comboMode=arg;render();break;
    case 'jPer':case 'jSt':case 'iLvl':case 'stM':case 'stLeague':case 'tsM':case 'tsLeague':S[act]=arg;render();break;
    case 'tsTeam':S.tsTeam=arg;renderDyn();break;
    case 'bet':{const[mid,sid]=arg.split('|');const m=MB(mid);const sl=m&&m.sels.find(x=>x.id===sid);if(sl&&m.status==='NS')addBet([selLeg(m,sl)],sl.label+' ('+TN(m.h)+' – '+TN(m.a)+')');break}
    case 'betCoupon':{const it=S.coupon&&S.coupon.items;if(it&&it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:(m.sels.find(x=>x.key===i.key)||{}).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}).filter(l=>l.sp),'Coupon de '+it.length);break}
    case 'betCombo':{const it=generate(S.comboN,{scope:S.comboScope,min:S.comboMin/100,max:.98,mode:S.comboMode});if(it.length)addBet(it.map(i=>{const m=MB(i.mid);return{mid:i.mid,sp:m.sels.find(x=>x.id===i.selId).sp,label:i.label+' ('+TN(m.h)+' – '+TN(m.a)+')',p:i.p,odds:i.odds}}),'Combo de '+it.length);break}
    case 'delBet':S.bets=S.bets.filter(b=>b.id!==arg);save();renderDyn();break;
    case 'ruleOn':{const r=S.rules.find(r=>r.id===arg);if(r){r.on=!r.on;save();renderDyn()}break}
    case 'ruleDel':S.rules=S.rules.filter(r=>r.id!==arg);save();renderDyn();break;
    case 'aiSug':askAI(V.assistant.sug[+arg]);break;
    case 'aiStop':AICTL?.abort();break;
    case 'aiClear':S.chat=[];save();render();break;
    case 'aiExplain':{const m=MB(arg);if(m)explainMatch(m);break}
    case 'rOpen':S.rOpen=S.rOpen===arg?null:arg;renderDyn();break;
    case 'rLg':S.rLg=arg;S.rOpen=null;render();break;
    case 'rSize':S.rSize=+arg;render();break;
    case 'rMode':S.rMode=arg;render();break;
    case 'rSave':{if(blockedByPause())break;const sel=rGen();if(!sel.length)break;
      S.realCoupons.unshift({id:'rc'+Date.now().toString(36),at:Date.now(),items:sel.map(x=>({mid:x.m.id,key:x.x[0],label:x.x[1],p:x.x[2],match:x.m.h+' – '+x.m.a,d:x.m.d}))});
      S.realCoupons=S.realCoupons.slice(0,100);save();renderDyn();toast('Coupon enregistré : il sera réglé automatiquement.','var(--ok)');break}
    case 'rDel':S.realCoupons=S.realCoupons.filter(c=>c.id!==arg);save();renderDyn();break;
    case 'pause':{const d=clamp(+($('#pauseDays')?.value)||7,1,90);const until=Date.now()+d*24*H;
      if(until>(S.pausedUntil||0)){S.pausedUntil=until;save();toast('Pause activée jusqu\'au '+pauseDate()+'.','var(--wa)')}else toast('Une pause plus longue est déjà active.','var(--mu)');render();break}
    case 'unpauseAsk':S.unpauseAsk=true;render();break;
    case 'unpauseCancel':S.unpauseAsk=false;render();break;
    case 'unpause':S.pausedUntil=0;S.unpauseAsk=false;save();toast('Pause levée.','var(--ok)');render();break;
    case 'simReset':S.sim={attH:0,attA:0,red:0,absH:false,absA:false,rain:false};renderDrawer();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='aiForm'){const i=$('#aiIn');const v=i.value;i.value='';askAI(v)}
  if(e.target.id==='ruleForm'){
    const g=id=>document.getElementById(id).value;
    S.rules.push({id:'r'+Date.now().toString(36),name:(g('rName')||'Alerte').slice(0,40),lg:g('rLg'),g:g('rG'),minP:clamp(+g('rP')||70,50,98),minVal:clamp(+g('rV')||0,-20,30),minIC:clamp(+g('rIC')||0,0,100),on:true});
    checkRules();save();renderDyn();toast('Alerte créée.','var(--info)');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){S.drawer=null;$('#drawer').hidden=true}
  if(e.key==='Enter'&&e.target.matches('[role=button][data-act]'))e.target.click();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  const el=e.target;const v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;
  if(k.includes('.')){const[o,f]=k.split('.');let x=v;if(o==='bank'){x=Number(v);if(f==='init'&&!(x>=10))return}S[o][f]=x;
    const lab=document.getElementById(k+'V');if(lab)lab.textContent=f==='red'?(x||'–'):x+' %';
    if(o==='sim'){const m=MB(S.drawer);const so=$('#simOut');if(m&&so)so.innerHTML=simOut(m)}else{save();renderDyn()}
    return}
  if(k==='cmpB'){S.cmpB=v;renderDyn();return}
  S[k]=v;
  const lab=$('#'+k+'V');if(lab)lab.textContent=v+(k==='comboN'?'':' %');
  if(k==='comboN')document.querySelectorAll('[data-act^="comboN:"]').forEach(b=>b.classList.toggle('on',b.dataset.act==='comboN:'+v));
  renderDyn();
});

S.ready=true;
render();

setInterval(tick,30000);
cloudInit();
