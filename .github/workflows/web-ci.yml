name: Application web - CI

on:
  push:
    paths: ["web/**", "backend/omniscore/**", "backend/data/predictions.json", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "backend/omniscore/**", ".github/workflows/web-ci.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omniscore
          POSTGRES_PASSWORD: omniscore
          POSTGRES_DB: omniscore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniscore" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://omniscore:omniscore@localhost:5432/omniscore
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      OMNISCORE_DATA_DIR: ../backend/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations et synchronisation sur une vraie base
        run: |
          node scripts/migrate.mjs
          npx tsx scripts/sync.mts
          npx tsx scripts/sync.mts
